<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garri Potter 4K</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14; --bg2:#14181f; --card:#161b23; --line:rgba(255,255,255,.09);
  --text:#eef1f5; --dim:#98a2b3;
  --accent:#97a1ae; --accent-2:#5a6472; --accent-rgb:151,161,174; --accent-ink:#0e1117;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  -webkit-font-smoothing:antialiased;
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--text);min-height:100vh;
  display:flex;justify-content:center;
}
.shell{width:100%;max-width:440px;padding:22px 18px 28px}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen{animation:riseIn .4s ease both}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

/* --- TIL EKRANI --- */
.lang-head{display:flex;flex-direction:column;gap:6px;padding:28px 4px 28px}
.lang-head h1{
  margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:42px;line-height:1.05;letter-spacing:-.01em;
}
.lang-head h1 em{font-style:italic;color:var(--accent)}
.lang-head p{margin:6px 0 0;font:400 15px/1.5 'Manrope',sans-serif;color:var(--dim)}
.lang-list{display:flex;flex-direction:column;gap:12px}
.lang-btn{
  display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:14px;
  width:100%;text-align:left;padding:14px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;cursor:pointer;color:var(--text);
  font-family:'Manrope',sans-serif;
  transition:border-color .2s,transform .12s,background .2s;
}
.lang-btn:hover{border-color:var(--accent);background:var(--bg2)}
.lang-btn:active{transform:scale(.985)}
.lang-mark{
  display:grid;place-items:center;width:52px;height:52px;border-radius:14px;
  font-size:26px;line-height:1;
}
.lang-name{display:flex;flex-direction:column;gap:3px}
.lang-name b{font:600 15px/1.2 'Manrope',sans-serif}
.lang-name small{font:500 12px/1.2 'Manrope',sans-serif;color:var(--dim);letter-spacing:0.06em}
.chev{color:var(--dim);font-size:16px}

/* --- KATALOG SARLAVHASI --- */
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 18px}
.cat-head .kicker{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--accent);
}
.cat-head h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:32px;line-height:1.1}
.back-btn{
  display:flex;align-items:center;gap:7px;padding:10px 14px;background:transparent;
  border:1px solid var(--line);border-radius:99px;color:var(--dim);
  font:600 12px/1 'Manrope',sans-serif;letter-spacing:0.06em;cursor:pointer;transition:.2s;
}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.back-btn:active{transform:scale(.96)}
.head-tools{display:flex;align-items:center;gap:8px}
.avatar-btn{
  width:38px;height:38px;border-radius:50%;padding:0;flex:none;overflow:hidden;
  display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  border:1px solid var(--line);
  font:800 13px/1 'Manrope',sans-serif;color:var(--accent-ink);
  transition:border-color .2s,transform .12s;
}
.avatar-btn:hover{border-color:var(--accent)}
.avatar-btn:active{transform:scale(.93)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-wrap{position:relative;display:block;flex:none}
.avatar-dot{
  position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);
  animation:blip 2.4s ease-in-out infinite;
}
@keyframes blip{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.75}}
@media (prefers-reduced-motion:reduce){.avatar-dot{animation:none}}

/* --- KATALOGDAGI SARALANISH TAKLIFI --- */
.sort-card{
  display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;
  margin-top:12px;padding:14px;border-radius:18px;
  background:rgba(255,255,255,.03);
  border:1px dashed rgba(var(--accent-rgb),.42);
}
.sort-card-mark{
  display:grid;place-items:center;width:56px;height:56px;border-radius:14px;
  background:rgba(var(--accent-rgb),.10);
  font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1;color:var(--accent);
}
.sort-card-mark img{width:44px;height:44px;object-fit:contain;display:block}
.sort-card-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.sort-card-title{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.2}
.sort-card-sub{font:500 12px/1.4 'Manrope',sans-serif;color:var(--dim)}
.sort-card-btn{
  align-self:start;margin-top:2px;padding:10px 18px;
  background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:99px;font:800 12px/1 'Manrope',sans-serif;
  cursor:pointer;transition:transform .12s;
}
.sort-card-btn:active{transform:scale(.95)}

/* --- PROFIL --- */
.prof-top{display:flex;align-items:center;gap:15px;padding:4px 0 22px}
.prof-pic{
  width:66px;height:66px;border-radius:50%;flex:none;overflow:hidden;
  display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--accent-ink);
}
.prof-pic img{width:100%;height:100%;object-fit:cover;display:block}
.prof-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.prof-name{
  font-family:'Cormorant Garamond',serif;font-size:25px;line-height:1.1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.prof-tag{font:500 12px/1.2 'Manrope',sans-serif;color:var(--dim)}
.panel{
  padding:14px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;margin-bottom:12px;
}
.panel-label{
  display:block;font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);margin-bottom:14px;
}
.stat-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:11px;margin-bottom:13px}
.stat-row:last-child{margin-bottom:0}
.stat-chip{
  width:34px;height:26px;border-radius:10px;display:grid;place-items:center;
  font:800 10px/1 'Manrope',sans-serif;color:#0d1117;
}
.stat-bar{display:block;width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.stat-fill{display:block;height:100%;min-width:0;border-radius:99px;background:var(--accent);transition:width .5s ease}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--dim)}
.stat-num.full{color:var(--accent)}
.total-row{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-top:14px;margin-top:14px;border-top:1px solid var(--line);
}
.total-label{font:600 12px/1 'Manrope',sans-serif;color:var(--dim)}
.total-val{font-family:'Cormorant Garamond',serif;font-size:25px;color:var(--accent)}
.house-empty{display:flex;align-items:center;gap:13px}
.house-crest{
  width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);
  font-family:'Cormorant Garamond',serif;font-size:27px;line-height:1;
  color:var(--dim);opacity:.9;transition:all .35s ease;
}
.house-crest.filled{
  background:rgba(var(--accent-rgb),.14);
  border:1px solid rgba(var(--accent-rgb),.45);
  font-family:'Manrope',sans-serif;font-size:20px;opacity:1;
}
.house-crest img{width:34px;height:34px;object-fit:contain;display:block}
.reveal-crest img{width:82px;height:82px;object-fit:contain;display:block}
.house-txt b{color:var(--text)}
.house-empty .house-crest.filled + .house-txt b{color:var(--accent)}
.house-txt{display:flex;flex-direction:column;gap:3px}
.house-txt b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px}
.house-txt small{font:500 12px/1.35 'Manrope',sans-serif;color:var(--dim)}
.sort-cta{
  display:block;width:100%;margin-top:14px;padding:10px;
  background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;
  font:800 13px/1 'Manrope',sans-serif;cursor:pointer;transition:transform .12s;
}
.sort-cta:active{transform:scale(.97)}
.resort{
  display:block;width:100%;margin-top:12px;padding:10px;background:transparent;
  border:1px solid var(--line);border-radius:10px;color:var(--dim);
  font:600 12px/1 'Manrope',sans-serif;cursor:pointer;transition:.2s;
}
.resort:hover{color:var(--text);border-color:var(--accent)}

/* --- SARALASH TESTI --- */
.sort-bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin-bottom:20px}
.sort-bar span{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .35s}
.sort-bar span.on{background:var(--accent)}
.sort-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.sort-back{
  display:flex;align-items:center;gap:6px;padding:6px 10px;background:transparent;
  border:1px solid var(--line);border-radius:99px;color:var(--dim);
  font:600 12px/1 'Manrope',sans-serif;letter-spacing:0.06em;cursor:pointer;transition:.2s;
}
.sort-back:hover{color:var(--text);border-color:var(--accent)}
.sort-back:active{transform:scale(.95)}
.sort-step{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--accent);
}
.sort-q{
  margin:10px 0 22px;font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:32px;line-height:1.2;
}
.sort-opts{display:flex;flex-direction:column;gap:11px}
.sort-opt{
  width:100%;text-align:left;padding:14px 18px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;color:var(--text);
  font:500 15px/1.4 'Manrope',sans-serif;cursor:pointer;
  transition:border-color .2s,background .2s,transform .12s;
}
.sort-opt:hover{border-color:var(--accent);background:var(--bg2)}
.sort-opt:active{transform:scale(.985)}

/* --- SHLYAPA: KIRISH VA O'YLANISH --- */
.hat-wrap{text-align:center;padding:28px 4px 10px;animation:riseIn .55s ease both}
.hat-mark{
  width:96px;height:96px;margin:0 auto 28px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(var(--accent-rgb),.10);
  border:1px dashed rgba(var(--accent-rgb),.42);
  font-family:'Cormorant Garamond',serif;font-size:44px;line-height:1;
  color:var(--accent);
}
/* Rasm bo'lsa — halqa va fon kerak emas */
.hat-mark.bare{
  width:auto;height:auto;background:none;border:none;border-radius:0;
}
.hat-img{
  width:132px;display:block;margin:0 auto;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.65));
  animation:float 4.5s ease-in-out infinite;
}
@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-11px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.hat-img{animation:none}}
.hat-top{
  display:block;font-family:'Cormorant Garamond',serif;font-size:32px;
  line-height:1.15;margin-bottom:16px;
}
.hat-mid{
  display:block;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:19px;line-height:1.35;color:var(--accent);margin-bottom:18px;
}
.hat-bot{
  display:block;max-width:320px;margin:0 auto 28px;
  font:500 13px/1.65 'Manrope',sans-serif;color:var(--dim);
}
.hat-go{
  padding:14px 28px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:99px;font:800 13px/1 'Manrope',sans-serif;
  cursor:pointer;transition:transform .12s;
}
.hat-go:active{transform:scale(.95)}

.think-wrap{
  display:grid;place-items:center;min-height:62vh;padding:0 14px;text-align:center;
}
.think-line{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:25px;line-height:1.4;color:var(--accent);
  max-width:320px;animation:riseIn .5s ease both;
}

/* --- SAVOL OLDIDAGI NUTQ --- */
.hat-say{
  display:block;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:19px;line-height:1.45;color:var(--accent);
  margin:14px 0 6px;min-height:24px;
}
.react-wrap{
  display:grid;place-items:center;min-height:190px;padding:0 10px;text-align:center;
}
.react-line{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:25px;line-height:1.35;color:var(--accent);
  animation:riseIn .35s ease both;
}
.rv-place{
  display:block;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:19px;color:var(--dim);margin-bottom:6px;
}
/* --- CHECKLIST --- */
.checklist{
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  padding:14px 14px;margin-bottom:14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
}
.ck-item{display:flex;align-items:center;gap:6px;font:600 12px/1 'Manrope',sans-serif;letter-spacing:0.06em}
.ck-dot{
  width:15px;height:15px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--dim);font-size:9px;line-height:1;color:transparent;
}
.ck-item.done .ck-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck-item.done{color:var(--text)}
.ck-item.todo{color:var(--dim)}
.ck-item.soon{color:var(--dim);opacity:.45}
.ck-item.soon .ck-dot{border-style:dashed}

/* --- TAYOQCHA KARTASI --- */
.wand-face{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center}
.wand-icon{
  width:62px;height:62px;display:grid;place-items:center;flex:none;
  color:var(--accent);
}
.wand-icon svg{width:100%;height:auto;display:block}
.wand-lines{display:flex;flex-direction:column;gap:2px;min-width:0}
.wand-wood{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.15;color:var(--accent)}
.wand-line{font:500 12px/1.5 'Manrope',sans-serif;color:var(--dim)}
.wand-more{
  display:block;width:100%;margin-top:14px;padding:10px;background:transparent;
  border:1px solid rgba(var(--accent-rgb),.4);border-radius:10px;color:var(--accent);
  font:700 12px/1 'Manrope',sans-serif;letter-spacing:0.14em;text-transform:uppercase;
  cursor:pointer;transition:.2s;
}
.wand-more:hover{background:rgba(var(--accent-rgb),.08)}
.wand-more:active{transform:scale(.98)}

/* --- BATAFSIL EKRAN --- */
.det-hero{text-align:center;padding:10px 0 28px}
.det-art{width:132px;margin:0 auto 18px;color:var(--accent)}
.det-art svg{width:100%;height:auto;display:block}
.det-title{
  display:block;font-family:'Cormorant Garamond',serif;font-size:32px;
  line-height:1.1;color:var(--accent);margin-bottom:8px;
}
.det-spec{
  display:block;font:600 12px/1.6 'Manrope',sans-serif;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--dim);
}
.det-block{
  padding:14px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;margin-bottom:12px;
}
.det-h{
  display:block;font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:11px;
}
.det-p{margin:0;font:500 13px/1.7 'Manrope',sans-serif;color:#c3cbd6}
.rare-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:12px}
.rare-row:first-of-type{margin-top:0}
.rare-k{font:500 13px/1.4 'Manrope',sans-serif;color:var(--dim)}
.rare-v{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--accent);white-space:nowrap}
.famous{
  display:flex;align-items:center;gap:12px;
  padding:14px 14px;margin-bottom:12px;border-radius:18px;
  background:rgba(var(--accent-rgb),.10);
  border:1px solid rgba(var(--accent-rgb),.38);
}
.famous-txt{display:flex;flex-direction:column;gap:3px}
.famous-txt small{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--accent);
}
.famous-txt b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px}

/* --- SVG CHIZMALAR --- */
.art{color:var(--accent)}
.art svg{display:block;width:100%;height:100%}
/* Tayoqcha endi kvadrat nisbatda. Ochilish ekranida .reveal-crest ramkasi
   bekor qilinmaydi - fakultet gerbi bilan bir xil ramkada turadi. */
.art-wand{padding:0}
.art-wand svg{width:78px;height:78px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
.art-shelf{
  width:170px!important;height:auto!important;
  border:none!important;background:none!important;border-radius:0!important;
  margin:0 auto 24px!important;padding:0;
}
.art-shelf svg{height:auto}
.house-crest .art svg,.sort-card-mark .art svg{width:100%;height:100%}

.reveal{text-align:center;padding:28px 0 10px;animation:riseIn .6s ease both}
.reveal-crest{
  width:104px;height:104px;margin:0 auto 18px;border-radius:18px;
  display:grid;place-items:center;font-size:48px;line-height:1;
  background:rgba(var(--accent-rgb),.14);
  border:1px solid rgba(var(--accent-rgb),.45);
}
.reveal-kicker{
  display:block;font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);margin-bottom:9px;
}
.reveal-name{
  display:block;font-family:'Cormorant Garamond',serif;font-size:42px;
  line-height:1.05;color:var(--accent);margin-bottom:13px;
}
.reveal-sub{
  display:block;font:600 12px/1 'Manrope',sans-serif;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--dim);margin:0px 0 14px;
}
.reveal-note{
  display:block;max-width:300px;margin:0 auto 28px;
  font:500 13px/1.6 'Manrope',sans-serif;color:var(--dim);
}
.reveal-done{
  padding:14px 28px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:99px;font:800 13px/1 'Manrope',sans-serif;
  cursor:pointer;transition:transform .12s;
}
.reveal-done:active{transform:scale(.95)}

/* --- PROGRESS --- */
.prog{padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-label{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);
}
.prog-count{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--accent)}
.prog-ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin:14px 0 10px}
.prog-ticks span{height:5px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .4s ease}
.prog-ticks span.on{background:var(--accent)}
.prog-hint{margin:0;font:500 12px/1.4 'Manrope',sans-serif;color:var(--dim)}

/* --- KEYINGI FILM --- */
.next{
  display:grid;grid-template-columns:64px 1fr;gap:15px;align-items:center;
  margin-top:14px;padding:14px;border-radius:18px;
  background:linear-gradient(115deg,rgba(var(--accent-rgb),.15),rgba(var(--accent-rgb),.04));
  border:1px solid rgba(var(--accent-rgb),.32);
}
.next-art{
  position:relative;display:grid;place-items:center;height:92px;border-radius:14px;
  overflow:hidden;font-family:'Cormorant Garamond',serif;font-size:26px;
  color:rgba(238,241,245,.4);
}
.next-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.next-body{display:flex;flex-direction:column;gap:9px;min-width:0}
.next-kicker{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--accent);
}
.next-title{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.15}
.next-play{
  align-self:start;padding:10px 18px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:99px;font:800 13px/1 'Manrope',sans-serif;
  cursor:pointer;transition:transform .12s;
}
.next-play:active{transform:scale(.95)}

/* --- KARTALAR --- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.card{
  position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;
  border:1px solid var(--line);cursor:pointer;
  transition:transform .14s,border-color .3s;
}
.card:active{transform:scale(.98)}
.card.next-up{border-color:var(--accent)}
.card.seen{border-color:rgba(255,255,255,.12)}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:transparent;transition:background .3s}
.card.seen .veil{background:rgba(7,9,13,.6)}
.numeral{
  position:absolute;top:0;left:0;padding:10px 14px;
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;
  line-height:1;color:rgba(238,241,245,.34);
}
.card.has-img .numeral{color:rgba(244,246,249,.85);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.check{
  position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:transparent;
  border:2px solid rgba(255,255,255,.42);color:var(--accent-ink);
  font:800 13px/1 'Manrope',sans-serif;cursor:pointer;padding:0;
  transition:transform .15s;
}
.card.has-img .check{border-color:rgba(255,255,255,.7)}
.card.seen .check{background:var(--accent);border-color:var(--accent)}
.card.exam .check{background:#e8b93c;border-color:#e8b93c;color:#1a1204}
.card.exam .card-meta{color:#e8b93c;font-weight:700}
.card.exam{border-color:rgba(232,185,60,.38)}
.card.exam .veil{background:rgba(7,9,13,.5)}
.check:active{transform:scale(.86)}
.card-foot{
  position:absolute;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;
  padding:28px 14px 14px;
  background:linear-gradient(to top,rgba(6,8,12,.94) 12%,rgba(6,8,12,.65) 55%,transparent);
}
.card-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-play{
  flex:none;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);border:none;padding:0;
  font-size:14px;line-height:1;cursor:pointer;
  transition:transform .12s,background .2s;
}
.card-play:active{transform:scale(.88)}
.card.seen .card-play{background:rgba(255,255,255,.16);color:#dfe5ee}
.card-title{
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;
  line-height:1.1;color:#f4f6f9;
}
.card-meta{
  font:600 10px/1.2 'Manrope',sans-serif;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--accent);
}
.card.seen .card-meta{color:var(--dim)}

/* --- XOGVARTS KUBOGI (maket 2.0) --- */

/* katalogdagi tasma - kirish nuqtasi */
.cup-strip{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:18px;
  padding:14px 14px;margin-bottom:14px;cursor:pointer;
  font-family:'Manrope',sans-serif;transition:.2s;
}
.cup-strip:active{transform:scale(.99)}
.cup-strip-crest{width:28px;height:28px;flex:none;display:grid;place-items:center}
.cup-strip-crest img{width:28px;height:28px;object-fit:contain;display:block}
.cup-strip-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cup-strip-kicker{
  font:800 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);
}
.cup-strip-line{font:600 13px/1.35 'Manrope',sans-serif;color:var(--text)}
.cup-strip-line b{color:var(--accent);font-weight:800}
.cup-strip-arrow{color:var(--accent);font-size:18px;line-height:1;flex:none}

/* ekran sarlavhasi */
.cup-hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.cup-timer{
  display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  font:600 12px/1 'Manrope',sans-serif;color:var(--dim);
}
.cup-timer i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.cup-head{text-align:center;margin-bottom:22px}
.cup-kick{
  display:block;font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);
}
.cup-title{
  display:block;font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:32px;line-height:1.1;margin:10px 0 0;color:var(--text);
}

/* qum soatlari - Katta zaldagi to'rtta soat */
.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.glass{text-align:center}
.tube{
  position:relative;height:184px;border-radius:10px 10px 14px 14px;overflow:hidden;
  background:rgba(255,255,255,.035);border:1px solid var(--line);
}
.glass.mine .tube{border-color:rgba(var(--hc-rgb),.55)}
.glass.out .tube{opacity:.42}
.tube-fill{
  position:absolute;left:0;right:0;bottom:0;background:rgba(var(--hc-rgb),.42);
  background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.20) 1px,transparent 1.6px);
  background-size:9px 9px;transition:height .5s ease;
}
.tube-fill::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--hc)}
.tube-crest{
  position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:rgba(12,15,20,.72);border:1px solid rgba(var(--hc-rgb),.5);
}
.tube-crest img{width:26px;height:26px;object-fit:contain;display:block}
.g-name{display:block;font:600 12px/1.3 'Manrope',sans-serif;margin-top:11px;color:var(--dim)}
.glass.mine .g-name{color:var(--text)}
.g-val{display:block;font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--hc);margin-top:2px}
.g-need{display:block;font:500 10px/1.35 'Manrope',sans-serif;color:var(--dim);margin-top:3px}

/* taranglik - ramka RAQIB rangida, o'z rangida emas */
.cup-gap{
  border:1px solid rgba(var(--rc-rgb),.34);background:var(--card);
  border-radius:18px;padding:14px 18px;margin-top:20px;
}
.gap-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.gap-txt{font:600 13px/1.45 'Manrope',sans-serif;color:var(--text)}
.gap-txt em{font-style:normal;color:var(--rc);font-weight:800}
.gap-crest{
  width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:rgba(var(--rc-rgb),.13);border:1px solid rgba(var(--rc-rgb),.42);
}
.gap-crest img{width:30px;height:30px;object-fit:contain;display:block}
.gap-track{position:relative;height:3px;border-radius:3px;background:rgba(255,255,255,.08)}
.gap-span{position:absolute;top:0;height:100%;border-radius:3px;opacity:.55}
.gap-dot{
  position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid var(--card);
}
.gap-hint{font:500 12px/1.5 'Manrope',sans-serif;color:var(--dim);margin-top:13px}
.gap-hint b{color:var(--text);font-weight:600}

/* shaxsiy blok - ball HECH QACHON fakultet o'rtachasi bilan yonma-yon emas */
.cup-you{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px 18px;margin-top:12px;
}
.you-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.you-lbl{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:0.22em;
  text-transform:uppercase;color:var(--dim);
}
.you-val{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;color:var(--accent)}
.you-val s{text-decoration:none;font-size:15px;color:var(--dim)}
.you-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.you-bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease}
.you-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:13px;padding-top:13px;border-top:1px solid var(--line);
  font:500 12px/1.4 'Manrope',sans-serif;color:var(--dim);
}
.you-foot b{color:var(--text);font-weight:600}

/* 30 ballga yetmaganlar uchun - ayblov emas, qancha qolgani */

  margin-top:13px;padding-top:13px;border-top:1px solid var(--line);
}
.gate-msg b{color:#e8b93c;font-weight:700}

.cup-cta{
  display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.4);
  color:var(--accent);font:800 12px/1 'Manrope',sans-serif;letter-spacing:0.14em;
  text-transform:uppercase;cursor:pointer;transition:.2s;
}
.cup-cta:active{transform:scale(.98)}
.cup-foot{
  font:italic 400 12px/1.6 'Cormorant Garamond',serif;
  color:var(--dim);text-align:center;margin:18px 0 0;padding:0 6px;
}

  function applyHouse(id) {

    root.style.setProperty("--accent", h.accent);

  var LANGS = [
    { code:"uz", flag:"🇺🇿", name:"O'zbekcha", note:"UZ · Uzbek",   grad:LANG_GRADS.uz },
    { code:"ru", flag:"🇷🇺", name:"Русский",   note:"RU · Russian", grad:LANG_GRADS.ru },
    { code:"en", flag:"🇬🇧", name:"English",   note:"EN · English", grad:LANG_GRADS.en }
  ];

  function flagOf(code) {
    for (var i = 0; i < LANGS.length; i++) {
      if (LANGS[i].code === code) { return LANGS[i].flag; }
    }
    return "";
  }

  var lang = "uz";
  var house = "none";
  var wand = null;
  var watched = {};
  var cloudOk = false;

  function $(id) { return document.getElementById(id); }

  function list() {
    var out = [];
    for (var k in watched) { if (watched[k]) { out.push(k); } }
    return out;
  }

  // Progress har til uchun alohida: kalit "uz:hp1" ko'rinishida
  function key(id) { return lang + ":" + id; }

  // Eski format ("hp1,hp2") -> "uz:hp1,uz:hp2"
  function migrate(defLang) {
    var moved = 0;
    for (var k in watched) {
      if (k.indexOf(":") === -1) {
        delete watched[k];
        watched[defLang + ":" + k] = true;
        moved++;
      }
    }
    if (moved) { writeLocal(); }
    return moved;
  }

  /* ---------- SAQLASH ---------- */

  function hasCloud() {
    try { return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")); }
    catch (e) { return false; }
  }

  function absorb(arr) {
    for (var i = 0; i < arr.length; i++) { if (arr[i]) { watched[arr[i]] = true; } }
  }

  function readLocal() {
    try { var raw = window.localStorage.getItem(KEY); return raw ? raw.split(",") : []; }
    catch (e) { return []; }
  }

  function writeLocal() {
    try { window.localStorage.setItem(KEY, list().join(",")); } catch (e) {}
  }

  function validLang(v) { return v === "uz" || v === "ru" || v === "en" ? v : null; }

  function readLocalLang() {
    try { return validLang(window.localStorage.getItem(LANG_KEY)); }
    catch (e) { return null; }
  }

  function saveLang(code) {
    try { window.localStorage.setItem(LANG_KEY, code); } catch (e) {}
    if (!cloudOk) { return; }
    try { tg.CloudStorage.setItem(LANG_KEY, code, function () {}); } catch (e) {}
  }

  var API_PROFILE = "https://bot.tizimshunos.uz/api/profile";

  // Profil tanlovlarini serverga yuboradi (statistika uchun).
  // Xato bo'lsa jim o'tadi — foydalanuvchiga bilinmaydi.
  function report(kind, value) {
    var initData = "";
    try { initData = (tg && tg.initData) || ""; } catch (e) {}
    if (!initData || !window.fetch) { return; }

    try {
      window.fetch(API_PROFILE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind: kind, value: value, initData: initData })
      })["catch"](function () {});
    } catch (e) {}
  }

  /* ---------- XOGVARTS KUBOGI (2.0) ---------- */

  var API_LEADERBOARD = "https://bot.tizimshunos.uz/api/leaderboard";
  var HOUSE_ORDER = ["gryffindor", "slytherin", "hufflepuff", "ravenclaw"];
  var cupData = null;
  var cupBusy = false;

  // Reytingni serverdan oladi. report() kabi jim ishlaydi: xato bo'lsa
  // foydalanuvchi sezmaydi, tasma shunchaki ko'rinmaydi.
  function fetchCup(cb) {
    var initData = "";
    try { initData = (tg && tg.initData) || ""; } catch (e) {}
    if (!initData || !window.fetch || cupBusy) { if (cb) { cb(cupData); } return; }

    cupBusy = true;
    function done(d) {
      cupBusy = false;
      if (d && d.houses) { cupData = d; }
      if (cb) { cb(cupData); }
    }
    try {
      window.fetch(API_LEADERBOARD, {
        method: "GET",
        headers: { "X-Telegram-Init-Data": initData }
      }).then(function (r) { return r.ok ? r.json() : null; })
        .then(done)["catch"](function () { done(null); });
    } catch (e) { done(null); }
  }

  function cupPts(v) {
    var n = Number(v);
    return isFinite(n) ? n.toFixed(1) : "0.0";
  }

  function cupHouseName(id) {
    return (HOUSES[id] && HOUSES[id][lang]) || id;
  }

  function cupCrestImg(houseId, size) {
    var h = HOUSES[houseId];
    if (!h || !h.img) { return null; }
    var img = document.createElement("img");
    img.src = IMG_DIR + h.img;
    img.alt = "";
    if (size) { img.style.width = img.style.height = size + "px"; }
    return img;
  }

  // "2 kun 14 soat qoldi" yoki "9 soat qoldi"
  function cupTimer(t) {
    if (!cupData || !cupData.season) { return ""; }
    var diff;
    try { diff = new Date(cupData.season.ends_at).getTime() - Date.now(); }
    catch (e) { return ""; }
    if (!(diff > 0)) { return t.cupEnding; }

    // Avval muddat yig'iladi, keyin tilga mos qolipga qo'yiladi:
    // o'zbekchada "... qoldi", ruschada "осталось ..." - so'z tartibi teskari.
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var span;
    if (days >= 1) {
      span = (days === 1 ? t.cupDay1 : t.cupDays).replace("%d", days);
      if (hours >= 1) {
        span += " " + (hours === 1 ? t.cupHour1 : t.cupHours).replace("%d", hours);
      }
    } else {
      var h = Math.max(1, Math.floor(diff / 3600000));
      span = (h === 1 ? t.cupHour1 : t.cupHours).replace("%d", h);
    }
    return t.cupLeftFmt.replace("%s", span);
  }

  // Chegaradan o'tganlar tepada, keyin o'rtacha ball bo'yicha.
  function cupSorted() {
    if (!cupData || !cupData.houses) { return []; }
    var list = cupData.houses.slice();
    list.sort(function (a, b) {
      if (a.qualified !== b.qualified) { return a.qualified ? -1 : 1; }
      if ((b.avg_points || 0) !== (a.avg_points || 0)) {
        return (b.avg_points || 0) - (a.avg_points || 0);
      }
      return HOUSE_ORDER.indexOf(a.house) - HOUSE_ORDER.indexOf(b.house);
    });
    return list;
  }

  function cupMe() { return (cupData && cupData.me) || {}; }

  // Gerb 34px + 9px pastdan = naycha balandligining 23%. To'ldirish
  // undan past bo'lsa, gerb havoda osilib qolgandek ko'rinadi.
  var MIN_FILL = 28;

  // Bu mavsumda imtihoni topshirilmagan qismlar. Bot bu maydonni hali
  // yubormasa - bo'sh massiv, ya'ni katalogda hech narsa o'zgarmaydi.
  function examPending(part) {
    var me = cupMe();
    var list = me.exam_pending;
    if (!list || !list.length) { return false; }
    for (var i = 0; i < list.length; i++) {
      if (Number(list[i]) === Number(part)) { return true; }
    }
    return false;
  }
  var SCALE_FLOOR = 100;   // mavsumdagi maksimum 350

  // Farq bugun yopilsa - nuqtalar yaqin, yopilmasa - uzoq.
  // closable yuborilmagan bo'lsa (eski server) - neytral masofa.
  function gapRatio(diff, closable) {
    var d = (typeof diff === "number" && diff > 0) ? diff : 0;
    // closable 0 - bu muvaffaqiyatsizlik emas, "bugun hammasi qilingan".
    // Bunday holatda uzun masofa ko'rsatish matnga zid bo'lardi.
    if (typeof closable !== "number" || closable <= 0) { return 0.6; }
    var r = d / (d + closable);
    if (r < 0.12) { return 0.12; }
    if (r > 0.9) { return 0.9; }   // hech qachon umidsiz ko'rinmasin
    return r;
  }

  // Chegaradan o'tganlar orasidagi o'rin (1 dan boshlab), yoki null
  function cupPlaceOf(house) {
    var place = 0, list = cupSorted(), i;
    for (i = 0; i < list.length; i++) {
      if (!list[i].qualified) { continue; }
      place++;
      if (list[i].house === house) { return place; }
    }
    return null;
  }

  function cupRowOf(list, house) {
    var i;
    for (i = 0; i < list.length; i++) {
      if (list[i].house === house) { return list[i]; }
    }
    return null;
  }

  /* ---------- katalogdagi tasma ---------- */

  function renderCupStrip() {
    var strip = $("cup-strip");
    if (!strip) { return; }
    var t = T[lang];

    if (!cupData) { strip.classList.add("hidden"); return; }

    var me = cupMe();
    var house = me.house;

    var crest = $("cup-strip-crest");
    crest.innerHTML = "";
    var img = house ? cupCrestImg(house, 28) : null;
    if (img) { crest.appendChild(img); }

    $("cup-strip-kicker").textContent = t.cupTitle;

    var line = $("cup-strip-line");
    var name = house ? cupHouseName(house) : "";
    var place = house ? cupPlaceOf(house) : null;
    var head = name + (place ? " " + t.cupPlace.replace("%d", place) : "");
    var row = house ? cupRowOf(cupSorted(), house) : null;

    if (!house) {
      line.textContent = t.cupJoin;
    } else if (!me.is_active) {
      line.textContent = head + " · " + t.cupStripGate.replace("%d", me.to_active || 0);
    } else if (me.gap) {
      line.textContent = head + " · " +
        (me.gap.ahead ? t.cupStripAhead : t.cupStripBehind)
          .replace("%s", cupHouseName(me.gap.house))
          .replace("%n", cupPts(me.gap.diff));
    } else if (row && !row.qualified) {
      line.textContent = name + " — " + t.cupMembers
        .replace("%a", row.active_members || 0).replace("%b", 5);
    } else {
      line.textContent = head;
    }
    strip.classList.remove("hidden");
  }

  /* ---------- qum soatlari ---------- */

  function renderGlasses(list, me) {
    var box = $("cup-glasses");
    box.innerHTML = "";
    var t = T[lang];

    var top = 0, i;
    for (i = 0; i < list.length; i++) {
      if ((list[i].avg_points || 0) > top) { top = list[i].avg_points; }
    }

    list.forEach(function (row) {
      var h = HOUSES[row.house] || {};
      var cell = document.createElement("div");
      cell.className = "glass" + (row.house === me.house ? " mine" : "") +
                       (row.qualified ? "" : " out");
      cell.style.setProperty("--hc", h.accent || "#97a1ae");
      cell.style.setProperty("--hc-rgb", h.rgb || "151,161,174");

      var tube = document.createElement("div");
      tube.className = "tube";

      // Minimal to'ldirish gerbni to'liq sig'diradigan balandlikda bo'lishi
      // shart. 8% (15px) da 34px gerb to'ldirishdan chiqib turadi va naycha
      // buzilgandek ko'rinadi - skrinshotda aynan shu ko'rindi.
      //
      // Shkalada quyi chegara bor: yetakchi SCALE_FLOOR dan past bo'lsa,
      // balandlik o'sha chegaraga nisbatan hisoblanadi. Aks holda mavsum
      // boshida 40 ball (350 dan) naychani deyarli to'ldirib, "poyga
      // tugagan" degan yolg'on taassurot berardi.
      var scale = Math.max(top, SCALE_FLOOR);
      var pct = Math.round((row.avg_points || 0) / scale * 78);
      var fill = document.createElement("span");
      fill.className = "tube-fill";
      fill.style.height = Math.max(MIN_FILL, pct) + "%";
      tube.appendChild(fill);

      var crest = document.createElement("span");
      crest.className = "tube-crest";
      var img = cupCrestImg(row.house, 26);
      if (img) { crest.appendChild(img); }
      else { crest.textContent = h.crest || "?"; }
      tube.appendChild(crest);
      cell.appendChild(tube);

      var nm = document.createElement("span");
      nm.className = "g-name";
      nm.textContent = cupHouseName(row.house);
      cell.appendChild(nm);

      var val = document.createElement("span");
      val.className = "g-val";
      val.textContent = cupPts(row.avg_points);
      cell.appendChild(val);

      if (!row.qualified) {
        var need = document.createElement("span");
        need.className = "g-need";
        need.textContent = t.cupMembers
          .replace("%a", row.active_members || 0).replace("%b", 5);
        cell.appendChild(need);
      }
      box.appendChild(cell);
    });
  }

  /* ---------- taranglik bloki ---------- */

  // Uchta yiqilgan holat: fakultetsiz, fakultet chegaradan o'tmagan,
  // yoki raqib hali aniqlanmagan (mavsum endi boshlangan).
  function renderGapFallback(block, list, me, t) {
    var h = HOUSES[me.house] || {};
    block.style.setProperty("--rc", h.accent || "#97a1ae");
    block.style.setProperty("--rc-rgb", h.rgb || "151,161,174");

    var crestBox = $("gap-crest");
    crestBox.innerHTML = "";
    if (me.house) {
      var img = cupCrestImg(me.house, 30);
      if (img) { crestBox.appendChild(img); }
    }

    $("gap-track").innerHTML = "";
    var el = $("gap-txt");
    el.innerHTML = "";
    var hint = $("gap-hint");
    hint.innerHTML = "";

    var row = cupRowOf(list, me.house);
    if (!me.house) {
      el.textContent = t.cupNoHouse;
      hint.textContent = t.cupNoHouseHint;
    } else if (row && !row.qualified) {
      var need = Math.max(0, (row.needed || 0));
      var parts = t.cupNeedMembers.split("%n");
      el.appendChild(document.createTextNode(
        parts[0].replace("%s", cupHouseName(me.house))));
      var em = document.createElement("em");
      em.textContent = t.cupNeedCount.replace("%d", need);
      el.appendChild(em);
      if (parts.length > 1) { el.appendChild(document.createTextNode(parts[1])); }
      hint.textContent = t.cupNeedHint;
    } else {
      el.textContent = t.cupEarly;
      hint.textContent = t.cupEarlyHint;
    }
    block.classList.remove("hidden");
  }

  function renderGap(list, me) {
    var block = $("cup-gap");
    var t = T[lang];
    var g = me.gap;

    // Taranglik bloki ekranning markazi. g bo'lmasa uni yashirish emas,
    // holatga mos xabar ko'rsatish kerak (spetsifikatsiya 7.3) - aks holda
    // mavsum boshida ekran bo'sh va maqsadsiz ko'rinadi.
    if (!g) { renderGapFallback(block, list, me, t); return; }

    var rival = HOUSES[g.house] || {};
    block.style.setProperty("--rc", rival.accent || "#97a1ae");
    block.style.setProperty("--rc-rgb", rival.rgb || "151,161,174");

    var txt = (g.ahead ? t.cupGapAhead : t.cupGapBehind)
      .replace("%s", cupHouseName(g.house));
    var parts = txt.split("%n");
    var el = $("gap-txt");
    el.innerHTML = "";
    el.appendChild(document.createTextNode(parts[0]));
    var em = document.createElement("em");
    em.textContent = cupPts(g.diff) + " " + t.cupPts;
    el.appendChild(em);
    if (parts.length > 1) { el.appendChild(document.createTextNode(parts[1])); }

    var crestBox = $("gap-crest");
    crestBox.innerHTML = "";
    var img = cupCrestImg(g.house, 30);
    if (img) { crestBox.appendChild(img); }

    // Ikki nuqta: yetakchi o'ng chetda, ikkinchisi o'z nisbatida
    // Chiziq mutlaq ballarni emas, farqni BUGUNGI imkoniyatga nisbatan
    // ko'rsatadi. Avval nuqtalar avg/leader bo'yicha qo'yilardi va poyga
    // qanchalik qizg'in bo'lsa, ular shunchalik yopishib turardi - ya'ni
    // taranglik eng yuqori paytda chiziq hech narsa ko'rsatmasdi.
    var track = $("gap-track");
    track.innerHTML = "";

    var ratio = gapRatio(g.diff, g.closable);
    var LEAD = 90, span = Math.round(ratio * 70), back = LEAD - span;
    var mineColor = (HOUSES[me.house] || {}).accent || "#97a1ae";
    var rivalColor = rival.accent || "#97a1ae";

    var seg = document.createElement("span");
    seg.className = "gap-span";
    seg.style.left = back + "%";
    seg.style.width = span + "%";
    seg.style.background = g.ahead ? mineColor : rivalColor;
    track.appendChild(seg);

    [[back, g.ahead ? rivalColor : mineColor],
     [LEAD, g.ahead ? mineColor : rivalColor]].forEach(function (pair) {
      var dot = document.createElement("span");
      dot.className = "gap-dot";
      dot.style.left = pair[0] + "%";
      dot.style.background = pair[1];
      track.appendChild(dot);
    });

    // Ohang holatga qarab o'zgaradi: ortda bo'lsa - quvish, yetakchi
    // bo'lsa - ushlab qolish (spetsifikatsiya 7.3).
    var hint = $("gap-hint");
    hint.innerHTML = "";
    var bold = document.createElement("b");

    if (g.ahead) {
      hint.appendChild(document.createTextNode(t.cupHoldPre));
      bold.textContent = t.cupHoldBold;
      hint.appendChild(bold);
    } else if (g.closable > 0) {
      var left = Math.max(0, Math.round((g.diff - g.closable) * 10) / 10);
      var hp = t.cupGapHint.split("%n");
      hint.appendChild(document.createTextNode(hp[0]));
      bold.textContent = t.cupGapDrop.replace("%n", cupPts(left));
      hint.appendChild(bold);
      if (hp.length > 1) { hint.appendChild(document.createTextNode(hp[1])); }
    } else {
      hint.textContent = t.cupGapDone;
    }
    block.classList.remove("hidden");
  }

  /* ---------- shaxsiy blok ---------- */

  function renderYou(me) {
    var box = $("cup-you");
    var t = T[lang];

    if (!me.house) { box.classList.add("hidden"); return; }

    box.className = "cup-you" + (me.is_active ? "" : " gate");

    var top = document.createElement("div");
    top.className = "you-top";
    var lbl = document.createElement("span");

    lbl.textContent = t.cupYourPts;
    var val = document.createElement("span");
    val.className = "you-val";
    val.appendChild(document.createTextNode(String(me.points || 0)));
    var s = document.createElement("s");
    s.textContent = " / " + (me.max_points || 350);
    val.appendChild(s);
    top.appendChild(lbl);
    top.appendChild(val);
    box.appendChild(top);

    var bar = document.createElement("div");
    bar.className = "you-bar";
    var fill = document.createElement("i");

    fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);

    if (!me.is_active) {
      // Ayblov yo'q: "hisobga kirmaysiz" emas, faqat qancha qolgani
      var msg = document.createElement("div");
      msg.className = "gate-msg";
      var gp = t.cupGate.split("%n");
      msg.appendChild(document.createTextNode(gp[0]));
      var b = document.createElement("b");
      b.textContent = t.cupGatePts.replace("%d", me.to_active || 0);
      msg.appendChild(b);
      if (gp.length > 1) {
        msg.appendChild(document.createTextNode(
          gp[1].replace("%s", cupHouseName(me.house))));
      }
      // "Bu ikkita kunlik savol" - qolgan ballni tushunarli o'lchovga
      // aylantiradi, shunda 20 ball mavhum raqam bo'lib qolmaydi.
      var quizzes = Math.ceil((me.to_active || 0) / 10);
      if (quizzes > 0) {
        msg.appendChild(document.createTextNode(
          " " + t.cupGateTail.replace("%d", quizzes)));
      }
      box.appendChild(msg);
    } else if (me.house_rank) {
      var foot = document.createElement("div");
      foot.className = "you-foot";
      var left = document.createElement("span");
      left.textContent = t.cupInHouse.replace("%s", cupHouseName(me.house));
      var right = document.createElement("b");
      right.textContent = t.cupPlace.replace("%d", me.house_rank);
      foot.appendChild(left);
      foot.appendChild(right);
      box.appendChild(foot);
    }
    box.classList.remove("hidden");
  }

  /* ---------- to'liq ekran ---------- */

  function renderCupScreen() {
    var t = T[lang];
    var list = cupSorted();
    var me = cupMe();

    $("cup-timer-txt").textContent = cupTimer(t);
    $("cup-kick").textContent = t.cupKicker;
    $("cup-title").textContent = t.cupTitle;
    $("cup-foot").textContent = t.cupFoot;
    $("cup-back-txt").textContent = t.cupBack;

    renderGlasses(list, me);
    renderGap(list, me);

  function validHouse(v) { return v && HOUSES[v] && v !== "none" ? v : null; }

  function readLocalHouse() {
    try { return validHouse(window.localStorage.getItem(HOUSE_KEY)); }
    catch (e) { return null; }

  function validWand(v) {
    if (!v) { return null; }
    var o = v;
    if (typeof v === "string") {
      try { o = JSON.parse(v); } catch (e) { return null; }
    }
    if (!o || !WOODS[o.wood] || !CORES[o.core] || !FLEX[o.flex]) { return null; }
    return { wood: o.wood, core: o.core, flex: o.flex };
  }

  function readLocalWand() {
    try { return validWand(window.localStorage.getItem(WAND_KEY)); }
    catch (e) { return null; }
  }

  function setWand(w) {
    var v = validWand(w);
    if (!v) { return; }
    wand = v;
    var raw = JSON.stringify(v);
    try { window.localStorage.setItem(WAND_KEY, raw); } catch (e) {}
    if (cloudOk) {
      try { tg.CloudStorage.setItem(WAND_KEY, raw, function () {}); } catch (e) {}
    }
  }

  function setHouse(id) {
    var v = validHouse(id) || "none";
    house = v;
    applyHouse(v);
    try { window.localStorage.setItem(HOUSE_KEY, v); } catch (e) {}
    if (cloudOk) {
      try { tg.CloudStorage.setItem(HOUSE_KEY, v, function () {}); } catch (e) {}
    }
  }

  function load(done) {
    var localLang = readLocalLang();
    var houseChanged = false;

    if (!hasCloud()) { done(localLang, false); return; }
    cloudOk = true;

    var fired = false;
    function once(l) {
      if (!fired) { fired = true; done(l, houseChanged); return; }
      // Bulut kechikib kelgan bo'lsa ham fakultet yangilansin
      if (houseChanged) { houseChanged = false; refreshHouseView(); }
    }
    setTimeout(function () { once(localLang); }, 1200);

    try {
      tg.CloudStorage.getItems([KEY, LANG_KEY, HOUSE_KEY, WAND_KEY], function (err, vals) {
        var l = localLang;
        if (!err && vals) {
          if (vals[KEY]) { absorb(vals[KEY].split(",")); writeLocal(); }
          var cl = validLang(vals[LANG_KEY]);
          if (!l && cl) { l = cl; try { window.localStorage.setItem(LANG_KEY, cl); } catch (e) {} }
          // Fakultet uchun bulut asosiy manba: qurilmalar orasida
          // yagona bo'lishi kerak, shuning uchun lokal qiymatni almashtiradi.
          var ch = validHouse(vals[HOUSE_KEY]);
          if (ch && ch !== house) {
            house = ch;
            applyHouse(ch);
            try { window.localStorage.setItem(HOUSE_KEY, ch); } catch (e) {}
            houseChanged = true;
          }
          var cw = validWand(vals[WAND_KEY]);
          if (cw) {
            var same = wand && wand.wood === cw.wood && wand.core === cw.core && wand.flex === cw.flex;
            if (!same) {
              wand = cw;
              try { window.localStorage.setItem(WAND_KEY, JSON.stringify(cw)); } catch (e) {}
              houseChanged = true;
            }
          }
        }
        once(l);
      });
    } catch (e) { once(localLang); }
  }

  // Fakultet o'zgargach ochiq ekranni qayta chizadi
  function refreshHouseView() {
    if (!$("scr-prof").classList.contains("hidden")) { renderProfile(); }
    else if (!$("scr-cat").classList.contains("hidden")) { renderCatalog(); }
  }

  function persist(cb) {
    writeLocal();
    if (!cloudOk) { if (cb) { cb(); } return; }

    var fired = false;
    function once() { if (!fired) { fired = true; if (cb) { cb(); } } }
    setTimeout(once, 1200);

    try { tg.CloudStorage.setItem(KEY, list().join(","), once); }
    catch (e) { once(); }
  }

  /* ---------- HARAKATLAR ---------- */

  function toggle(id) {
    var k = key(id);
    if (watched[k]) { delete watched[k]; } else { watched[k] = true; }
    try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.selectionChanged(); } } catch (e) {}
    persist();
    renderCatalog();
  }

  // Kartaga bosilganda tasdiq so'raladi — tasodifiy teginishdan himoya
  function askPlay(id, title) {
    var msg = T[lang].confirmWatch(title);
    if (tg && tg.showConfirm) {
      tg.showConfirm(msg, function (ok) { if (ok) { play(id); } });
      return;
    }
    var ok = true;
    try { if (window.confirm) { ok = window.confirm(msg); } } catch (e) {}
    if (ok) { play(id); }
  }

  function play(id) {
    var link = "https://t.me/" + BOT + "?start=" + id + "_" + lang;
    watched[key(id)] = true;
    renderCatalog();
    persist(function () {
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); tg.close(); }
      else { window.open(link, "_blank"); }
    });
  }

  function renderProgress(t) {
    var n = 0;
    MOVIES.forEach(function (m) { if (watched[key(m.id)]) { n++; } });
    var total = MOVIES.length;

    $("prog-count").textContent = n + " / " + total;
    $("prog-hint").textContent =
      n === 0 ? t.hintStart : (n === total ? t.hintDone : t.hintMid(total - n));

    var ticks = $("prog-ticks");
    ticks.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var s = document.createElement("span");
      if (i < n) { s.className = "on"; }
      ticks.appendChild(s);

  function renderCards(t) {
    var grid = $("grid");
    var ni = nextIndex();
    grid.innerHTML = "";

    MOVIES.forEach(function (m, i) {
      var seen = !!watched[key(m.id)];
      // Uchinchi holat: film ko'rilgan, lekin bu mavsumning imtihoni
      // topshirilmagan. 8 filmni tugatgan 143 foydalanuvchi uchun katalog
      // "ish tugadi" deb turardi, holbuki kubok ular uchun endi boshlanadi.
      var pending = seen && examPending(i + 1);

      var card = document.createElement("div");
      card.className = "card" + (seen ? " seen" : (i === ni ? " next-up" : "")) +
                       (pending ? " exam" : "");
      card.style.background = CARD_BG;
      card.addEventListener("click", function () { askPlay(m.id, m[lang]); });

      var img = document.createElement("img");
      img.className = "card-img";
      img.src = poster(m.id);
      img.alt = m[lang];
      img.onerror = function () { this.remove(); };
      img.onload = function () { card.classList.add("has-img"); };
      card.appendChild(img);

      var veil = document.createElement("span");
      veil.className = "veil";
      card.appendChild(veil);

      var num = document.createElement("span");
      num.className = "numeral";
      num.textContent = NUMERALS[i];
      card.appendChild(num);

      var check = document.createElement("button");
      check.className = "check";
      check.textContent = pending ? "?" : (seen ? "✓" : "");
      check.setAttribute("aria-label", m[lang]);
      // Belgi bir vaqtda holat ko'rsatkichi ham, tugma ham. Foydalanuvchi
      // uni holat deb o'ylab bosishi mumkin, shuning uchun progressni
      // O'CHIRADIGAN yo'nalishda tasdiq so'raymiz. Belgilash zararsiz -
      // u so'roqsiz o'tadi.
      check.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (!seen) { toggle(m.id); return; }
        var msg = T[lang].unmarkAsk.replace("%s", m[lang]);
        if (tg && tg.showConfirm) {
          tg.showConfirm(msg, function (ok) { if (ok) { toggle(m.id); } });
        } else if (!window.confirm || window.confirm(msg)) {
          toggle(m.id);
        }
      });
      card.appendChild(check);

      var foot = document.createElement("span");
      foot.className = "card-foot";

      var textCol = document.createElement("span");
      textCol.className = "card-text";
      var ttl = document.createElement("span");
      ttl.className = "card-title";
      ttl.textContent = m[lang];
      var meta = document.createElement("span");
      meta.className = "card-meta";
      meta.textContent = pending ? t.examWaiting
                       : (seen ? t.seen : (i === ni ? t.next : YEARS[i]));
      textCol.appendChild(ttl);
      textCol.appendChild(meta);
      foot.appendChild(textCol);

      var pl = document.createElement("button");
      pl.className = "card-play";
      pl.textContent = "▶";
      pl.setAttribute("aria-label", t.watch + " — " + m[lang]);
      pl.addEventListener("click", function (ev) {
        ev.stopPropagation();
        play(m.id);
      });
      foot.appendChild(pl);

      card.appendChild(foot);

      grid.appendChild(card);
    });
  }

  /* ---------- PROFIL ---------- */

  function tgUser() {
    try {
      var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
      return u && u.id ? u : null;
    } catch (e) { return null; }
  }

  function fullName(u) {
    var n = (u.first_name || "") + " " + (u.last_name || "");
    return n.trim() || u.username || "";
  }

  function initials(name) {
    var parts = name.split(/\s+/).filter(Boolean);
    if (!parts.length) { return "?"; }
    var s = parts[0].charAt(0);
    if (parts.length > 1) { s += parts[1].charAt(0); }
    return s.toUpperCase();
  }

  function countFor(code) {
    var n = 0;
    MOVIES.forEach(function (m) { if (watched[code + ":" + m.id]) { n++; } });
    return n;
  }

  function uniqueWatched() {
    var seen = {};
    MOVIES.forEach(function (m) {
      LANGS.forEach(function (l) {
        if (watched[l.code + ":" + m.id]) { seen[m.id] = true; }
      });
    });
    var n = 0;
    for (var k in seen) { if (seen[k]) { n++; } }
    return n;
  }

  function fillAvatar(el, u, name, big) {
    el.innerHTML = "";
    if (u && u.photo_url) {
      var img = document.createElement("img");
      img.src = u.photo_url;
      img.alt = "";
      img.onerror = function () {
        this.remove();
        el.textContent = initials(name);
      };
      el.appendChild(img);
    } else {
      el.textContent = big ? initials(name) : initials(name);
    }
  }

      cta.classList.remove("hidden");
      again.classList.add("hidden");
    } else {
      cta.classList.add("hidden");
      // Fakultet UMRBOD: qayta saralanish faqat muhlat ichida ko'rinadi.
      // Server ham rad etadi, bu yerda tugma shunchaki yashiriladi.
      var me = cupMe();
      if (me.can_resort) { again.classList.remove("hidden"); }
      else { again.classList.add("hidden"); }
    }

    $("prof-name").textContent = name;
    $("prof-tag").textContent = u
      ? (u.username ? "@" + u.username : "ID " + u.id)
      : t.noTag;

    fillAvatar($("prof-pic"), u, name, true);

    var rows = $("stat-rows");
    rows.innerHTML = "";
    LANGS.forEach(function (l) {
      var n = countFor(l.code);
      var total = MOVIES.length;

      var row = document.createElement("div");
      row.className = "stat-row";

      var chip = document.createElement("span");
      chip.className = "stat-chip";
      chip.style.background = LANG_GRADS[l.code];
      chip.textContent = l.code.toUpperCase();

      var bar = document.createElement("span");
      bar.className = "stat-bar";
      var fill = document.createElement("span");
      fill.className = "stat-fill";
      fill.style.width = Math.round(n / total * 100) + "%";
      bar.appendChild(fill);

      var num = document.createElement("span");
      num.className = "stat-num" + (n === total ? " full" : "");
      num.textContent = n + "/" + total;

      row.appendChild(chip);
      row.appendChild(bar);
      row.appendChild(num);
      rows.appendChild(row);
    });

    $("total-val").textContent = uniqueWatched() + " / " + MOVIES.length;

    renderWandPanel(t);
    renderChecklist(t);
  }

  function renderWandPanel(t) {
    var panel = $("wand-panel");
    // Tayoqcha faqat fakultet aniqlangach ochiladi
    if (house === "none") { panel.classList.add("hidden"); return; }
    panel.classList.remove("hidden");

    $("wand-label").textContent = t.wandLbl;
    $("wand-cta").textContent = t.wandCta;
    $("wand-again").textContent = t.wandAgain;
    $("wand-more").textContent = t.wandMore;

    var icon = $("wand-icon");

    if (wand) {
      icon.innerHTML = SVG_WAND;
      $("wand-wood").textContent = WOODS[wand.wood][lang];
      $("wand-l1").textContent = CORES[wand.core][lang];
      $("wand-l2").textContent = FLEX[wand.flex].len + " " + t.inch;
      $("wand-l3").textContent = FLEX[wand.flex][lang];
      $("wand-more").classList.remove("hidden");
      $("wand-cta").classList.add("hidden");
      $("wand-again").classList.remove("hidden");
    } else {
      icon.innerHTML = SVG_WAND;
      $("wand-wood").textContent = t.wandNone;
      $("wand-l1").textContent = t.wandNote;
      $("wand-l2").textContent = "";
      $("wand-l3").textContent = "";
      $("wand-more").classList.add("hidden");
      $("wand-cta").classList.remove("hidden");
      $("wand-again").classList.add("hidden");
    }
  }

  /* ---------- CHECKLIST ---------- */

  function renderChecklist(t) {
    var box = $("checklist");
    box.innerHTML = "";

    var items = [
      { label: t.ckHouse,    state: house !== "none" ? "done" : "todo" },
      { label: t.ckWand,     state: wand ? "done" : (house !== "none" ? "todo" : "soon") },
      { label: t.ckPatronus, state: "soon" },
      { label: t.ckPet,      state: "soon" }
    ];

    items.forEach(function (it) {
      var el = document.createElement("span");
      el.className = "ck-item " + it.state;
      var dot = document.createElement("span");
      dot.className = "ck-dot";
      dot.textContent = "\u2713";
      var tx = document.createElement("span");
      tx.textContent = it.label;
      el.appendChild(dot);
      el.appendChild(tx);
      box.appendChild(el);
    });
  }

  /* ---------- TAYOQCHA: BATAFSIL ---------- */

  function openWandDetail() {
    if (!wand) { return; }
    var t = T[lang];
    var wd = WOODS[wand.wood], cr = CORES[wand.core], fl = FLEX[wand.flex];

    $("det-kicker").textContent = t.detKicker;
    $("det-back-txt").textContent = t.back;

    $("det-art").innerHTML = SVG_WAND;
    $("det-title").textContent = wd[lang];
    $("det-spec").textContent = cr[lang] + " \u00b7 " + fl.len + " " + t.inch + " \u00b7 " + fl[lang];

    var key = wand.wood + "_" + wand.core;
    var fam = FAMOUS[key];
    if (fam) {
      $("det-famous-icon").innerHTML = SVG_WAND;
      $("det-famous-lbl").textContent = t.famousLbl;
      $("det-famous-who").textContent = fam[lang];
      $("det-famous").classList.remove("hidden");
    } else {
      $("det-famous").classList.add("hidden");
    }

    $("det-h-wood").textContent = t.hWood;
    $("det-wood").textContent = WOOD_LORE[wand.wood][lang];
    $("det-h-core").textContent = t.hCore;
    $("det-core").textContent = CORE_LORE[wand.core][lang];

    $("det-h-rare").textContent = t.hRare;
    $("det-rk1").textContent = t.rareCore;
    $("det-rv1").textContent = RARITY_CORE[wand.core] + "%";
    $("det-rk2").textContent = t.rarePair;
    $("det-rv2").textContent = RARITY_PAIR[wand.core] + "%";

    hideSortScreens();
    $("scr-prof").classList.add("hidden");
    $("scr-detail").classList.remove("hidden");
  }

  function closeWandDetail() {
    $("scr-detail").classList.add("hidden");
    openProfile();
  }

  /* ---------- UMUMIY SAYOHAT DVIGATELI ----------
     Saralash, tayoqcha va kelajakdagi patronus/hayvon/fan uchun
     bitta mexanika: kirish -> savollar -> o'ylanish -> natija.
     Har sayohat o'z konfiguratsiyasini beradi.                        */

  var QUEST = null;
  var qIdx = 0, qScore = null, qPicks = [], qBusy = false, qTimer = null;

  function stopSortTimer() {
    if (qTimer) { clearTimeout(qTimer); qTimer = null; }
    qBusy = false;
  }

  function pickOne(arr) {
    if (!arr || !arr.length) { return ""; }
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function hideSortScreens() {
    $("scr-detail").classList.add("hidden");
    $("scr-prof").classList.add("hidden");
    $("scr-cat").classList.add("hidden");
    $("scr-reveal").classList.add("hidden");
    $("scr-hat").classList.add("hidden");
    $("scr-think").classList.add("hidden");
    $("scr-sort").classList.add("hidden");
  }

  // 1-bosqich: tanishuv
  function startQuest(cfg) {
    QUEST = cfg;
    var v = cfg.voice[lang];
    stopSortTimer();
    hideSortScreens();
    if (cfg.mark) { cfg.mark($("hat-mark")); }
    $("hat-top").textContent = v.introTop;
    $("hat-mid").textContent = v.introMid;
    $("hat-bot").textContent = v.introBot;
    $("hat-go").textContent = v.ready;
    $("scr-hat").classList.remove("hidden");
  }

  // 2-bosqich: savollar
  function beginQuestions() {
    if (!QUEST) { return; }
    stopSortTimer();
    qIdx = 0;
    qPicks = [];
    qScore = {};
    hideSortScreens();
    $("scr-sort").classList.remove("hidden");
    renderSortQ();
  }

  function scoreFor(idx, opt, sign) {
    var w = QUEST.q[idx].w[opt] || {};
    var mult = QUEST.lastWeight && idx === QUEST.q.length - 1 ? 2 : 1;
    for (var k in w) {
      qScore[k] = (qScore[k] || 0) + sign * w[k] * mult;
    }
  }

  function sortBack() {
    if (qBusy || !QUEST) { return; }
    if (qIdx === 0) {
      hideSortScreens();
      if (leaveSort()) { return; }
      openProfile();
      return;
    }
    qIdx--;
    scoreFor(qIdx, qPicks.pop(), -1);
    try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.selectionChanged(); } } catch (e) {}
    renderSortQ();
  }

  function renderSortQ() {
    var t = T[lang];
    var v = QUEST.voice[lang];
    var text = QUEST.q[qIdx][lang];

    $("react-box").classList.add("hidden");
    $("sort-opts").classList.remove("hidden");
    $("hat-say").classList.remove("hidden");
    $("sort-q").classList.remove("hidden");

    var bar = $("sort-bar");
    bar.innerHTML = "";
    for (var i = 0; i < QUEST.q.length; i++) {
      var seg = document.createElement("span");
      if (i <= qIdx) { seg.className = "on"; }
      bar.appendChild(seg);
    }

    $("sort-step").textContent = t.step(qIdx + 1, QUEST.q.length);
    $("sort-back-txt").textContent = qIdx === 0 ? t.sortExit : t.back;
    $("hat-say").textContent = pickOne(v.before[qIdx]);
    $("sort-q").textContent = text.q;

    var box = $("sort-opts");
    box.innerHTML = "";
    text.a.forEach(function (label, i) {
      var b = document.createElement("button");
      b.className = "sort-opt";
      b.textContent = label;
      b.addEventListener("click", function () { answerSort(i); });
      box.appendChild(b);
    });
  }

  function answerSort(i) {
    if (qBusy) { return; }
    qBusy = true;

    scoreFor(qIdx, i, 1);
    qPicks.push(i);

    try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.impactOccurred("light"); } } catch (e) {}

    $("hat-say").classList.add("hidden");
    $("sort-q").classList.add("hidden");
    $("sort-opts").classList.add("hidden");
    var line = pickOne(QUEST.voice[lang].after);
    $("react-line").textContent = line;
    $("react-box").classList.remove("hidden");

    qIdx++;
    qTimer = setTimeout(function () {
      qBusy = false;
      if (qIdx < QUEST.q.length) { renderSortQ(); }
      else { runThinking(); }
    }, readMs(line));
  }

  // 3-bosqich: o'ylanish
  function runThinking() {
    var lines = QUEST.voice[lang].think;
    hideSortScreens();
    $("scr-think").classList.remove("hidden");

    var n = 0;
    function step() {
      if (n >= lines.length) { QUEST.finish(); return; }
      var el = $("think-line");
      var line = lines[n];
      el.textContent = line;
      el.className = "think-line";
      try { void el.offsetWidth; } catch (e) {}
      n++;
      qTimer = setTimeout(step, readMs(line));
    }
    step();
  }

  // Berilgan ro'yxatdan eng ko'p ball to'plaganini tanlaydi
  function topOf(keys, tieKey) {
    var best = null, top = -1, tied = [];
    for (var i = 0; i < keys.length; i++) {
      var v = qScore[keys[i]] || 0;
      if (v > top) { top = v; best = keys[i]; tied = [keys[i]]; }
      else if (v === top) { tied.push(keys[i]); }
    }
    if (tied.length > 1 && tieKey && tied.indexOf(tieKey) >= 0) { return tieKey; }
    return best;
  }

  /* ---------- SARALASH ---------- */

  var HOUSE_IDS = ["gryffindor", "slytherin", "ravenclaw", "hufflepuff"];

  var QUEST_HOUSE = {
    id: "house",
    q: SORTING,
    voice: HAT,
    lastWeight: true,
    mark: paintHat,
    finish: finishSorting
  };

  function startSorting() { startQuest(QUEST_HOUSE); }

  // Fakultet umrbod bo'lgani uchun tasdiq SAVOLLARDAN OLDIN so'raladi.
  // Yetti savolga javob bergandan keyingi ogohlantirish - ogohlantirish
  // emas, tuzoq. Tayoqcha uchun bu shart emas - u o'zgartirilishi mumkin.
  function confirmSorting() {
    if (QUEST !== QUEST_HOUSE) { beginQuestions(); return; }
    var t = T[lang];

    function go(agreed) {
      if (!agreed) { return; }
      report("sort_start", "1");     // boshlaganlar/tugatganlar nisbati uchun
      beginQuestions();
    }

    try {
      if (tg && tg.showPopup) {
        tg.showPopup({
          title: t.lockTitle,
          message: t.lockAsk,
          buttons: [
            { id: "go", type: "default", text: t.lockYes },
            { id: "no", type: "cancel", text: t.lockNo }
          ]
        }, function (id) { go(id === "go"); });
        return;
      }
      if (tg && tg.showConfirm) {
        tg.showConfirm(t.lockAsk, go);
        return;
      }
    } catch (e) {}
    go(window.confirm ? window.confirm(t.lockAsk) : true);
  }

  function pickHouse() {
    // Tenglikda oxirgi savoldagi tanlov hal qiladi
    var lastPick = qPicks[qPicks.length - 1];
    var lastW = SORTING[SORTING.length - 1].w[lastPick] || {};
    var tie = null;
    for (var k in lastW) { if (lastW[k] === 3) { tie = k; } }
    return topOf(HOUSE_IDS, tie);
  }

  function finishSorting() {
    var id = pickHouse();
    setHouse(id);
    reportHouse(id);

    var t = T[lang];
    var h = HOUSES[id];
    paintCrest($("rv-crest"), id, h.crest);
    $("rv-kicker").textContent = t.rvKicker;
    $("rv-place").textContent = HAT[lang].place;
    $("rv-name").textContent = h[lang];
    $("rv-sub").textContent = "";
    $("rv-sub").classList.add("hidden");
    // Uchinchi ogohlantirish nuqtasi: natija e'lon qilingandan keyin.
    // Ohang tantanali, xavotirli emas.
    $("rv-note").textContent = ((h["note_" + lang] || "") + " " + t.lockFinal).trim();
    $("rv-done").textContent = t.rvDone;

    hideSortScreens();
    $("scr-reveal").classList.remove("hidden");

    try {
      if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred("success"); }
    } catch (e) {}
  }

  /* ---------- TAYOQCHA ---------- */

  var CORE_IDS = ["phoenix", "dragon", "unicorn"];
  var WOOD_IDS = ["oak", "yew", "cherry", "holly", "aspen", "walnut"];
  var FLEX_IDS = ["rigid", "springy", "supple", "yielding"];

  var QUEST_WAND = {
    id: "wand",
    q: WANDQ,
    voice: OLLI,
    lastWeight: false,
    mark: paintWandMark,
    finish: finishWand
  };

  function startWand() { startQuest(QUEST_WAND); }

  function paintWandMark(el) {
    drawSvg(el, SVG_SHELF, "hat-mark art art-shelf");
  }

  function finishWand() {
    var w = {
      wood: topOf(WOOD_IDS),
      core: topOf(CORE_IDS),
      flex: topOf(FLEX_IDS)
    };
    setWand(w);
    reportWand(w);

    var t = T[lang];
    var wd = WOODS[w.wood], cr = CORES[w.core], fl = FLEX[w.flex];

    drawSvg($("rv-crest"), SVG_WAND, "reveal-crest art art-wand");
    $("rv-kicker").textContent = t.wandKicker;
    $("rv-place").textContent = OLLI[lang].place;
    $("rv-name").textContent = wd[lang] + ", " + cr[lang];
    $("rv-sub").textContent = fl.len + " " + t.inch + ", " + fl[lang];
    $("rv-sub").classList.remove("hidden");
    $("rv-note").textContent = wd["t_" + lang] + ". " + cr["note_" + lang];
    $("rv-done").textContent = t.rvDone;

    hideSortScreens();
    $("scr-reveal").classList.remove("hidden");

    try {
      if (tg && tg.HapticFeedback) { tg.HapticFeedback.notificationOccurred("success"); }
    } catch (e) {}
  }

  function wandLabel(w, code) {
    if (!w || !WOODS[w.wood] || !CORES[w.core]) { return ""; }
    return WOODS[w.wood][code] + ", " + CORES[w.core][code];
  }

  function closeReveal() {
    $("scr-reveal").classList.add("hidden");
    openProfile();
  }

  function openProfile() {
    stopSortTimer();
    $("scr-detail").classList.add("hidden");
    $("scr-cat").classList.add("hidden");
    $("scr-lang").classList.add("hidden");
    $("scr-sort").classList.add("hidden");
    $("scr-reveal").classList.add("hidden");
    $("scr-hat").classList.add("hidden");
    $("scr-think").classList.add("hidden");
    $("scr-prof").classList.remove("hidden");
    renderProfile();
  }

  function closeProfile() {
    $("scr-prof").classList.add("hidden");
    $("scr-cat").classList.remove("hidden");
    renderCatalog();
  }

  function goBack() {
    stopSortTimer();
    $("scr-detail").classList.add("hidden");
    $("scr-cat").classList.add("hidden");
    $("scr-prof").classList.add("hidden");
    $("scr-sort").classList.add("hidden");
    $("scr-reveal").classList.add("hidden");
    $("scr-hat").classList.add("hidden");
    $("scr-think").classList.add("hidden");
    $("scr-cup").classList.add("hidden");
    if (leaveSort()) { return; }
    $("scr-lang").classList.remove("hidden");
  }

  /* ---------- ISHGA TUSHIRISH ---------- */

  function init() {
    preloadCrests();
    renderLangs();
    $("back-btn").addEventListener("click", goBack);
    $("avatar-btn").addEventListener("click", openProfile);
    $("prof-back").addEventListener("click", closeProfile);
    $("sort-cta").addEventListener("click", startSorting);
    $("sort-card-btn").addEventListener("click", startSorting);
    $("wand-cta").addEventListener("click", startWand);
    $("wand-more").addEventListener("click", openWandDetail);
    $("det-back").addEventListener("click", closeWandDetail);
    $("wand-card-btn").addEventListener("click", startWand);
    $("wand-again").addEventListener("click", function () {
      var msg = T[lang].wandAskAgain;
      if (tg && tg.showConfirm) {
        tg.showConfirm(msg, function (ok) { if (ok) { startWand(); } });
      } else if (window.confirm ? window.confirm(msg) : true) {
        startWand();
      }
    });
    $("cup-strip").addEventListener("click", openCup);
    $("cup-back").addEventListener("click", closeCup);
    $("cup-cta").addEventListener("click", function () {
      // Fakultetsizga - saralanish, chegaradan o'tmaganga - a'zo taklifi
      if (this.getAttribute("data-act") === "sort") {
        $("scr-cup").classList.add("hidden");
        startSorting();
        return;
      }
      var url = "https://t.me/" + BOT;
      var text = T[lang].cupJoin;
      try {
        if (tg && tg.openTelegramLink) {
          tg.openTelegramLink("https://t.me/share/url?url=" +
            encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
          return;
        }
      } catch (e) {}
      try { window.open(url, "_blank"); } catch (e) {}
    });
    $("hat-go").addEventListener("click", confirmSorting);
    $("sort-back").addEventListener("click", sortBack);
    $("rv-done").addEventListener("click", closeReveal);
    // Ogohlantirish shlyapa ekranidagi confirmSorting() da beriladi.
    // Bu yerda ikkinchi oyna ko'rsatilmaydi - u lockAsk ga zid edi.
    $("resort-btn").addEventListener("click", startSorting);

    var u = tgUser();
    fillAvatar($("avatar-btn"), u, u ? fullName(u) : "?", false);

    // Ikkala ekran ham yashirin turadi — saqlangan til aniqlangunicha
    $("scr-lang").classList.add("hidden");
    $("scr-cat").classList.add("hidden");
    $("scr-prof").classList.add("hidden");
    $("scr-sort").classList.add("hidden");
    $("scr-reveal").classList.add("hidden");
    $("scr-hat").classList.add("hidden");
    $("scr-think").classList.add("hidden");
    $("scr-detail").classList.add("hidden");
    $("scr-cup").classList.add("hidden");
    $("cup-back-txt").textContent = T[lang].cupBack;

    // Lokal ma'lumot sinxron o'qiladi — kutish shart emas
    absorb(readLocal());
    var quick = readLocalLang();
    var localHouse = readLocalHouse();
    if (localHouse) { house = localHouse; }
    wand = readLocalWand();
    applyHouse(house);

    var settled = false;
    function show(saved) {
      if (settled) { return; }
      settled = true;
      if (saved) { openCatalog(saved, false); }
      else { $("scr-lang").classList.remove("hidden"); }
    }

    if (quick) { migrate(quick); show(quick); }

    load(function (saved, houseChanged) {
      migrate(saved || quick || "uz");
      show(saved);
      if (!$("scr-cat").classList.contains("hidden")) { renderCatalog(); }
      if (houseChanged) { refreshHouseView(); }
    });

    // Reyting fon rejimida yuklanadi - kechiksa yoki xato bo'lsa,
    // katalog baribir ochiladi, tasma shunchaki ko'rinmaydi.
    fetchCup(function () {
      $("cup-back-txt").textContent = T[lang].cupBack;
      if (!$("scr-cat").classList.contains("hidden")) { renderCupStrip(); }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
