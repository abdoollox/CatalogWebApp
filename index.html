<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Garri Potter 4K</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14; --bg2:#14181f; --card:#161b23; --line:rgba(255,255,255,.09);
  --text:#eef1f5; --dim:#98a2b3; --accent:#e0ae4e; --accent-ink:#1a1204;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  -webkit-font-smoothing:antialiased;
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--text);min-height:100vh;
  display:flex;justify-content:center;
}
.shell{width:100%;max-width:440px;padding:22px 18px 40px}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen{animation:riseIn .4s ease both}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

/* --- TIL EKRANI --- */
.lang-head{display:flex;flex-direction:column;gap:6px;padding:38px 4px 30px}
.lang-head h1{
  margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:40px;line-height:1.05;letter-spacing:-.01em;
}
.lang-head h1 em{font-style:italic;color:var(--accent)}
.lang-head p{margin:8px 0 0;font:400 14px/1.5 'Manrope',sans-serif;color:var(--dim)}
.lang-list{display:flex;flex-direction:column;gap:12px}
.lang-btn{
  display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:14px;
  width:100%;text-align:left;padding:16px;background:var(--card);
  border:1px solid var(--line);border-radius:18px;cursor:pointer;color:var(--text);
  font-family:'Manrope',sans-serif;
  transition:border-color .2s,transform .12s,background .2s;
}
.lang-btn:hover{border-color:var(--accent);background:var(--bg2)}
.lang-btn:active{transform:scale(.985)}
.lang-mark{
  display:grid;place-items:center;width:52px;height:52px;border-radius:14px;
  font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--accent-ink);
}
.lang-name{display:flex;flex-direction:column;gap:3px}
.lang-name b{font:600 16px/1.2 'Manrope',sans-serif}
.lang-name small{font:500 12px/1.2 'Manrope',sans-serif;color:var(--dim);letter-spacing:.04em}
.chev{color:var(--dim);font-size:16px}

/* --- KATALOG SARLAVHASI --- */
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 20px}
.cat-head .kicker{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);
}
.cat-head h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:27px;line-height:1.1}
.back-btn{
  display:flex;align-items:center;gap:7px;padding:9px 13px;background:transparent;
  border:1px solid var(--line);border-radius:99px;color:var(--dim);
  font:600 12px/1 'Manrope',sans-serif;letter-spacing:.06em;cursor:pointer;transition:.2s;
}
.back-btn:hover{color:var(--text);border-color:var(--accent)}
.back-btn:active{transform:scale(.96)}

/* --- PROGRESS --- */
.prog{padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-label{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);
}
.prog-count{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--accent)}
.prog-ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin:13px 0 10px}
.prog-ticks span{height:5px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .4s ease}
.prog-ticks span.on{background:var(--accent)}
.prog-hint{margin:0;font:500 12px/1.4 'Manrope',sans-serif;color:var(--dim)}

/* --- KEYINGI FILM --- */
.next{
  display:grid;grid-template-columns:64px 1fr;gap:15px;align-items:center;
  margin-top:14px;padding:15px;border-radius:18px;
  background:linear-gradient(115deg,rgba(224,174,78,.15),rgba(224,174,78,.04));
  border:1px solid rgba(224,174,78,.32);
}
.next-art{
  position:relative;display:grid;place-items:center;height:92px;border-radius:12px;
  overflow:hidden;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--accent-ink);
}
.next-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.next-body{display:flex;flex-direction:column;gap:9px;min-width:0}
.next-kicker{
  font:600 10px/1 'Manrope',sans-serif;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);
}
.next-title{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.15}
.next-play{
  align-self:start;padding:10px 18px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:99px;font:800 13px/1 'Manrope',sans-serif;
  cursor:pointer;transition:transform .12s;
}
.next-play:active{transform:scale(.95)}

/* --- KARTALAR --- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.card{
  position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);cursor:pointer;
  transition:transform .14s,border-color .3s;
}
.card:active{transform:scale(.98)}
.card.next-up{border-color:var(--accent)}
.card.seen{border-color:rgba(255,255,255,.12)}
.card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:transparent;transition:background .3s}
.card.seen .veil{background:rgba(7,9,13,.6)}
.numeral{
  position:absolute;top:0;left:0;padding:11px 13px;
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;
  line-height:1;color:rgba(18,13,4,.6);
}
.card.has-img .numeral{color:rgba(244,246,249,.85);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.check{
  position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:transparent;
  border:2px solid rgba(20,14,4,.75);color:var(--accent-ink);
  font:800 13px/1 'Manrope',sans-serif;cursor:pointer;padding:0;
  transition:transform .15s;
}
.card.has-img .check{border-color:rgba(255,255,255,.7)}
.card.seen .check{background:var(--accent);border-color:var(--accent)}
.check:active{transform:scale(.86)}
.card-foot{
  position:absolute;left:0;right:0;bottom:0;
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;
  padding:28px 13px 13px;
  background:linear-gradient(to top,rgba(6,8,12,.94) 12%,rgba(6,8,12,.65) 55%,transparent);
}
.card-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.card-play{
  flex:none;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);border:none;padding:0;
  font-size:14px;line-height:1;cursor:pointer;
  transition:transform .12s,background .2s;
}
.card-play:active{transform:scale(.88)}
.card.seen .card-play{background:rgba(255,255,255,.16);color:#dfe5ee}
.card-title{
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;
  line-height:1.1;color:#f4f6f9;
}
.card-meta{
  font:600 10px/1.2 'Manrope',sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);
}
.card.seen .card-meta{color:var(--dim)}
</style>
</head>
<body>
<div class="shell">

  <div id="scr-lang" class="screen">
    <div class="lang-head">
      <h1>Kino tilini<br><em>tanlang</em></h1>
      <p>Choose language · Выберите язык</p>
    </div>
    <div class="lang-list" id="lang-list"></div>
  </div>

  <div id="scr-cat" class="screen hidden">
    <div class="cat-head">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="kicker" id="kicker">Katalog</span>
        <h1 id="cat-title">Garri Potter</h1>
      </div>
      <button class="back-btn" id="back-btn"><span id="lang-badge">UZ</span> <span style="font-size:13px">⇄</span></button>
    </div>

    <div class="prog">
      <div class="prog-top">
        <span class="prog-label" id="prog-label">Progress</span>
        <span class="prog-count" id="prog-count">0 / 8</span>
      </div>
      <div class="prog-ticks" id="prog-ticks"></div>
      <p class="prog-hint" id="prog-hint"></p>
    </div>

    <div class="next hidden" id="next-box">
      <span class="next-art" id="next-art"></span>
      <div class="next-body">
        <span class="next-kicker" id="next-kicker">Keyingi film</span>
        <span class="next-title" id="next-title"></span>
        <button class="next-play" id="next-play">▶ Ko'rish</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var BOT = "garripotterkinobot";
  var KEY = "watched_movies";
  var LANG_KEY = "pref_lang";

  var MOVIES = [
    { id: "hp1", uz: "Hikmatlar Toshi",   ru: "Философский Камень", en: "Philosopher's Stone" },
    { id: "hp2", uz: "Maxfiy Hujra",      ru: "Тайная Комната",     en: "Chamber of Secrets" },
    { id: "hp3", uz: "Azkaban Mahbusi",   ru: "Узник Азкабана",     en: "Prisoner of Azkaban" },
    { id: "hp4", uz: "Alanga Kubogi",     ru: "Кубок Огня",         en: "Goblet of Fire" },
    { id: "hp5", uz: "Feniks Jamiyati",   ru: "Орден Феникса",      en: "Order of the Phoenix" },
    { id: "hp6", uz: "Tilsim Shaxzodasi", ru: "Принц Полукровка",   en: "Half-Blood Prince" },
    { id: "hp7", uz: "Ajal Tuhfasi 1",    ru: "Дары Смерти 1",      en: "Deathly Hallows 1" },
    { id: "hp8", uz: "Ajal Tuhfasi 2",    ru: "Дары Смерти 2",      en: "Deathly Hallows 2" }
  ];

  var NUMERALS = ["I","II","III","IV","V","VI","VII","VIII"];
  var YEARS = ["2001","2002","2004","2005","2007","2009","2010","2011"];
  var GRADS = [
    "linear-gradient(150deg,#d9b46a,#8d6a2f)",
    "linear-gradient(150deg,#8fb9a8,#3f6b62)",
    "linear-gradient(150deg,#a9b6cf,#4d5b78)",
    "linear-gradient(150deg,#e0a06a,#8a4a2c)",
    "linear-gradient(150deg,#c9a2c4,#61406a)",
    "linear-gradient(150deg,#9fb2c9,#3c4f6b)",
    "linear-gradient(150deg,#b6b0a4,#5a544a)",
    "linear-gradient(150deg,#cf9a8d,#6b3b3b)"
  ];

  var T = {
    uz: { kicker:"Katalog", title:"Garri Potter", watch:"Ko'rish", label:"Progress",
          next:"Keyingi film", seen:"Ko'rildi",
          hintStart:"Sayohatni boshlang", hintDone:"Barcha filmlar ko'rildi",
          hintMid:function(n){return "Yana "+n+" ta film qoldi";} },
    ru: { kicker:"Каталог", title:"Гарри Поттер", watch:"Смотреть", label:"Прогресс",
          next:"Следующий фильм", seen:"Просмотрено",
          hintStart:"Начните путешествие", hintDone:"Все фильмы просмотрены",
          hintMid:function(n){return "Осталось фильмов: "+n;} },
    en: { kicker:"Catalog", title:"Harry Potter", watch:"Watch", label:"Progress",
          next:"Up next", seen:"Watched",
          hintStart:"Start the journey", hintDone:"All films watched",
          hintMid:function(n){return n+" films left";} }
  };

  var LANGS = [
    { code:"uz", name:"O'zbekcha", note:"UZ · Uzbek",   mark:"Uz", grad:GRADS[0] },
    { code:"ru", name:"Русский",   note:"RU · Russian", mark:"Ру", grad:GRADS[2] },
    { code:"en", name:"English",   note:"EN · English", mark:"En", grad:GRADS[1] }
  ];

  var lang = "uz";
  var watched = {};
  var cloudOk = false;

  function $(id) { return document.getElementById(id); }

  function list() {
    var out = [];
    for (var k in watched) { if (watched[k]) { out.push(k); } }
    return out;
  }

  /* ---------- SAQLASH ---------- */

  function hasCloud() {
    try { return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")); }
    catch (e) { return false; }
  }

  function absorb(arr) {
    for (var i = 0; i < arr.length; i++) { if (arr[i]) { watched[arr[i]] = true; } }
  }

  function readLocal() {
    try { var raw = window.localStorage.getItem(KEY); return raw ? raw.split(",") : []; }
    catch (e) { return []; }
  }

  function writeLocal() {
    try { window.localStorage.setItem(KEY, list().join(",")); } catch (e) {}
  }

  function validLang(v) { return v === "uz" || v === "ru" || v === "en" ? v : null; }

  function readLocalLang() {
    try { return validLang(window.localStorage.getItem(LANG_KEY)); }
    catch (e) { return null; }
  }

  function saveLang(code) {
    try { window.localStorage.setItem(LANG_KEY, code); } catch (e) {}
    if (!cloudOk) { return; }
    try { tg.CloudStorage.setItem(LANG_KEY, code, function () {}); } catch (e) {}
  }

  function load(done) {
    absorb(readLocal());
    var localLang = readLocalLang();

    if (!hasCloud()) { done(localLang); return; }
    cloudOk = true;

    var fired = false;
    function once(l) { if (!fired) { fired = true; done(l); } }
    setTimeout(function () { once(localLang); }, 1200);

    try {
      tg.CloudStorage.getItems([KEY, LANG_KEY], function (err, vals) {
        var l = localLang;
        if (!err && vals) {
          if (vals[KEY]) { absorb(vals[KEY].split(",")); writeLocal(); }
          var cl = validLang(vals[LANG_KEY]);
          if (!l && cl) { l = cl; try { window.localStorage.setItem(LANG_KEY, cl); } catch (e) {} }
        }
        once(l);
      });
    } catch (e) { once(localLang); }
  }

  function persist(cb) {
    writeLocal();
    if (!cloudOk) { if (cb) { cb(); } return; }

    var fired = false;
    function once() { if (!fired) { fired = true; if (cb) { cb(); } } }
    setTimeout(once, 1200);

    try { tg.CloudStorage.setItem(KEY, list().join(","), once); }
    catch (e) { once(); }
  }

  /* ---------- HARAKATLAR ---------- */

  function toggle(id) {
    if (watched[id]) { delete watched[id]; } else { watched[id] = true; }
    try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.selectionChanged(); } } catch (e) {}
    persist();
    renderCatalog();
  }

  function play(id) {
    var link = "https://t.me/" + BOT + "?start=" + id + "_" + lang;
    watched[id] = true;
    renderCatalog();
    persist(function () {
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); tg.close(); }
      else { window.open(link, "_blank"); }
    });
  }

  /* ---------- CHIZISH ---------- */

  function poster(id) { return "img/" + id + "_" + lang + ".jpg"; }

  function nextIndex() {
    for (var i = 0; i < MOVIES.length; i++) { if (!watched[MOVIES[i].id]) { return i; } }
    return -1;
  }

  function renderLangs() {
    var box = $("lang-list");
    box.innerHTML = "";
    LANGS.forEach(function (l) {
      var b = document.createElement("button");
      b.className = "lang-btn";

      var mark = document.createElement("span");
      mark.className = "lang-mark";
      mark.style.background = l.grad;
      mark.textContent = l.mark;

      var nm = document.createElement("span");
      nm.className = "lang-name";
      var strong = document.createElement("b");
      strong.textContent = l.name;
      var small = document.createElement("small");
      small.textContent = l.note;
      nm.appendChild(strong);
      nm.appendChild(small);

      var chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "›";

      b.appendChild(mark);
      b.appendChild(nm);
      b.appendChild(chev);
      b.addEventListener("click", function () { openCatalog(l.code, true); });
      box.appendChild(b);
    });
  }

  function renderProgress(t) {
    var n = 0;
    MOVIES.forEach(function (m) { if (watched[m.id]) { n++; } });
    var total = MOVIES.length;

    $("prog-count").textContent = n + " / " + total;
    $("prog-hint").textContent =
      n === 0 ? t.hintStart : (n === total ? t.hintDone : t.hintMid(total - n));

    var ticks = $("prog-ticks");
    ticks.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var s = document.createElement("span");
      if (i < n) { s.className = "on"; }
      ticks.appendChild(s);
    }
  }

  function renderNext(t) {
    var box = $("next-box");
    var i = nextIndex();
    if (i < 0) { box.classList.add("hidden"); return; }

    box.classList.remove("hidden");
    var m = MOVIES[i];

    var art = $("next-art");
    art.innerHTML = "";
    art.style.background = GRADS[i];
    art.textContent = NUMERALS[i];

    var img = document.createElement("img");
    img.src = poster(m.id);
    img.alt = "";
    img.onerror = function () { this.remove(); };
    img.onload = function () { art.textContent = ""; art.appendChild(img); };
    art.appendChild(img);

    $("next-kicker").textContent = t.next;
    $("next-title").textContent = m[lang];
    $("next-play").textContent = "▶ " + t.watch;
    $("next-play").onclick = function () { play(m.id); };
  }

  function renderCards(t) {
    var grid = $("grid");
    var ni = nextIndex();
    grid.innerHTML = "";

    MOVIES.forEach(function (m, i) {
      var seen = !!watched[m.id];

      var card = document.createElement("div");
      card.className = "card" + (seen ? " seen" : (i === ni ? " next-up" : ""));
      card.style.background = GRADS[i];

      var img = document.createElement("img");
      img.className = "card-img";
      img.src = poster(m.id);
      img.alt = m[lang];
      img.onerror = function () { this.remove(); };
      img.onload = function () { card.classList.add("has-img"); };
      card.appendChild(img);

      var veil = document.createElement("span");
      veil.className = "veil";
      card.appendChild(veil);

      var num = document.createElement("span");
      num.className = "numeral";
      num.textContent = NUMERALS[i];
      card.appendChild(num);

      var check = document.createElement("button");
      check.className = "check";
      check.textContent = seen ? "✓" : "";
      check.setAttribute("aria-label", m[lang]);
      check.addEventListener("click", function (ev) {
        ev.stopPropagation();
        toggle(m.id);
      });
      card.appendChild(check);

      var foot = document.createElement("span");
      foot.className = "card-foot";

      var textCol = document.createElement("span");
      textCol.className = "card-text";
      var ttl = document.createElement("span");
      ttl.className = "card-title";
      ttl.textContent = m[lang];
      var meta = document.createElement("span");
      meta.className = "card-meta";
      meta.textContent = seen ? t.seen : (i === ni ? t.next : YEARS[i]);
      textCol.appendChild(ttl);
      textCol.appendChild(meta);
      foot.appendChild(textCol);

      var pl = document.createElement("button");
      pl.className = "card-play";
      pl.textContent = "▶";
      pl.setAttribute("aria-label", t.watch + " — " + m[lang]);
      pl.addEventListener("click", function (ev) {
        ev.stopPropagation();
        play(m.id);
      });
      foot.appendChild(pl);

      card.appendChild(foot);

      grid.appendChild(card);
    });
  }

  function renderCatalog() {
    var t = T[lang];
    $("kicker").textContent = t.kicker;
    $("cat-title").textContent = t.title;
    $("prog-label").textContent = t.label;
    $("lang-badge").textContent = lang.toUpperCase();
    renderProgress(t);
    renderNext(t);
    renderCards(t);
  }

  function openCatalog(code, remember) {
    lang = code;
    if (remember) { saveLang(code); }
    $("scr-lang").classList.add("hidden");
    $("scr-cat").classList.remove("hidden");
    renderCatalog();
  }

  function goBack() {
    $("scr-cat").classList.add("hidden");
    $("scr-lang").classList.remove("hidden");
  }

  /* ---------- ISHGA TUSHIRISH ---------- */

  function init() {
    renderLangs();
    $("back-btn").addEventListener("click", goBack);

    // Ikkala ekran ham yashirin turadi — saqlangan til aniqlangunicha
    $("scr-lang").classList.add("hidden");
    $("scr-cat").classList.add("hidden");

    var settled = false;
    function show(saved) {
      if (settled) { return; }
      settled = true;
      if (saved) { openCatalog(saved, false); }
      else { $("scr-lang").classList.remove("hidden"); }
    }

    // Lokal xotirada til bo'lsa — darhol ochamiz, kutmaymiz
    var quick = readLocalLang();
    if (quick) { show(quick); }

    load(function (saved) {
      show(saved);
      if (!$("scr-cat").classList.contains("hidden")) { renderCatalog(); }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
