<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hogwarts Cinema</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at 50% 5%, #0b1320 0%, #000000 100%);
  color: #e0e6ed;
  margin: 0; padding: 15px; text-align: center;
  min-height: 100vh;
}
h2 {
  font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 30px;
  text-shadow: 0 0 10px rgba(255,255,255,0.2);
}

#lang-screen {
  display: flex; flex-direction: column; gap: 20px;
  margin-top: 60px; padding: 0 15px;
}
.lang-btn {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  padding: 15px 20px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
  transition: all 0.3s ease;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.lang-btn img {
  width: 80%; max-height: 70px; object-fit: contain;
  filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
  transition: transform 0.3s ease;
}
.lang-btn span {
  font-size: 13px; font-weight: 700; color: #8892b0;
  letter-spacing: 1px; text-transform: uppercase;
}
.lang-btn:active {
  background: rgba(77, 166, 255, 0.1);
  box-shadow: 0 0 20px rgba(77, 166, 255, 0.4);
  border-color: #4da6ff;
}
.lang-btn:active img { transform: scale(0.95); }

#catalog-screen { display: none; padding-bottom: 30px; }
.back-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #aaa; padding: 10px 20px; border-radius: 12px;
  margin-bottom: 25px; cursor: pointer; transition: 0.2s;
}
.back-btn:active { background: rgba(255, 255, 255, 0.1); color: white; }

#progress-box {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 16px;
  margin: 0 0 22px 0;
  text-align: left;
}
#progress-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
#progress-label { font-size: 12px; color: #8892b0; letter-spacing: 1px; text-transform: uppercase; }
#progress-count { font-size: 15px; font-weight: 800; color: #4da6ff; }
#progress-track { height: 6px; background: rgba(255,255,255,0.07); border-radius: 99px; overflow: hidden; }
#progress-fill {
  height: 100%; width: 0%;
  background: #4da6ff; border-radius: 99px;
  box-shadow: 0 0 12px rgba(77,166,255,0.6);
  transition: width 0.6s cubic-bezier(.2,.8,.2,1);
}
#progress-hint { font-size: 12px; color: #6b7891; margin: 9px 0 0 0; }

.catalog-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px;
}
.movie-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column; padding-bottom: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  position: relative;
  transition: border-color 0.3s ease;
}
.movie-card.watched { border-color: rgba(77,166,255,0.35); }
.movie-card.next { border-color: rgba(255, 208, 92, 0.55); }

.poster-wrap { position: relative; }
.movie-card img {
  width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
  display: block; margin-bottom: 12px;
  transition: opacity 0.3s ease;
}
.movie-card.watched img { opacity: 0.45; }

.check {
  position: absolute; top: 8px; right: 8px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,0.55);
  border: 1.5px solid rgba(255,255,255,0.25);
  color: transparent;
  font-size: 15px; font-weight: 900; line-height: 27px;
  cursor: pointer; padding: 0;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  transition: all 0.2s ease;
}
.movie-card.watched .check {
  background: #4da6ff; border-color: #4da6ff; color: #000;
  box-shadow: 0 0 14px rgba(77,166,255,0.55);
}
.check:active { transform: scale(0.88); }

.next-tag {
  position: absolute; top: 8px; left: 8px;
  background: rgba(255, 208, 92, 0.92);
  color: #221a00;
  font-size: 10px; font-weight: 900; letter-spacing: 0.5px;
  padding: 4px 8px; border-radius: 7px;
  text-transform: uppercase;
}

.movie-title {
  font-size: 13px; font-weight: bold; margin: 0 5px 12px 5px;
  height: 32px; overflow: hidden; color: #ddd;
}
.play-btn {
  background: #4da6ff; color: #000; border: none;
  padding: 12px; border-radius: 10px; font-weight: 900;
  width: 85%; margin: 0 auto; cursor: pointer;
  box-shadow: 0 0 10px rgba(77, 166, 255, 0.3); transition: 0.2s;
}
.play-btn:active { transform: scale(0.95); box-shadow: 0 0 20px rgba(77, 166, 255, 0.6); }
.movie-card.watched .play-btn {
  background: rgba(255,255,255,0.09); color: #9fb3cc; box-shadow: none;
}
</style>
</head>
<body>

<div id="lang-screen">
  <h2>Kino tilini tanlang</h2>
  <button class="lang-btn" data-lang="uz">
    <img src="img/logo_uz.svg" alt="O'zbek tili" onerror="this.style.display='none'">
    <span>🇺🇿 O'zbekcha</span>
  </button>
  <button class="lang-btn" data-lang="ru">
    <img src="img/logo_ru.svg" alt="Русский язык" onerror="this.style.display='none'">
    <span>🇷🇺 Русский</span>
  </button>
  <button class="lang-btn" data-lang="en">
    <img src="img/logo_en.svg" alt="English" onerror="this.style.display='none'">
    <span>🇬🇧 English</span>
  </button>
</div>

<div id="catalog-screen">
  <button class="back-btn" id="back-btn">🔙 Tilni o'zgartirish</button>
  <h2 id="catalog-title">Katalog</h2>

  <div id="progress-box">
    <div id="progress-head">
      <span id="progress-label">Progress</span>
      <span id="progress-count">0 / 8</span>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <p id="progress-hint"></p>
  </div>

  <div class="catalog-grid" id="grid"></div>
</div>

<script>
(function () {
  "use strict";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.expand(); tg.ready(); } catch (e) {} }

  var BOT_USERNAME = "garripotterkinobot";
  var STORE_KEY = "watched_movies";

  var currentLang = "uz";
  var watched = {};
  var cloudOk = false;

  var movies = [
    { id: "hp1", uz: "Hikmatlar Toshi", ru: "Философский Камень", en: "Philosopher's Stone" },
    { id: "hp2", uz: "Maxfiy Hujra", ru: "Тайная Комната", en: "Chamber of Secrets" },
    { id: "hp3", uz: "Azkaban Mahbusi", ru: "Узник Азкабана", en: "Prisoner of Azkaban" },
    { id: "hp4", uz: "Alanga Kubogi", ru: "Кубок Огня", en: "Goblet of Fire" },
    { id: "hp5", uz: "Feniks Jamiyati", ru: "Орден Феникса", en: "Order of the Phoenix" },
    { id: "hp6", uz: "Tilsim Shaxzodasi", ru: "Принц Полукровка", en: "Half-Blood Prince" },
    { id: "hp7", uz: "Ajal Tuhfasi 1", ru: "Дары Смерти 1", en: "Deathly Hallows 1" },
    { id: "hp8", uz: "Ajal Tuhfasi 2", ru: "Дары Смерти 2", en: "Deathly Hallows 2" }
  ];

  var T = {
    uz: { title: "🎬 Garri Potter", back: "⏏️ Tilni o'zgartirish", watch: "Ko'rish",
          again: "Qayta ko'rish", label: "Progress", next: "Keyingi",
          hintStart: "Sayohatni boshlang", hintDone: "Barcha filmlar ko'rildi",
          hintMid: function (n) { return "Yana " + n + " ta film qoldi"; } },
    ru: { title: "🎬 Гарри Поттер", back: "⏏️ Сменить язык", watch: "Смотреть",
          again: "Пересмотреть", label: "Прогресс", next: "Далее",
          hintStart: "Начните путешествие", hintDone: "Все фильмы просмотрены",
          hintMid: function (n) { return "Осталось фильмов: " + n; } },
    en: { title: "🎬 Harry Potter", back: "⏏️ Change language", watch: "Watch",
          again: "Watch again", label: "Progress", next: "Next",
          hintStart: "Start the journey", hintDone: "All films watched",
          hintMid: function (n) { return n + " films left"; } }
  };

  function $(id) { return document.getElementById(id); }

  function watchedList() {
    var out = [];
    for (var k in watched) { if (watched[k]) { out.push(k); } }
    return out;
  }

  function watchedCount() { return watchedList().length; }

  /* ---------- SAQLASH ---------- */

  function hasCloud() {
    try {
      return !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
    } catch (e) { return false; }
  }

  function readLocal() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      return raw ? raw.split(",") : [];
    } catch (e) { return []; }
  }

  function writeLocal(list) {
    try { window.localStorage.setItem(STORE_KEY, list.join(",")); } catch (e) {}
  }

  function absorb(list) {
    for (var i = 0; i < list.length; i++) {
      if (list[i]) { watched[list[i]] = true; }
    }
  }

  function loadProgress(done) {
    absorb(readLocal());

    if (!hasCloud()) { done(); return; }
    cloudOk = true;

    var finished = false;
    function finishOnce() {
      if (finished) { return; }
      finished = true;
      done();
    }
    setTimeout(finishOnce, 2500);

    try {
      tg.CloudStorage.getItem(STORE_KEY, function (err, value) {
        if (!err && value) {
          absorb(value.split(","));
          writeLocal(watchedList());
        }
        finishOnce();
      });
    } catch (e) { finishOnce(); }
  }

  function saveProgress(cb) {
    var list = watchedList();
    writeLocal(list);

    if (!cloudOk) { if (cb) { cb(); } return; }

    var called = false;
    function once() {
      if (called) { return; }
      called = true;
      if (cb) { cb(); }
    }
    setTimeout(once, 1200);

    try { tg.CloudStorage.setItem(STORE_KEY, list.join(","), once); }
    catch (e) { once(); }
  }

  /* ---------- CHIZISH ---------- */

  function nextUnwatchedId() {
    for (var i = 0; i < movies.length; i++) {
      if (!watched[movies[i].id]) { return movies[i].id; }
    }
    return null;
  }

  function renderProgress() {
    var t = T[currentLang];
    var n = watchedCount();
    var total = movies.length;
    var left = total - n;

    $("progress-count").textContent = n + " / " + total;
    $("progress-fill").style.width = Math.round(n / total * 100) + "%";
    $("progress-hint").textContent =
      n === 0 ? t.hintStart : (left === 0 ? t.hintDone : t.hintMid(left));
  }

  function renderMovies() {
    var grid = $("grid");
    var t = T[currentLang];
    var nextId = nextUnwatchedId();

    grid.innerHTML = "";

    movies.forEach(function (movie) {
      var isWatched = !!watched[movie.id];
      var isNext = movie.id === nextId;
      var title = movie[currentLang];

      var card = document.createElement("div");
      card.className = "movie-card" + (isWatched ? " watched" : "") + (isNext ? " next" : "");

      var wrap = document.createElement("div");
      wrap.className = "poster-wrap";

      var img = document.createElement("img");
      img.src = "img/" + movie.id + "_" + currentLang + ".jpg";
      img.alt = title;
      img.onerror = function () {
        this.onerror = null;
        this.src = "https://via.placeholder.com/150/2b2b2b/FFFFFF?text=Poster";
      };
      wrap.appendChild(img);

      if (isNext) {
        var tag = document.createElement("span");
        tag.className = "next-tag";
        tag.textContent = t.next;
        wrap.appendChild(tag);
      }

      var check = document.createElement("button");
      check.className = "check";
      check.textContent = "✓";
      check.setAttribute("aria-label", title);
      check.addEventListener("click", function (ev) {
        ev.stopPropagation();
        toggleWatched(movie.id);
      });
      wrap.appendChild(check);

      var titleEl = document.createElement("p");
      titleEl.className = "movie-title";
      titleEl.textContent = title;

      var play = document.createElement("button");
      play.className = "play-btn";
      play.textContent = "▶ " + (isWatched ? t.again : t.watch);
      play.addEventListener("click", function () { requestMovie(movie.id); });

      card.appendChild(wrap);
      card.appendChild(titleEl);
      card.appendChild(play);
      grid.appendChild(card);
    });

    renderProgress();
  }

  /* ---------- HARAKATLAR ---------- */

  function toggleWatched(id) {
    if (watched[id]) { delete watched[id]; } else { watched[id] = true; }
    try { if (tg && tg.HapticFeedback) { tg.HapticFeedback.selectionChanged(); } } catch (e) {}
    saveProgress();
    renderMovies();
  }

  function requestMovie(id) {
    var link = "https://t.me/" + BOT_USERNAME + "?start=" + id + "_" + currentLang;

    watched[id] = true;
    renderMovies();

    saveProgress(function () {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(link);
        tg.close();
      } else {
        window.open(link, "_blank");
      }
    });
  }

  function openCatalog(lang) {
    currentLang = lang;
    $("lang-screen").style.display = "none";
    $("catalog-screen").style.display = "block";

    var t = T[lang];
    $("catalog-title").textContent = t.title;
    $("back-btn").textContent = t.back;
    $("progress-label").textContent = t.label;

    renderMovies();
  }

  function goBack() {
    $("catalog-screen").style.display = "none";
    $("lang-screen").style.display = "flex";
  }

  /* ---------- ISHGA TUSHIRISH ---------- */

  function init() {
    var btns = document.querySelectorAll(".lang-btn");
    for (var i = 0; i < btns.length; i++) {
      (function (btn) {
        btn.addEventListener("click", function () {
          openCatalog(btn.getAttribute("data-lang"));
        });
      })(btns[i]);
    }

    $("back-btn").addEventListener("click", goBack);

    loadProgress(function () {
      if ($("catalog-screen").style.display === "block") { renderMovies(); }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
