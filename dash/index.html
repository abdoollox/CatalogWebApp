  try{ localStorage.setItem(LS, JSON.stringify({src:ST.src, days:ST.days, tz:ST.tz, tab:ST.tab, oraliq:ST.oraliq})); }catch(e){}
}
function loadCfg(){
  try{
    var c = JSON.parse(localStorage.getItem(LS)||"{}");
    if(c.src) ST.src = c.src;
    if(c.days!=null) ST.days = c.days;
    if(c.tz!=null) ST.tz = c.tz;
    if(c.tab) ST.tab = c.tab;
    if(c.oraliq && c.oraliq.from && c.oraliq.to) ST.oraliq = c.oraliq;
  }catch(e){}
}

/* ───────── CSV ───────── */
function parseCSV(text){
  // Qo'shtirnoq ichidagi vergul va qator ko'chishini hurmat qiladi.
  text = text.replace(/^﻿/, "");
  var sep = ",";
  var head = text.slice(0, text.indexOf("\n") < 0 ? text.length : text.indexOf("\n"));
  if(head.split("\t").length > head.split(",").length) sep = "\t";
  var rows=[], cur=[], val="", q=false, i=0;
  for(; i<text.length; i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += ch;
    } else if(ch === '"'){ q = true; }
    else if(ch === sep){ cur.push(val); val=""; }
    else if(ch === "\n"){ cur.push(val); rows.push(cur); cur=[]; val=""; }
    else if(ch === "\r"){ /* skip */ }
    else val += ch;
  }
  if(val !== "" || cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ""; }); });
}

var MONTHS_SHEET = null;
function parseTime(s){
  s = String(s||"").trim();
  if(!s) return null;
  var m;
  // 2026-09-21 18:26:00  /  2026-09-21T18:26:00
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/)))
    return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
  // 21.09.2026 18:26  /  21/09/2026
  if((m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?/))){
    var a=+m[1], b=+m[2];
    // AQSh formati (oy/kun) — birinchi son 12 dan katta bo'lmasa noaniq; Sheets ko'pincha M/D/YYYY beradi
    if(s.indexOf("/") > -1 && a <= 12 && b > 12) return new Date(+m[3], a-1, b, +m[4], +m[5], +(m[6]||0));
    return new Date(+m[3], b-1, a, +m[4], +m[5], +(m[6]||0));
  }
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2]-1, +m[3]);
  // Sheets seriya raqami (1899-12-30 dan boshlab kunlar)
  if(/^\d{5}(\.\d+)?$/.test(s)){
    var ms = (parseFloat(s) - 25569) * 86400000;
    return new Date(ms + new Date().getTimezoneOffset()*60000);
  }
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function looksLikeHeader(r){
  var j = r.join(" ").toLowerCase();
  return /user|id|payload|time|sana|vaqt|nick|ism|kino/.test(j) && !parseTime(r[4]);
}

/* Ustunlar joyi. Jadvalga qo'shimcha ustun qo'shilgan bo'lsa ham topamiz;
   "Tashkent" deb belgilangan vaqt ustuni bo'lsa — o'shani afzal ko'ramiz. */
function mapCols(header){
  var ix = {uid:0, name:1, user:2, payload:3, time:4, local:false};
  if(!header) return ix;
  var h = header.map(function(x){ return String(x||"").toLowerCase().trim(); });
  function find(re){
    for(var i=0; i<h.length; i++) if(re.test(h[i])) return i;
    return -1;
  }
  var v;
  if((v = find(/user\s*id|^id$|foydalanuvchi/)) >= 0) ix.uid = v;
  if((v = find(/nick|ism|\bname\b/)) >= 0) ix.name = v;
  if((v = find(/user\s*name|login/)) >= 0 && v !== ix.uid) ix.user = v;
  if((v = find(/payload|kino|film|harakat|action|event/)) >= 0) ix.payload = v;
  var tk = find(/tashkent|toshkent|mahalliy|local/);
  if(tk >= 0){ ix.time = tk; ix.local = true; }
  else if((v = find(/vaqt|time|sana|date/)) >= 0) ix.time = v;
  return ix;
}

/* ───────── Hodisani tushunish ───────── */
function classify(p){
  p = String(p||"").trim();
  var m;
  if(p === "start")        return {t:"start", lab:"Botni ochdi", ic:"✨"};
  if(p === "subscribed")   return {t:"sub",   lab:"Kanalga qo'shildi", ic:"📜"};
  if(p === "left")         return {t:"left",  lab:"Kanalni tark etdi", ic:"🚪"};
  if(p === "blocked")      return {t:"blocked",lab:"Botni blokladi", ic:"⛔"};
  // Yozuv TAKLIF QILINGAN odamda turadi: u kanalga qo'shildi, taklifchiga ball berildi
  if(p === "ref_awarded")  return {t:"refwin",lab:"Kanalga qo'shildi — taklifchiga ball", ic:"🎁"};
  if(p === "sort_start")   return {t:"sortst",lab:"Saralanishni boshladi", ic:"🎩"};
  if((m = p.match(/^house_([a-z]+)$/)))   return {t:"house", house:m[1], lab:"Fakultetga tushdi", ic:"🎩"};
  if((m = p.match(/^wand_/)))             return {t:"wand",  lab:"Asosini tanladi", ic:"🪄"};
  if((m = p.match(/^src_(.+)$/)))         return {t:"src",   src:m[1], lab:"Reklamadan keldi", ic:"📣"};
  if((m = p.match(/^invited_(\d+)$/)))    return {t:"invited", by:m[1], lab:"Do'st taklifi bilan keldi", ic:"🤝"};
  if((m = p.match(/^share_(.+)$/)))       return {t:"share", lab:"Ulashdi", ic:"🔗"};
  if((m = p.match(/^bekor_(\w+)$/)))      return {t:"undo",  film:m[1], lab:"Bekor qildi", ic:"↩️"};
  if((m = p.match(/^(web|bot)_([a-z]{2}\d+)_(uz|ru|en)$/)))
    return {t:"film", origin:m[1], film:m[2], lang:m[3], lab:"Filmni oldi", ic:"🎬"};
  if((m = p.match(/^([a-z]{2}\d+)_(uz|ru|en)$/)))
    return {t:"film", origin:"?", film:m[1], lang:m[2], lab:"Filmni oldi", ic:"🎬"};
  return {t:"other", lab:p || "—", ic:"•"};
}

function filmName(k){ return (FILMS[k] && FILMS[k].n) || k; }

/* Izoh qoldirgan odamning ismi loglardan topiladi: sabablar bazasida faqat
   raqami bor, ismi esa har bir log yozuvida turadi. */
function personOf(uid){
  if(!uid) return null;
  if(!ST.people){
    ST.people = {};
    for(var i=0; i<ST.rows.length; i++){
      var r = ST.rows[i];
      if(r.uid) ST.people[r.uid] = {name:r.name, user:r.user};
    }
  }
  return ST.people[uid] || null;
}

/* ───────── Ma'lumotni tayyorlash ───────── */
function buildRows(raw){
  var out = [], ix = {uid:0, name:1, user:2, payload:3, time:4, local:false}, start = 0;
  if(raw.length && looksLikeHeader(raw[0])){ ix = mapCols(raw[0]); start = 1; }
  ST.cols = ix;
  for(var i=start; i<raw.length; i++){
    var r = raw[i];
    if(r.length < 4) continue;
    var ts = parseTime(r[ix.time]);
    if(!ts){ // ustun bo'sh yoki siljigan — qolganlaridan izlaymiz
      for(var j=r.length-1; j>=0 && !ts; j--) ts = parseTime(r[j]);
      if(!ts) continue;
    }
    if(ST.tz) ts = new Date(ts.getTime() + ST.tz*3600000);
    out.push({
      uid: String(r[ix.uid]||"").trim(),
      name: String(r[ix.name]||"").trim() || "Nomsiz",
      user: String(r[ix.user]||"").trim(),
      payload: String(r[ix.payload]||"").trim(),
      t: ts, ev: classify(r[ix.payload])
    });
  }
  out.sort(function(a,b){ return a.t - b.t; });
  return out;
}

function dayKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDay(k){
  var p = k.split("-");
  return (+p[2]) + " " + ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"][+p[1]-1];
}
function fmtNum(n){
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
function fmtTime(d){
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* Davr chegaralari */
function kunOqi(matn){
  // "2026-09-21" -> Date (mahalliy yarim tun). new Date("...") UTC deb o'qiydi
  // va mintaqa farqi sababli kun surilib ketadi.
  var m = String(matn || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function kunYoz(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
         "-" + String(d.getDate()).padStart(2,"0");
}

function windowOf(days){
  if(!ST.rows.length) return {from:new Date(0), to:new Date()};

  if(ST.oraliq){
    var a = kunOqi(ST.oraliq.from), b = kunOqi(ST.oraliq.to);
    if(a && b){
      if(a > b){ var v = a; a = b; b = v; }
      return {from: a, to: new Date(b.getFullYear(), b.getMonth(), b.getDate(), 23, 59, 59),
              kunlar: Math.round((b - a)/86400000) + 1};
    }
  }

  var last = ST.rows[ST.rows.length-1].t;
  var to = new Date(last.getFullYear(), last.getMonth(), last.getDate(), 23, 59, 59);
  if(!days) return {from: ST.rows[0].t, to: to, all:true};
  var from = new Date(to.getFullYear(), to.getMonth(), to.getDate() - (days-1));
  return {from: from, to: to, kunlar: days};
}

function slice(days){
  var w = windowOf(days);
  return ST.rows.filter(function(r){ return r.t >= w.from && r.t <= w.to; });
}

/* ───────── Hisob-kitob ───────── */
function firstSeen(){
  // Har bir foydalanuvchining eng birinchi yozuvi — "yangi" ni shundan sanaymiz.
  var f = {};
  for(var i=0; i<ST.rows.length; i++){
    var r = ST.rows[i];
    if(f[r.uid] === undefined) f[r.uid] = r.t;
  }
  return f;
}

function stats(rows, first, w){
  var s = {
    events: rows.length, users:{}, newUsers:0, films:0, filmBy:{}, langs:{uz:0,ru:0,en:0},
    hours:new Array(24).fill(0), days:{}, sub:0, left:0, blocked:0, starts:0,
    heat:(function(){
      var a = [];
      for(var k=0; k<7; k++){ var q = []; for(var h=0; h<24; h++) q.push(0); a.push(q); }
      return a;
    })(),
    soat:(function(){
      var a = [];
      for(var i=0; i<24; i++) a.push({h:i, ev:0, u:{}, movie:0, start:0, sub:0, left:0, blocked:0});
      return a;
    })(),
    houses:{}, srcs:{}, invited:0, refwin:0, shares:0, undo:0, sortStart:0, origin:{web:0,bot:0,"?":0},
    perUser:{}, byFilmLang:{}, seriya:{hp:0, fb:0},
    set:{start:{}, sub:{}, film:{}, sortst:{}, house:{}, "new":{}}
  };
  for(var i=0; i<rows.length; i++){
    var r = rows[i], e = r.ev;
    s.users[r.uid] = 1;
    // Odam bo'yicha sanaymiz, yozuv bo'yicha emas: kimdir botni ochgan zahoti
    // kanalga qo'shilsa, ikkala yozuv ham AYNAN bir xil soniyada tushadi va
    // u ikki marta "yangi" bo'lib ko'rinardi.
    if(first[r.uid] && first[r.uid] >= w.from && first[r.uid] <= w.to)
      s.set["new"][r.uid] = 1;
    var sh = r.t.getHours();
    s.heat[(r.t.getDay() + 6) % 7][sh]++;   // 0 = dushanba
    s.hours[sh]++;
    s.soat[sh].ev++;
    s.soat[sh].u[r.uid] = 1;
    if(e.t === "film") s.soat[sh].movie++;
    else if(s.soat[sh][e.t] !== undefined) s.soat[sh][e.t]++;
    var dk = dayKey(r.t);
    if(!s.days[dk]) s.days[dk] = {ev:0, u:{}, movie:0, start:0, sub:0, left:0, blocked:0};
    s.days[dk].ev++; s.days[dk].u[r.uid] = 1;
    if(s.days[dk][e.t] !== undefined && e.t !== "film") s.days[dk][e.t]++;
    if(!s.perUser[r.uid]) s.perUser[r.uid] = {name:r.name, user:r.user, uid:r.uid, ev:0, films:0, last:r.t, house:null, kunlar:{}};
    var pu = s.perUser[r.uid];
    pu.ev++; pu.last = r.t; pu.name = r.name || pu.name; pu.user = r.user || pu.user;
    pu.kunlar[dk] = 1;

    if(s.set[e.t]) s.set[e.t][r.uid] = 1;

    switch(e.t){
      case "film":
        s.films++; s.days[dk].movie++; pu.films++;
        s.filmBy[e.film] = (s.filmBy[e.film]||0) + 1;
        if(s.langs[e.lang] !== undefined) s.langs[e.lang]++;
        s.origin[e.origin] = (s.origin[e.origin]||0) + 1;
        var kk = e.film + "|" + e.lang;
        s.byFilmLang[kk] = (s.byFilmLang[kk]||0) + 1;
        var tur = FILMS[e.film] && FILMS[e.film].kind;
        if(tur && s.seriya[tur] !== undefined) s.seriya[tur]++;
        break;
      case "start":   s.starts++; break;
      case "sub":     s.sub++; break;
      case "left":    s.left++; break;
      case "blocked": s.blocked++; break;
      case "house":   pu.house = e.house; break;
      case "src":     s.srcs[e.src] = (s.srcs[e.src]||0)+1; break;
      case "invited": s.invited++; break;
      case "refwin":  s.refwin++; break;
      case "share":   s.shares++; break;
      case "undo":    s.undo++; break;
      case "sortst":  s.sortStart++; break;
    }
  }
  // Fakultet — ODAM bo'yicha, oxirgi tanlovi bilan. Ilgari har saralanish
  // alohida sanalardi: fakultetini almashtirgan odam ikki-uch marta, ikki
  // fakultetda birdaniga ko'rinardi (207 odam o'rniga ~370).
  for(var hu in s.set.house){
    var hh = s.perUser[hu] && s.perUser[hu].house;
    if(hh) s.houses[hh] = (s.houses[hh]||0) + 1;
  }
  for(var k in s.days) s.days[k].uq = Object.keys(s.days[k].u).length;
  s.soat.forEach(function(x){ x.uq = Object.keys(x.u).length; });
  s.uniq = Object.keys(s.users).length;
  s.who = {};
  for(var t in s.set) s.who[t] = Object.keys(s.set[t]).length;
  s.newUsers = s.who["new"];
  return s;
}

/* ───────── SVG yordamchilari ───────── */
function el(tag, attrs, txt){
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(txt != null) e.textContent = txt;
  return e;
}
/* O'q chegarasi: to'rt teng bo'lakka BUTUN son bilan bo'linadigan "yumaloq"
   qiymat (6-12-18-24, 25-50-75-100). Ilgari 25 ga yaxlitlanib, belgilar
   6-13-19 bo'lib chiqardi. */
function niceMax(v){
  var q = Math.max(v, 1) / 4;
  for(var p = 1; p < 1e12; p *= 10){
    var m = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 7.5, 8];
    for(var i=0; i<m.length; i++){
      var qadam = m[i] * p;
      if(qadam % 1 === 0 && qadam >= q) return qadam * 4;
    }
  }
  return v;
}

var TIP = null;
function tipShow(x, y, html){
  if(!TIP){ TIP = document.createElement("div"); TIP.className = "tipbox"; document.body.appendChild(TIP); }
  TIP.innerHTML = html;
  TIP.hidden = false;
  var w = TIP.offsetWidth, h = TIP.offsetHeight;
  var L = Math.min(Math.max(8, x - w/2), window.innerWidth - w - 8);
  var T = y - h - 12; if(T < 8) T = y + 18;
  TIP.style.left = L + "px"; TIP.style.top = T + "px";
}
function tipHide(){ if(TIP) TIP.hidden = true; }

/* ───────── 1. Kunlik faollik ───────── */
/* Chizma BIR MARTA quriladi. Ko'rsatkich qo'shilganda yoki olib tashlanganda
   hammasi qaytadan chizilmaydi: o'zgargani ochiladi yoki so'nadi, qolganlari
   esa yangi masshtabga silliq ko'chadi. */
function chartDaily(dayList, holat, balandlik, seriyalar){
  var SER = seriyalar || KUNLIK;
  var W = 960, H = balandlik || 200, P = {t:15, r:26, b:24, l:46};
  var n = dayList.length;
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var X = function(i){ return n <= 1 ? P.l + iw/2 : P.l + i*iw/(n-1); };
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img"});

  var gridLar = [], yYozuv = [];
  for(var g=0; g<=4; g++){
    var y = P.t + ih - (ih*g/4);
    svg.appendChild(el("line", {x1:P.l, x2:W-P.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}));
    var yz = el("text", {x:P.l-7, y:y+3.5, "text-anchor":"end", class:"tick num"}, "0");
    yYozuv.push(yz); svg.appendChild(yz);
  }

  var defs = el("defs", {});
  svg.appendChild(defs);

  var chiziq = {};
  SER.forEach(function(x, idx){
    var gid = "fill_" + x.k;
    var lg = el("linearGradient", {id:gid, x1:"0", y1:"0", x2:"0", y2:"1"});
    lg.appendChild(el("stop", {offset:"0", "stop-color":x.c, "stop-opacity":".26"}));
    lg.appendChild(el("stop", {offset:"1", "stop-color":x.c, "stop-opacity":"0"}));
    defs.appendChild(lg);

    var grup = el("g", {});
    var maydon = el("path", {fill:"url(#"+gid+")", stroke:"none"});
    maydon.style.opacity = "0";
    maydon.style.transition = "opacity .35s ease";
    var yol = el("path", {fill:"none", stroke:x.c, "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"});
    if(x.dash) yol.setAttribute("stroke-dasharray", "5 4");
    var uchi = el("circle", {r:3.5, fill:x.c, stroke:"var(--panel)", "stroke-width":2});
    grup.appendChild(maydon); grup.appendChild(yol); grup.appendChild(uchi);
    grup.style.opacity = "0";
    grup.style.transition = "opacity .35s ease";
    grup.style.pointerEvents = "none";
    svg.appendChild(grup);
    chiziq[x.k] = {g:grup, yol:yol, uchi:uchi, maydon:maydon, ser:x, idx:idx, bor:false};
  });

  // Soatlik ko'rinishda yorliqlar allaqachon tanlab qo'yilgan (har uchinchisi),
  // kunlik ko'rinishda oltitagacha yorliq qoldiramiz.
  var step = (n === 24) ? 1 : Math.max(1, Math.ceil(n/6));
  for(var i=0; i<n; i += step){
    var matn = dayList[i].lab !== undefined ? dayList[i].lab : fmtDay(dayList[i].k);
    if(matn) svg.appendChild(el("text", {x:X(i), y:H-8, "text-anchor":"middle", class:"tick"}, matn));
  }

  var bosh = el("text", {x:W/2, y:H/2, "text-anchor":"middle", class:"slab", fill:"var(--ink-3)"},
    "Ko'rsatkichni tanlang");
  bosh.style.opacity = "0";
  bosh.style.transition = "opacity .3s ease";
  svg.appendChild(bosh);

  var vline = el("line", {y1:P.t, y2:P.t+ih, class:"hovline"}); vline.style.opacity = 0;
  svg.appendChild(vline);
  var nuqtalar = {};
  SER.forEach(function(x){
    var c = el("circle", {r:4.5, fill:x.c, stroke:"var(--panel)", "stroke-width":2});
    c.style.opacity = 0; svg.appendChild(c); nuqtalar[x.k] = c;
  });
  var hit = el("rect", {x:0, y:0, width:W, height:H, fill:"transparent"});
  svg.appendChild(hit);

  var I = {W:W, H:H, P:P, n:n, iw:iw, ih:ih, X:X, chiziq:chiziq, yYozuv:yYozuv,
           dayList:dayList, ser:SER, maxV:0, holat:holat, bosh:bosh, vline:vline, nuqtalar:nuqtalar};
  svg._i = I;

  function move(ev){
    var faol = SER.filter(function(x){ return I.holat[x.k]; });
    if(!faol.length) return;
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * W;
    var i = n <= 1 ? 0 : Math.round((px - P.l) / (iw/(n-1)));
    i = Math.max(0, Math.min(n-1, i));
    var d = dayList[i], engY = H;
    vline.setAttribute("x1", X(i)); vline.setAttribute("x2", X(i)); vline.style.opacity = 1;
    var qator = "";
    SER.forEach(function(x){
      var c = nuqtalar[x.k];
      if(!I.holat[x.k]){ c.style.opacity = 0; return; }
      var y = P.t + ih - (d[x.k]/I.maxV)*ih;
      if(y < engY) engY = y;
      c.setAttribute("cx", X(i)); c.setAttribute("cy", y); c.style.opacity = 1;
      qator += '<div class="tr"><span><span class="swatch" style="display:inline-block;background:' +
        x.c + '"></span> ' + esc(x.n) + '</span><b>' + fmtNum(d[x.k]) + '</b></div>';
    });
    tipShow(ev.clientX, r.top + (engY/H)*r.height,
      '<div class="tt">' + esc(d.tip || fmtDay(d.k)) + '</div>' + qator);
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchmove", function(e){ if(e.touches[0]) move(e.touches[0]); });
  hit.addEventListener("mouseleave", function(){
    vline.style.opacity = 0;
    SER.forEach(function(x){ nuqtalar[x.k].style.opacity = 0; });
    tipHide();
  });

  chartYangila(svg, holat, true);
  return svg;
}

/* Masshtab o'zgarishi bitta son - maxV. Har kadrda uni oraliq qiymatga
   qo'yib chiziqlarni qayta hisoblaymiz: shunda qolgan chiziqlar sakramay,
   silliq ko'chadi va Y o'qidagi raqamlar ham ular bilan birga o'zgaradi. */
function chartYangila(svg, holat, ilk){
  var I = svg._i;
  var SER = I.ser;
  I.holat = holat;
  var faol = SER.filter(function(x){ return holat[x.k]; });
  var eng = 1;
  I.dayList.forEach(function(d){
    faol.forEach(function(x){ if(d[x.k] > eng) eng = d[x.k]; });
  });
  var yangiMax = niceMax(eng);
  var eskiMax = I.maxV || yangiMax;
  I.maxV = yangiMax;
  I.bosh.style.opacity = faol.length ? "0" : "1";

  var yolgiz = faol.length === 1;

  // Ilk chizilish izlari (dasharray) masshtab o'zgarganda chiziqni kesib
  // qo'yadi — chiziq uzunligi boshqacha bo'lib qoladi. Shuning uchun
  // birinchi o'zgarishdayoq tozalab tashlaymiz.
  if(!ilk){
    SER.forEach(function(x){
      if(x.dash) return;
      var y = I.chiziq[x.k].yol;
      y.style.transition = "";
      y.style.strokeDasharray = "";
      y.style.strokeDashoffset = "";
    });
  }

  function chizMax(m){
    SER.forEach(function(x){
      var c = I.chiziq[x.k];
      if(!holat[x.k] && !c.bor) return;        // ko'rinmaydi va ko'rinmagan ham
      var d = "";
      for(var i=0; i<I.n; i++){
        var y = I.P.t + I.ih - (I.dayList[i][x.k]/m)*I.ih;
        d += (i ? "L" : "M") + I.X(i).toFixed(1) + " " + y.toFixed(1) + " ";
      }
      c.yol.setAttribute("d", d);
      c.maydon.setAttribute("d", d + "L" + I.X(I.n-1).toFixed(1) + " " + (I.P.t+I.ih) +
                                 " L" + I.X(0).toFixed(1) + " " + (I.P.t+I.ih) + " Z");
      if(I.n){
        c.uchi.setAttribute("cx", I.X(I.n-1));
        c.uchi.setAttribute("cy", I.P.t + I.ih - (I.dayList[I.n-1][x.k]/m)*I.ih);
      }
    });
    for(var g=0; g<=4; g++) I.yYozuv[g].textContent = fmtNum(m*g/4);
  }

  // Ko'rinish: faqat O'ZGARGANI harakatlanadi
  SER.forEach(function(x){
    var c = I.chiziq[x.k];
    var kerak = !!holat[x.k];
    if(kerak !== c.bor){
      c.g.style.opacity = kerak ? "1" : "0";
      c.bor = kerak;
    }
    c.maydon.style.opacity = (kerak && yolgiz) ? "1" : "0";
  });

  if(ilk || ST.jim || eskiMax === yangiMax){
    chizMax(yangiMax);
    if(ilk && !ST.jim) ilkChizilish(I, faol);
    return;
  }

  var boshi = null, davom = 420;
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi)/davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    chizMax(eskiMax + (yangiMax - eskiMax)*yumshoq);
    if(p < 1) requestAnimationFrame(qadam);
  }
  requestAnimationFrame(qadam);
}

/* Sahifa ilk ochilganda chiziqlar chapdan o'ngga chiziladi. */
function ilkChizilish(I, faol){
  faol.forEach(function(x, j){
    var c = I.chiziq[x.k];
    if(x.dash) return;                 // punktirda dasharray band
    var uz = 0;
    try{ uz = c.yol.getTotalLength(); }catch(e){}
    if(!uz) return;
    c.yol.style.strokeDasharray = uz;
    c.yol.style.strokeDashoffset = uz;
    c.yol.style.transition = "stroke-dashoffset .75s " + TEZLIK + " " + (j*60) + "ms";
    keyinroq(function(){
      c.yol.style.strokeDashoffset = "0";
      // Chizilib bo'lgach dasharray ni bo'shatamiz: masshtab o'zgarganda
      // chiziq uzunligi ham o'zgaradi va eski dasharray uni kesib qo'yardi.
      setTimeout(function(){
        c.yol.style.transition = "";
        c.yol.style.strokeDasharray = "";
        c.yol.style.strokeDashoffset = "";
      }, 800 + j*60);
    });
  });
}

/* ───────── Fakultetlar ulushi (100% ustma-ust) ─────────
   Har nuqtada tanlangan fakultetlar yig'indisi 100% deb olinadi.
   Hali hech kim saralanmagan boshlang'ich kunlar chizilmaydi —
   aks holda maydon nolga tushib, yolg'on "cho'kish" ko'rinardi. */
function chartUlush(list, ser, holat, balandlik){
  var W = 960, H = balandlik || 200, P = {t:15, r:26, b:24, l:46};
  var n = list.length, iw = W - P.l - P.r, ih = H - P.t - P.b;
  var X = function(i){ return n <= 1 ? P.l + iw/2 : P.l + i*iw/(n-1); };
  var Y = function(p){ return P.t + ih - p/100*ih; };
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img", "aria-label":"Ulushlar"});

  for(var g=0; g<=4; g++){
    var y = Y(g*25);
    svg.appendChild(el("line", {x1:P.l, x2:W-P.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}));
    svg.appendChild(el("text", {x:P.l-7, y:y+3.5, "text-anchor":"end", class:"tick num"}, (g*25) + "%"));
  }

  var faol = ser.filter(function(x){ return holat[x.k]; });
  var ul = list.map(function(d){
    var jami = faol.reduce(function(a, x){ return a + d[x.k]; }, 0), o = {_t:jami};
    faol.forEach(function(x){ o[x.k] = jami ? d[x.k]/jami*100 : 0; });
    return o;
  });
  var s0 = 0;
  while(s0 < n && !ul[s0]._t) s0++;

  var grup = el("g", {});
  if(s0 < n){
    var past = ul.map(function(){ return 0; });
    faol.forEach(function(x){
      var yuq = past.map(function(b, i){ return b + ul[i][x.k]; });
      var d = "";
      for(var i=s0; i<n; i++) d += (i > s0 ? "L" : "M") + X(i).toFixed(1) + " " + Y(yuq[i]).toFixed(1) + " ";
      for(var j=n-1; j>=s0; j--) d += "L" + X(j).toFixed(1) + " " + Y(past[j]).toFixed(1) + " ";
      grup.appendChild(el("path", {d:d + "Z", fill:x.c, "fill-opacity":.82,
        stroke:"var(--panel)", "stroke-width":1, "stroke-linejoin":"round"}));
      past = yuq;
    });
  } else {
    svg.appendChild(el("text", {x:W/2, y:H/2, "text-anchor":"middle", class:"slab", fill:"var(--ink-3)"},
      "Bu davrda hech kim saralanmagan"));
  }
  grup.style.opacity = "0";
  grup.style.transition = "opacity .5s ease";
  svg.appendChild(grup);
  keyinroq(function(){ grup.style.opacity = "1"; });

  var step = (n === 24) ? 1 : Math.max(1, Math.ceil(n/6));
  for(var k=0; k<n; k += step){
    var matn = list[k].lab !== undefined ? list[k].lab : fmtDay(list[k].k);
    if(matn) svg.appendChild(el("text", {x:X(k), y:H-8, "text-anchor":"middle", class:"tick"}, matn));
  }

  var vline = el("line", {y1:P.t, y2:P.t+ih, class:"hovline"}); vline.style.opacity = 0;
  svg.appendChild(vline);
  var hit = el("rect", {x:0, y:0, width:W, height:H, fill:"transparent"});
  svg.appendChild(hit);
  function move(ev){
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * W;
    var i = n <= 1 ? 0 : Math.round((px - P.l) / (iw/(n-1)));
    i = Math.max(0, Math.min(n-1, i));
    vline.setAttribute("x1", X(i)); vline.setAttribute("x2", X(i)); vline.style.opacity = 1;
    var qator = "";
    // Tooltipda yuqoridagi qatlam birinchi turadi — chizmadagi tartib bilan bir xil
    faol.slice().reverse().forEach(function(x){
      qator += '<div class="tr"><span><span class="swatch" style="display:inline-block;background:' +
        x.c + '"></span> ' + esc(x.n) + '</span><b>' + Math.round(ul[i][x.k]) + '% · ' +
        fmtNum(list[i][x.k]) + '</b></div>';
    });
    tipShow(ev.clientX, r.top + r.height*0.2,
      '<div class="tt">' + esc(list[i].tip || fmtDay(list[i].k)) + '</div>' +
      (ul[i]._t ? qator : '<div class="tr"><span>Hali hech kim</span></div>'));
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchmove", function(e){ if(e.touches[0]) move(e.touches[0]); });
  hit.addEventListener("mouseleave", function(){ vline.style.opacity = 0; tipHide(); });
  return svg;
}

/* ───────── Donut: tarkib ─────────
   To'rt-olti bo'lak — doira shu yerda o'rinli. O'rtada jami. Ro'yxatdagi
   qatorni bosib bo'lakni olib turish mumkin: qolganlari 100% ga qayta
   bo'linadi, foizlar ham shunga moslashadi. Tanlov `ls` kaliti bilan
   brauzerda eslab qolinadi. */
function donut(items, ls, birlik){
  var B = birlik || "odam";
  var box = document.createElement("div");
  box.className = "donut";
  var R = 70, C = 2*Math.PI*R;
  var holat = {};
  items.forEach(function(x){ holat[x.k] = true; });
  try{
    var sq = ls && JSON.parse(localStorage.getItem(ls) || "null");
    if(sq) items.forEach(function(x){ if(typeof sq[x.k] === "boolean") holat[x.k] = sq[x.k]; });
  }catch(e){}
  if(!items.some(function(x){ return holat[x.k]; })) items.forEach(function(x){ holat[x.k] = true; });

  function jamiOl(){
    return items.reduce(function(a, x){ return a + (holat[x.k] ? x.val : 0); }, 0);
  }

  var svg = el("svg", {viewBox:"0 0 200 200", role:"img", "aria-label":"Tarkib"});
  svg.appendChild(el("circle", {cx:100, cy:100, r:R, fill:"none", stroke:"var(--panel-2)", "stroke-width":26}));
  var tur = el("g", {transform:"rotate(-90 100 100)"});
  var yozuv = el("text", {x:100, y:104, "text-anchor":"middle", class:"donut-son"}, "0");
  var osti = el("text", {x:100, y:126, "text-anchor":"middle", class:"tick"}, B);
  var bolak = items.map(function(x, i){
    var c = el("circle", {cx:100, cy:100, r:R, fill:"none", stroke:x.hex, "stroke-width":26,
      "stroke-dasharray":"0 " + C, "stroke-dashoffset":0});
    c.style.transition = "stroke-dasharray .6s " + TEZLIK + " " + (i*70) + "ms, " +
      "stroke-dashoffset .6s " + TEZLIK + " " + (i*70) + "ms, stroke-width .15s";
    c.addEventListener("mousemove", function(e){
      if(!holat[x.k]) return;
      var jami = jamiOl();
      c.setAttribute("stroke-width", 30);
      yozuv.textContent = fmtNum(x.val); osti.textContent = x.n;
      tipShow(e.clientX, e.clientY, '<div class="tt">' + esc(x.lab) + '</div>' +
        '<div class="tr"><span>' + B.charAt(0).toUpperCase() + B.slice(1) + '</span><b>' + fmtNum(x.val) + '</b></div>' +
        '<div class="tr"><span>Ulushi</span><b>' + (jami ? x.val/jami*100 : 0).toFixed(1) + '%</b></div>');
    });
    c.addEventListener("mouseleave", function(){
      c.setAttribute("stroke-width", 26);
      yozuv.textContent = fmtNum(jamiOl()); osti.textContent = B;
      tipHide();
    });
    tur.appendChild(c);
    return c;
  });
  svg.appendChild(tur);
  svg.appendChild(yozuv);
  svg.appendChild(osti);
  box.appendChild(svg);

  var ro = document.createElement("div");
  ro.className = "donut-ro";
  var qatorlar = items.map(function(x){
    var q = document.createElement("button");
    q.type = "button";
    q.className = "donut-q";
    q.title = "Bosib olib turing";
    q.innerHTML = '<span class="swatch" style="background:' + x.hex + '"></span>' +
      '<span class="dn">' + esc(x.lab) + '</span>' +
      '<b>' + fmtNum(x.val) + '</b><i></i>';
    q.addEventListener("click", function(){
      var faol = items.filter(function(y){ return holat[y.k]; });
      if(faol.length === 1 && holat[x.k]) return;      // oxirgisini o'chirmaymiz
      holat[x.k] = !holat[x.k];
      try{ if(ls) localStorage.setItem(ls, JSON.stringify(holat)); }catch(e){}
      chiz();
    });
    ro.appendChild(q);
    return q;
  });
  box.appendChild(ro);

  function chiz(){
    var jami = jamiOl(), bosh = 0;
    var faolSoni = items.filter(function(x){ return holat[x.k] && x.val; }).length;
    items.forEach(function(x, i){
      var uz = (holat[x.k] && jami) ? x.val/jami*C : 0;
      var bor = Math.max(0, uz - (faolSoni > 1 && uz ? 2 : 0));   // bo'laklar orasida tirqish
      bolak[i].setAttribute("stroke-dasharray", bor + " " + (C - bor));
      bolak[i].setAttribute("stroke-dashoffset", -bosh);
      bosh += uz;
      var q = qatorlar[i];
      q.classList.toggle("off", !holat[x.k]);
      q.setAttribute("aria-pressed", String(!!holat[x.k]));
      q.querySelector("i").textContent = holat[x.k] && jami
        ? (x.val/jami*100).toFixed(1).replace(/\.0$/, "") + "%" : "—";
    });
    yozuv.textContent = fmtNum(jami);
  }
  keyinroq(chiz);
  return box;
}

/* ───────── Poyga kartasi (fakultetlar, manbalar) ─────────
   Har odam bir marta sanaladi: `kirdi[uid]` — u qo'shilgan nuqta (kun yoki
   soat), `turi[uid]` — qaysi guruhga tegishli. Chizma shu nuqtagacha
   yig'ilgan jami sonni ko'rsatadi; "Ulushi" rejimida esa ularning nisbatini. */
function poygaKarta(o){
  var ser = o.ser, dayList = o.dayList, birKun = o.birKun;
  var nuqta = {};
  if(!o.list) Object.keys(o.kirdi).forEach(function(uid){
    var tr = o.turi[uid];
    if(!tr) return;
    var kk = o.kirdi[uid];
    if(!nuqta[kk]) nuqta[kk] = {};
    nuqta[kk][tr] = (nuqta[kk][tr] || 0) + 1;
  });
  var yig = {};
  ser.forEach(function(x){ yig[x.k] = 0; });
  // Tayyor ro'yxat berilsa (yig'ilmaydigan kunlik qiymatlar) — o'shani chizamiz
  var list = o.list || dayList.map(function(d){
    var q = {k:d.k, lab:d.lab, tip:d.tip};
    ser.forEach(function(x){
      yig[x.k] += (nuqta[d.k] && nuqta[d.k][x.k]) || 0;
      q[x.k] = yig[x.k];
    });
    return q;
  });

  var c = card(o.nom, o.hint || ((birKun ? "soat" : "kun") + " sayin jami · nomini bosib olib turing"), o.kls != null ? o.kls : "twothird");
  var holat = {};
  ser.forEach(function(x){ holat[x.k] = true; });
  var rejim = o.rejim || "ulush";            // odatiy ko'rinish — ulush
  try{
    var sq = JSON.parse(localStorage.getItem(o.ls + "_on") || "null");
    if(sq) ser.forEach(function(x){ if(typeof sq[x.k] === "boolean") holat[x.k] = sq[x.k]; });
    var sm = localStorage.getItem(o.ls + "_mode");
    if(sm === "son" || sm === "ulush") rejim = sm;
  }catch(e){}
  if(o.faqatSon) rejim = "son";              // ulush ma'nosiz bo'lgan chizmalar uchun
  // Saqlangan tanlovda hammasi o'chiq bo'lib qolsa, chizma bo'sh chiqmasin
  if(!ser.some(function(x){ return holat[x.k]; })) ser.forEach(function(x){ holat[x.k] = true; });

  var slayder = list.length > 14;
  if(!slayder) ST[o.oyna] = {a:0, b:1};
  var kor = slayder ? oynaKesimi(list, ST[o.oyna]) : list;
  var fig = document.createElement("figure");
  var balandlik = null, svg = null;
  function chiz(){
    fig.innerHTML = "";
    svg = rejim === "son" ? chartDaily(kor, holat, balandlik, ser)
                          : chartUlush(kor, ser, holat, balandlik);
    fig.appendChild(svg);
  }
  c._qayta = function(b){
    if(b === null) balandlik = null;
    else if(b) balandlik = b;
    chiz();
  };

  var seg = document.createElement("div");
  seg.className = "seg";
  [["ulush", "Ulushi"], ["son", "Soni"]].forEach(function(v){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = v[1];
    b.setAttribute("aria-pressed", String(rejim === v[0]));
    b.addEventListener("click", function(){
      if(rejim === v[0]) return;
      rejim = v[0];
      try{ localStorage.setItem(o.ls + "_mode", rejim); }catch(e){}
      [].forEach.call(seg.children, function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      chiz();
    });
    seg.appendChild(b);
  });
  if(!o.faqatSon) c._head.insertBefore(seg, c._head.firstChild);

  var brush = null, yozuv = null;
  function qiymat(d){
    var v = 0;
    ser.forEach(function(x){ if(holat[x.k]) v += d[x.k]; });
    return v;
  }
  c.appendChild(toggleLegend(ser, holat, "k", function(){
    try{ localStorage.setItem(o.ls + "_on", JSON.stringify(holat)); }catch(e){}
    if(rejim === "son") chartYangila(svg, holat);   // faqat o'zgargani harakatlanadi
    else chiz();
    if(brush) brush.replaceWith(brush = brushYasa(list, qiymat, ST[o.oyna], oynaOzgardi));
  }));
  chiz();
  c.appendChild(fig);
  c._kuzat(fig);

  function oynaOzgardi(){
    kor = oynaKesimi(list, ST[o.oyna]);
    ST.jim = true; c._qayta(); ST.jim = false;
    if(yozuv) yozuvYangila();
  }
  function yozuvYangila(){
    var a = kor[0], b = kor[kor.length-1];
    yozuv.innerHTML = "<b>" + esc(a.tip || fmtDay(a.k)) + "</b>" +
      "<span>" + kor.length + (birKun ? " soat" : " kun") + "</span>" +
      "<b>" + esc(b.tip || fmtDay(b.k)) + "</b>";
  }
  if(slayder){
    brush = brushYasa(list, qiymat, ST[o.oyna], oynaOzgardi);
    c.appendChild(brush);
    yozuv = document.createElement("div");
    yozuv.className = "brush-yozuv";
    c.appendChild(yozuv);
    yozuvYangila();
  }
  addTable(c, [birKun ? "Soat" : "Kun"].concat(ser.map(function(x){ return x.t || x.n; })),
    list.slice().reverse().map(function(d){
      return [birKun ? (d.k + ":00") : fmtDay(d.k)].concat(ser.map(function(x){ return d[x.k]; }));
    }));
  return c;
}

/* ───────── Diapazon slayderi ───────── */
function brushYasa(toliq, qiymatOl, oyna, ozgardi){
  var box = document.createElement("div");
  box.className = "brush";
  var W = 960, H = 46, n = toliq.length;

  // Mini chizma: faol ko'rsatkichlarning yig'indisi — shakl ko'rinsa yetarli
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, preserveAspectRatio:"none"});
  var eng = 1, qiy = [];
  for(var i=0; i<n; i++){
    var v = qiymatOl(toliq[i]);
    qiy.push(v); if(v > eng) eng = v;
  }
  var d = "", X = function(i){ return n <= 1 ? W/2 : i*W/(n-1); };
  for(var j=0; j<n; j++) d += (j ? "L" : "M") + X(j).toFixed(1) + " " + (H - 4 - (qiy[j]/eng)*(H-9)).toFixed(1) + " ";
  svg.appendChild(el("path", {d:d + "L" + W + " " + H + " L0 " + H + " Z", fill:"rgba(255,255,255,.10)"}));
  svg.appendChild(el("path", {d:d, fill:"none", stroke:"rgba(235,233,228,.72)", "stroke-width":1.4,
    "vector-effect":"non-scaling-stroke"}));
  box.appendChild(svg);

  var chapSoya = document.createElement("div"); chapSoya.className = "soya";
  var ongSoya = document.createElement("div"); ongSoya.className = "soya";
  var tanlov = document.createElement("div"); tanlov.className = "tanlov";
  var tChap = document.createElement("div"); tChap.className = "tut chap";
  var tOng = document.createElement("div"); tOng.className = "tut ong";
  tanlov.appendChild(tChap); tanlov.appendChild(tOng);
  box.appendChild(chapSoya); box.appendChild(ongSoya); box.appendChild(tanlov);

  var eniKam = Math.max(2/n, 0.04);          // eng tor oyna
  function chiz(){
    var a = oyna.a, b = oyna.b;
    tanlov.style.left = (a*100) + "%";
    tanlov.style.width = ((b-a)*100) + "%";
    chapSoya.style.left = "0"; chapSoya.style.width = (a*100) + "%";
    ongSoya.style.left = (b*100) + "%"; ongSoya.style.right = "0"; ongSoya.style.width = "auto";
  }
  box._chiz = chiz;
  chiz();

  var sudrash = null;
  function nisbat(e){
    var r = box.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, Math.min(1, x / r.width));
  }
  function bosh(turi){
    return function(e){
      e.preventDefault();
      sudrash = {turi:turi, boshi:nisbat(e), a:oyna.a, b:oyna.b};
      document.addEventListener("pointermove", yur);
      document.addEventListener("pointerup", tugat);
    };
  }
  function yur(e){
    if(!sudrash) return;
    var p = nisbat(e), farq = p - sudrash.boshi;
    var a = oyna.a, b = oyna.b;
    if(sudrash.turi === "chap")      a = Math.min(sudrash.a + farq, sudrash.b - eniKam);
    else if(sudrash.turi === "ong")  b = Math.max(sudrash.b + farq, sudrash.a + eniKam);
    else {
      var en = sudrash.b - sudrash.a;
      a = Math.max(0, Math.min(1 - en, sudrash.a + farq));
      b = a + en;
    }
    oyna.a = Math.max(0, a); oyna.b = Math.min(1, b);
    chiz();
    ozgardi(true);
  }
  function tugat(){
    sudrash = null;
    document.removeEventListener("pointermove", yur);
    document.removeEventListener("pointerup", tugat);
    ozgardi(false);
  }
  tChap.addEventListener("pointerdown", bosh("chap"));
  tOng.addEventListener("pointerdown", bosh("ong"));
  tanlov.addEventListener("pointerdown", function(e){
    if(e.target === tChap || e.target === tOng) return;
    bosh("surish")(e);
  });
  return box;
}

/* Tanlangan oynaga to'g'ri keladigan bo'lak */
function oynaKesimi(toliq, oyna){
  var n = toliq.length;
  var i = Math.floor(oyna.a * n);
  var j = Math.ceil(oyna.b * n);
  if(j - i < 2){ j = Math.min(n, i + 2); i = Math.max(0, j - 2); }
  return toliq.slice(i, j);
}

/* ───────── 2. Filmlar reytingi (tillar bo'yicha yig'ma) ───────── */
/* Bu chizma ham bir marta quriladi. Til olib tashlanganda filmlar o'rin
   almashmaydi — faqat tegishli bo'lak siqiladi va bar qisqaradi. Tartib
   sakrab tursa, ko'z qaysi qator qayerga ketganini yo'qotadi. */
function chartFilms(s, tillar){
  var jami0 = {};
  Object.keys(s.filmBy).forEach(function(k){ jami0[k] = s.filmBy[k]; });
  var keys = Object.keys(FILMS).filter(function(k){ return jami0[k]; })
    .sort(function(a,b){ return jami0[b] - jami0[a]; });
  Object.keys(jami0).forEach(function(k){ if(!FILMS[k] && keys.indexOf(k) < 0) keys.push(k); });
  if(!keys.length) return null;

  var rowH = 27, gap = 7, P = {t:6, r:52, b:20, l:148};
  var W = 960, H = P.t + keys.length*(rowH+gap) + P.b;
  var iw = W - P.l - P.r;
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img", "aria-label":"Filmlar bo'yicha yuborishlar"});
  var cols = TIL_RANG;

  var gridChiz = [], xYozuv = [];
  for(var g=0; g<=4; g++){
    var x = P.l + iw*g/4;
    svg.appendChild(el("line", {x1:x, x2:x, y1:P.t, y2:H-P.b+2, stroke:"var(--grid)", "stroke-width":1}));
    var yz = el("text", {x:x, y:H-6, "text-anchor":"middle", class:"tick num"}, "0");
    xYozuv.push(yz); svg.appendChild(yz);
  }

  var qatorlar = {};
  keys.forEach(function(k, i){
    var y = P.t + i*(rowH+gap);
    svg.appendChild(el("text", {x:P.l-10, y:y+rowH/2+4, "text-anchor":"end", class:"slab"},
      (FILMS[k] ? FILMS[k].num + ". " : "") + filmName(k)));
    var seg = {};
    ["uz","ru","en"].forEach(function(lg){
      var v = s.byFilmLang[k+"|"+lg] || 0;
      var r = el("rect", {x:P.l, y:y, width:0, height:rowH, fill:cols[lg], rx:0, ry:0});
      r.style.transformBox = "fill-box";
      r.style.transformOrigin = "left center";
      r.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY,
          '<div class="tt">' + filmName(k) + '</div>' +
          '<div class="tr"><span>' + LANGS[lg].f + " " + LANGS[lg].n + '</span><b>' + fmtNum(v) + '</b></div>');
      });
      r.addEventListener("mouseleave", tipHide);
      svg.appendChild(r);
      seg[lg] = {rect:r, val:v};
    });
    var son = el("text", {x:P.l, y:y+rowH/2+4, class:"vlab"}, "0");
    svg.appendChild(son);
    qatorlar[k] = {seg:seg, son:son, y:y};
  });

  svg._i = {keys:keys, qatorlar:qatorlar, P:P, iw:iw, xYozuv:xYozuv, maxV:0, tillar:tillar};
  filmYangila(svg, tillar, true);
  return svg;
}

function filmYangila(svg, tillar, ilk){
  var I = svg._i;
  I.tillar = tillar;
  var faol = ["uz","ru","en"].filter(function(l){ return tillar[l]; });
  var jami = {}, eng = 1;
  I.keys.forEach(function(k){
    jami[k] = faol.reduce(function(a, l){ return a + I.qatorlar[k].seg[l].val; }, 0);
    if(jami[k] > eng) eng = jami[k];
  });
  var yangiMax = niceMax(eng);
  var eskiMax = I.maxV || yangiMax;
  I.maxV = yangiMax;

  function chiz(m, ulush){
    I.keys.forEach(function(k){
      var q = I.qatorlar[k], off = 0;
      ["uz","ru","en"].forEach(function(lg){
        var sg = q.seg[lg];
        var korinadi = tillar[lg] && sg.val > 0;
        var w = korinadi ? (sg.val/m)*I.iw : 0;
        sg.rect.setAttribute("x", I.P.l + (off/m)*I.iw);
        sg.rect.setAttribute("width", Math.max(0, w - (w > 3 ? 2 : 0)));
        sg.rect.style.transform = "scaleX(" + (korinadi ? ulush : 0) + ")";
        // Har bo'lak bir xil yumaloq — ilgari faqat oxirgisi yumaloq edi va
        // bar bir uchi qirrali, bir uchi yumaloq ko'rinardi. Ingichka bo'lakda
        // radius kenglikning yarmidan oshmaydi.
        var rad = Math.min(4, Math.max(0, w - 2) / 2);
        sg.rect.setAttribute("rx", rad);
        sg.rect.setAttribute("ry", rad);
        if(korinadi) off += sg.val;
      });
      q.son.setAttribute("x", I.P.l + (jami[k]/m)*I.iw*ulush + 8);
      q.son.textContent = fmtNum(jami[k]);
      q.son.style.opacity = jami[k] ? "1" : "0";
    });
    for(var g=0; g<=4; g++) I.xYozuv[g].textContent = fmtNum(m*g/4);
  }

  if(ilk){
    chiz(yangiMax, 0);
    if(ST.jim){ chiz(yangiMax, 1); return; }
    I.keys.forEach(function(k, i){
      var q = I.qatorlar[k];
      ["uz","ru","en"].forEach(function(lg){
        q.seg[lg].rect.style.transition = "transform .5s " + TEZLIK + " " + (i*22) + "ms";
      });
      q.son.style.opacity = "0";
      q.son.style.transition = "opacity .4s ease " + (i*22 + 240) + "ms";
    });
    keyinroq(function(){ chiz(yangiMax, 1); });
    return;
  }

  // Til qo'shildi yoki olib tashlandi: bo'laklar joyida o'zgaradi
  I.keys.forEach(function(k){
    var q = I.qatorlar[k];
    ["uz","ru","en"].forEach(function(lg){ q.seg[lg].rect.style.transition = "transform .3s " + TEZLIK; });
  });
  if(ST.jim || eskiMax === yangiMax){ chiz(yangiMax, 1); return; }

  var boshi = null, davom = 420;
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi)/davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    chiz(eskiMax + (yangiMax - eskiMax)*yumshoq, 1);
    if(p < 1) requestAnimationFrame(qadam);
  }
  requestAnimationFrame(qadam);
}

/* ───────── 3a. Hafta kuni x soat (heatmap) ─────────
   Bitta chizmada ikki o'lcham: qaysi KUN va qaysi SOAT jonli. Rang
   to'qligi faollikni bildiradi — bitta tusning yorqinligi bo'yicha,
   shunda "ko'proq" degani bir qarashda o'qiladi. */
var HAFTA = ["Dush", "Sesh", "Chor", "Pay", "Jum", "Shan", "Yak"];

/* Issiqlik shkalasi: sovuqdan issiqqa. Bu chizmada rang bitta narsani —
   faollik darajasini bildiradi, shuning uchun tus bo'ylab o'tish o'rinli:
   ko'k (jim) -> yashil -> sariq -> qizil (eng gavjum). */
var ISSIQ = [
  [0.00, [38, 72, 140]],
  [0.25, [57, 135, 229]],
  [0.50, [25, 158, 112]],
  [0.75, [232, 185, 60]],
  [1.00, [208, 59, 59]]
];
function issiqRang(t){
  t = Math.max(0, Math.min(1, t));
  for(var i = 1; i < ISSIQ.length; i++){
    if(t <= ISSIQ[i][0]){
      var a = ISSIQ[i-1], b = ISSIQ[i];
      var u = (t - a[0]) / (b[0] - a[0] || 1);
      return "rgb(" +
        Math.round(a[1][0] + (b[1][0] - a[1][0])*u) + "," +
        Math.round(a[1][1] + (b[1][1] - a[1][1])*u) + "," +
        Math.round(a[1][2] + (b[1][2] - a[1][2])*u) + ")";
    }
  }
  return "rgb(208,59,59)";
}

function chartHeat(s, balandlik){
  var W = 960, P = {t:18, r:96, b:52, l:44};
  var cols = 24, rows = 7;
  var iw = W - P.l - P.r;
  var kw = iw / cols;
  var kh = balandlik ? Math.max(14, (balandlik - P.t - P.b) / rows) : 26;
  var H = P.t + rows*kh + 9 + Math.min(kh, 30) + 14;
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img",
    "aria-label":"Hafta kuni va soat bo'yicha faollik"});

  // Chekka yig'indilar: har kun bo'yicha jami va har soat bo'yicha jami
  var kunJami = [], soatJami = [], eng = 1, umumiy = 0;
  for(var k=0; k<rows; k++){
    var q = 0;
    for(var h=0; h<cols; h++){
      var v0 = s.heat[k][h];
      q += v0; umumiy += v0;
      soatJami[h] = (soatJami[h] || 0) + v0;
      if(v0 > eng) eng = v0;
    }
    kunJami.push(q);
  }
  // Chekka ko'rsatkichlar — YIG'INDI emas, O'RTACHA katak qiymati.
  // Shunda ular kataklar bilan bir shkalada gapiradi va rang ham xuddi
  // shu issiqlik shkalasidan olinadi.
  var kunOrt = kunJami.map(function(v){ return v / cols; });
  var soatOrt = soatJami.map(function(v){ return v / rows; });
  var engKun = Math.max.apply(null, kunOrt) || 1;
  var engSoat = Math.max.apply(null, soatOrt) || 1;
  function ortRang(v){ return issiqRang(Math.pow(Math.min(1, v / eng), 0.65)); }
  function ortMatn(v){ return v >= 10 ? fmtNum(Math.round(v)) : v.toFixed(1); }

  for(var h2=0; h2<cols; h2 += 2)
    svg.appendChild(el("text", {x:P.l + h2*kw + kw/2, y:P.t-6, "text-anchor":"middle", class:"tick num"},
      String(h2).padStart(2,"0")));

  for(var k2=0; k2<rows; k2++){
    svg.appendChild(el("text", {x:P.l-9, y:P.t + k2*kh + kh/2 + 3.5, "text-anchor":"end", class:"tick"},
      HAFTA[k2]));
    for(var h3=0; h3<cols; h3++){
      var v = s.heat[k2][h3];
      // Kuchsiz kataklar ham sezilsin: darajani gamma bilan yumshatamiz
      var ulush = v ? Math.pow(v/eng, 0.65) : 0;
      var r = el("rect", {x:P.l + h3*kw + 1, y:P.t + k2*kh + 1,
        width:Math.max(1, kw-2), height:Math.max(1, kh-2), rx:3, ry:3,
        fill: v ? issiqRang(ulush) : "rgba(255,255,255,.04)",
        opacity: v ? (0.45 + 0.55*ulush).toFixed(3) : 1});
      (function(kun, soat, qiy, elem){
        elem.addEventListener("mousemove", function(e){
          tipShow(e.clientX, e.clientY,
            '<div class="tt">' + HAFTA[kun] + " · " + String(soat).padStart(2,"0") + ':00</div>' +
            '<div class="tr"><span>Hodisa</span><b>' + fmtNum(qiy) + '</b></div>' +
            '<div class="tr"><span style="color:var(--ink-3)">Shu kunda jami</span><b>' + fmtNum(kunJami[kun]) + '</b></div>' +
            '<div class="tr"><span style="color:var(--ink-3)">Shu soatda jami</span><b>' + fmtNum(soatJami[soat]) + '</b></div>');
        });
        elem.addEventListener("mouseleave", tipHide);
      })(k2, h3, v, r);
      r.style.transformBox = "fill-box";
      r.style.transformOrigin = "center";
      r.style.transform = "scale(.4)";
      r.style.opacity = "0";
      r.style.transition = "transform .4s " + TEZLIK + " " + ((h3 + k2*3) * 5) + "ms, opacity .4s ease " + ((h3 + k2*3) * 5) + "ms";
      (function(elem, oxirgi){
        keyinroq(function(){ elem.style.transform = "scale(1)"; elem.style.opacity = oxirgi; });
      })(r, v ? (0.45 + 0.55*ulush).toFixed(3) : "1");
      svg.appendChild(r);
    }

    // O'ngda: shu kunning o'rtachasi — xuddi katak shaklida
    var bx = P.l + iw + 12;
    var bar = el("rect", {x:bx, y:P.t + k2*kh + 1,
      width:Math.max(1, kw-2), height:Math.max(1, kh-2), rx:3, ry:3,
      fill:ortRang(kunOrt[k2]), opacity:.95});
    (function(kun, elem){
      elem.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY, '<div class="tt">' + HAFTA[kun] + '</div>' +
          '<div class="tr"><span>O\'rtacha (soatiga)</span><b>' + ortMatn(kunOrt[kun]) + '</b></div>' +
          '<div class="tr"><span style="color:var(--ink-3)">Jami</span><b>' + fmtNum(kunJami[kun]) + '</b></div>' +
          '<div class="tr"><span style="color:var(--ink-3)">Ulushi</span><b>' +
          (umumiy ? Math.round(kunJami[kun]/umumiy*100) : 0) + '%</b></div>');
      });
      elem.addEventListener("mouseleave", tipHide);
    })(k2, bar);
    svg.appendChild(bar);
    svg.appendChild(el("text", {x:bx + kw + 6, y:P.t + k2*kh + kh/2 + 3.5, class:"vlab"},
      ortMatn(kunOrt[k2])));
  }

  // Pastda: har soatning o'rtachasi — yana o'sha katak shaklida
  var sy = P.t + rows*kh + 9, sh2 = Math.min(kh, 30);
  for(var h4=0; h4<cols; h4++){
    var sb = el("rect", {x:P.l + h4*kw + 1, y:sy + 1,
      width:Math.max(1, kw-2), height:Math.max(1, sh2-2), rx:3, ry:3,
      fill:ortRang(soatOrt[h4]), opacity:.95});
    (function(soat, elem){
      elem.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY,
          '<div class="tt">' + String(soat).padStart(2,"0") + ':00 — barcha kunlar</div>' +
          '<div class="tr"><span>O\'rtacha (kuniga)</span><b>' + ortMatn(soatOrt[soat]) + '</b></div>' +
          '<div class="tr"><span style="color:var(--ink-3)">Jami</span><b>' + fmtNum(soatJami[soat]) + '</b></div>' +
          '<div class="tr"><span style="color:var(--ink-3)">Ulushi</span><b>' +
          (umumiy ? Math.round(soatJami[soat]/umumiy*100) : 0) + '%</b></div>');
      });
      elem.addEventListener("mouseleave", tipHide);
    })(h4, sb);
    svg.appendChild(sb);
  }
  svg.appendChild(el("text", {x:P.l-9, y:sy + sh2/2 + 3.5, "text-anchor":"end", class:"tick"}, "o'rtacha"));
  // Chekka ko'rsatkichlar asosiy katakdan ingichka chiziq bilan ajratiladi
  svg.appendChild(el("line", {x1:P.l, x2:P.l + iw, y1:sy - 4, y2:sy - 4,
    stroke:"var(--line-2)", "stroke-width":1}));
  svg.appendChild(el("line", {x1:P.l + iw + 6, x2:P.l + iw + 6, y1:P.t, y2:P.t + rows*kh,
    stroke:"var(--line-2)", "stroke-width":1}));

  return svg;
}

/* ───────── 3. Soatlar ───────── */
function chartHours(s, balandlik, ro){
  var W = 960, H = balandlik || 175, P = {t:14, r:14, b:24, l:40};
  var soatlar = ro || s.hours.map(function(v, h){ return {h:h, v:v}; });
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img", "aria-label":"Sutka davomida faollik"});
  var maxV = niceMax(Math.max(1, Math.max.apply(null, soatlar.map(function(x){ return x.v; }))));
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var bw = iw/soatlar.length;
  for(var g=0; g<=2; g++){
    var y = P.t + ih - (ih*g/2);
    svg.appendChild(el("line", {x1:P.l, x2:W-P.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}));
    svg.appendChild(el("text", {x:P.l-7, y:y+3.5, "text-anchor":"end", class:"tick num"}, fmtNum(maxV*g/2)));
  }
  var engV = Math.max.apply(null, soatlar.map(function(x){ return x.v; }));
  var peak = -1;
  soatlar.forEach(function(x, i){ if(peak < 0 && x.v === engV && engV > 0) peak = i; });
  for(var i2=0; i2<soatlar.length; i2++){
    var h = soatlar[i2].h, v = soatlar[i2].v, hh = (v/maxV)*ih;
    var x = P.l + i2*bw;
    var r = el("rect", {x:x+1.5, y:P.t+ih-hh, width:Math.max(1, bw-3), height:Math.max(v ? 2 : 0, hh),
      rx:3, ry:3, fill: i2 === peak ? "var(--gold)" : S2, opacity: i2 === peak ? 1 : .8});
    r.style.transformBox = "fill-box";
    r.style.transformOrigin = "center bottom";
    r.style.transform = "scaleY(0)";
    r.style.transition = "transform .45s " + TEZLIK + " " + (i2 * 12) + "ms";
    (function(el2){ keyinroq(function(){ el2.style.transform = "scaleY(1)"; }); })(r);
    (function(h, v){
      r.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY, '<div class="tt">' + String(h).padStart(2,"0") + ":00–" +
          String(h).padStart(2,"0") + ':59</div><div class="tr"><span>Hodisa</span><b>' + fmtNum(v) + '</b></div>');
      });
      r.addEventListener("mouseleave", tipHide);
    })(h, v);
    svg.appendChild(r);
    var qadam = soatlar.length > 12 ? 3 : 1;
    if(i2 % qadam === 0)
      svg.appendChild(el("text", {x:x+bw/2, y:H-7, "text-anchor":"middle", class:"tick num"}, String(h).padStart(2,"0")));
  }
  if(peak >= 0 && engV)
    svg.appendChild(el("text", {x:Math.min(W-P.r-30, P.l+peak*bw+bw/2), y:P.t+ih-(engV/maxV)*ih-6,
      "text-anchor":"middle", class:"vlab", fill:"var(--gold)"}, "eng gavjum"));
  return svg;
}

/* ───────── 4. Oddiy gorizontal bar (manba / fakultet) ───────── */
function barList(items, color, total){
  // items: [{lab, val, color?}]
  var box = document.createElement("div");
  box.className = "fun";
  var max = Math.max.apply(null, items.map(function(i){ return i.val; })) || 1;
  items.forEach(function(it){
    var row = document.createElement("div"); row.className = "fun-row";
    var lab = document.createElement("div"); lab.className = "fun-lab";
    lab.innerHTML = "<b>" + esc(it.lab) + "</b>" + (it.note ? esc(it.note) : "");
    var tr = document.createElement("div"); tr.className = "fun-track";
    var fl = document.createElement("div"); fl.className = "fun-fill";
    var kengligi = (it.val/max*100).toFixed(1) + "%";
    fl.style.width = "0%";
    fl.style.background = it.color || color;
    fl.style.opacity = ".85";
    keyinroq(function(){ fl.style.width = kengligi; });
    var nm = document.createElement("div"); nm.className = "fun-num";
    nm.innerHTML = "<span>" + fmtNum(it.val) + "</span>" +
      (total ? "<i>" + (it.val/total*100).toFixed(1).replace(/\.0$/,"") + "%</i>" : "");
    tr.appendChild(fl);
    row.appendChild(lab); row.appendChild(tr); row.appendChild(nm);
    box.appendChild(row);
  });
  return box;
}

/* Element DOM'ga tushgandan keyin qiymatni o'zgartiramiz — shundagina CSS
   o'tishi (transition) ishlaydi. Ikki kadr kerak: birinchisida brauzer
   boshlang'ich holatni hisoblaydi. */
/* Raqam 0 dan o'z qiymatigacha sanaladi. Harakat tinch bo'lishi uchun
   oxiriga kelib sekinlashadi. Kichik raqamlarda ma'nosi yo'q - tegmaymiz. */
var OLDINGI_KPI = {};
function sanab(el2, qiymat, kalit){
  if(!el2) return;
  var eski = OLDINGI_KPI[kalit];
  OLDINGI_KPI[kalit] = qiymat;
  if(ST.jim || qiymat < 12 || eski === qiymat){ el2.textContent = fmtNum(qiymat); return; }
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  }catch(e){}
  var boshi = null, davom = 700;
  var dan = (typeof eski === "number") ? eski : 0;   // o'zgarish bo'lsa eski raqamdan
  el2.textContent = fmtNum(dan);
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi) / davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    el2.textContent = fmtNum(dan + (qiymat - dan) * yumshoq);
    if(p < 1) requestAnimationFrame(qadam);
    else el2.textContent = fmtNum(qiymat);
  }
  requestAnimationFrame(qadam);
}

function keyinroq(f){
  // Panel fonda o'zi yangilanganda (har besh daqiqada) chizmalar qaytadan
  // "o'sib" chiqsa ko'z charchaydi — jim rejimda darhol joyiga qo'yamiz.
  if(ST.jim){ f(); return; }
  requestAnimationFrame(function(){ requestAnimationFrame(f); });
}
var TEZLIK = "cubic-bezier(.22,.9,.3,1)";

/* Voronka: har qadamda ikki foiz — birinchi qadamga nisbatan (yo'lning
   qancha qismi qolgani) va bir oldingi qadamga nisbatan (shu qadamda
   qanchasi o'tgani). Ikkinchisi qayerda ko'p odam yo'qolayotganini
   birinchisidan aniqroq ko'rsatadi. */
function voronka(qadamlar, birinchiUstun){
  var box = document.createElement("div");
  box.className = "vor";
  var bosh = document.createElement("div");
  bosh.className = "vor-bosh";
  bosh.innerHTML = "<span>" + esc(birinchiUstun || "Qadam") + "</span><span></span><span>Odam</span>" +
    "<span>Boshdan</span><span>Oldingidan</span>";
  box.appendChild(bosh);

  var birinchi = qadamlar.length ? qadamlar[0].val : 0;
  qadamlar.forEach(function(q, i){
    var oldingi = i ? qadamlar[i-1].val : null;
    var row = document.createElement("div");
    row.className = "vor-row";

    var lab = document.createElement("div");
    lab.className = "vor-lab"; lab.textContent = q.lab; lab.title = q.lab;

    var tr = document.createElement("div"); tr.className = "vor-track";
    var fl = document.createElement("div"); fl.className = "vor-fill";
    fl.style.background = q.color;
    fl.style.width = "0%";
    var kengligi = (birinchi ? (q.val / birinchi * 100) : 0).toFixed(1) + "%";
    keyinroq(function(){ fl.style.width = kengligi; });
    tr.appendChild(fl);

    var son = document.createElement("div");
    son.className = "vor-son"; son.textContent = fmtNum(q.val);

    var f1 = document.createElement("div");
    f1.className = "vor-foiz";
    f1.textContent = birinchi ? (q.val / birinchi * 100).toFixed(1) + "%" : "—";

    var f2 = document.createElement("div");
    f2.className = "vor-foiz oldin";
    if(oldingi === null) f2.textContent = "—";
    else if(!oldingi) f2.textContent = "—";
    else {
      var u = q.val / oldingi * 100;
      f2.textContent = u.toFixed(1) + "%";
      f2.style.color = u >= 60 ? "#3fbf6a" : (u >= 25 ? "var(--warn)" : "#e0796f");
    }

    row.appendChild(lab); row.appendChild(tr); row.appendChild(son);
    row.appendChild(f1); row.appendChild(f2);
    box.appendChild(row);
  });
  return box;
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ───────── Panel yasash ───────── */
function card(title, hint, cls){
  var c = document.createElement("section");
  c.className = "card" + (cls ? " " + cls : "");
  var h = document.createElement("div"); h.className = "c-head";
  var t = document.createElement("h2"); t.textContent = title;
  h.appendChild(t);
  var asbob = document.createElement("div"); asbob.className = "c-tools";
  if(hint){ var s = document.createElement("span"); s.className = "hint"; s.textContent = hint; h.appendChild(s); }
  h.appendChild(asbob);
  c.appendChild(h);
  c._head = asbob;
  if(KARTA_INFO[title]){
    var ib = document.createElement("button");
    ib.type = "button"; ib.className = "zbtn ibtn-info";
    ib.title = "Bu karta haqida"; ib.setAttribute("aria-label", "Bu karta haqida");
    ib.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5"></path><path d="M12 7.8v.2"></path></svg>';
    ib.addEventListener("click", function(){ infoOch(ib, title); });
    asbob.appendChild(ib);
  }

  // Kattalashtirish: chizma butun ekranni egallaydi.
  var ZB_OCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M14.5 3.5H20.5V9.5"></path><path d="M9.5 20.5H3.5V14.5"></path>' +
    '<path d="M20.5 3.5L13.8 10.2"></path><path d="M3.5 20.5L10.2 13.8"></path></svg>';
  var ZB_YOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>';
  var zb = document.createElement("button");
  zb.className = "zbtn"; zb.type = "button";
  zb.title = "Kattalashtirish"; zb.setAttribute("aria-label", "Kattalashtirish");
  zb.innerHTML = ZB_OCH;
  var fon = null;
  function yop(){
    c.classList.remove("katta");
    if(fon){ fon.remove(); fon = null; }
    zb.innerHTML = ZB_OCH; zb.title = "Kattalashtirish";
    zb.classList.remove("yoniq");
    document.removeEventListener("keydown", esc);
    olcham();
  }
  /* Chizmalar viewBox bilan chizilgani uchun kattalashganda ham o'z
     nisbatini saqlaydi va pastda katta bo'sh joy qoladi. Shu sababli
     karta ichida qolgan bo'sh joyni o'lchab, chizmaga aytamiz. */
  function olcham(){
    if(typeof c._qayta !== "function") return;
    var fig0 = c.querySelector("figure");
    // Foydalanuvchi qo'lda cho'zgan balandlik kattalashtirishga xalaqit
    // bermasin: oynada chizma butun joyni olishi kerak.
    if(fig0) fig0.style.height = "";

    if(!c.classList.contains("katta")){
      // Yopilganda chizma o'z odatdagi o'lchamiga qaytadi. Karta balandligi
      // chizmaga bog'liq, shuning uchun uni o'lchab bo'lmaydi — "standart"
      // deb aytamiz (null).
      ST.jim = true; c._qayta(null); ST.jim = false;
      return;
    }
    requestAnimationFrame(function(){
      var fig = c.querySelector("figure");
      if(!fig) return;
      var band = 0;
      [].forEach.call(c.children, function(ch){
        if(ch !== fig && !ch.hidden) band += ch.getBoundingClientRect().height;
      });
      var ichki = c.getBoundingClientRect().height - band - 34;
      var kenglik = fig.clientWidth || 960;
      c._qayta(Math.max(200, Math.round(960 * ichki / kenglik)));
    });
  }
  function esc(e){ if(e.key === "Escape") yop(); }
  zb.addEventListener("click", function(){
    if(c.classList.contains("katta")){ yop(); return; }
    c.classList.add("katta");
    fon = document.createElement("div");
    fon.className = "karta-fon";
    fon.addEventListener("click", yop);
    document.body.appendChild(fon);
    zb.innerHTML = ZB_YOP; zb.title = "Yopish";
    zb.classList.add("yoniq");
    document.addEventListener("keydown", esc);
    olcham();
  });
  asbob.appendChild(zb);

  /* Foydalanuvchi figure ni cho'zganda chizmani yangi balandlikda qayta
     chizamiz — aks holda SVG o'z nisbatida qolib, ortig'i kesiladi. */
  c._kuzat = function(fig){
    if(typeof c._qayta !== "function") return;
    fig.classList.add("cho");
    var oxirgi = 0, kutmoqda = false;
    function tekshir(){
      var h = Math.round(fig.getBoundingClientRect().height);
      if(Math.abs(h - oxirgi) < 6) return;
      oxirgi = h;
      var kenglik = fig.clientWidth || 960;
      ST.jim = true;
      c._qayta(Math.max(140, Math.round(960 * (h - 8) / kenglik)));
      ST.jim = false;
      if(!c.classList.contains("katta")) fig.style.height = h + "px";
    }
    if(window.ResizeObserver){
      new ResizeObserver(function(){
        if(kutmoqda) return;
        kutmoqda = true;
        setTimeout(function(){ kutmoqda = false; tekshir(); }, 120);
      }).observe(fig);
    }
  };
  return c;
}

/* Jadval yoki ro'yxat butun ekranni egallagan oynada ochiladi — karta
   ostiga siqilgandan ko'ra shunday o'qish qulayroq. */
function katakOyna(sarlavha, toldir){
  var fon = document.createElement("div");
  fon.className = "karta-fon";
  var oyna = document.createElement("section");
  oyna.className = "card katta";

  var h = document.createElement("div"); h.className = "c-head";
  var t = document.createElement("h2"); t.textContent = sarlavha;
  var asbob = document.createElement("div"); asbob.className = "c-tools";
  var yb = document.createElement("button");
  yb.className = "zbtn yoniq"; yb.type = "button";
  yb.title = "Yopish"; yb.setAttribute("aria-label", "Yopish");
  yb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>';
  asbob.appendChild(yb);
  h.appendChild(t); h.appendChild(asbob);
  oyna.appendChild(h);
  toldir(oyna);

  function yop(){
    fon.remove(); oyna.remove();
    document.removeEventListener("keydown", esc);
  }
  function esc(e){
    if(e.key !== "Escape") return;
    var hammasi = document.querySelectorAll(".card.katta");
    if(hammasi[hammasi.length-1] === oyna) yop();     // bir-birining ustida ochilgan bo'lsa
  }
  yb.addEventListener("click", yop);
  fon.addEventListener("click", yop);
  document.addEventListener("keydown", esc);
  document.body.appendChild(fon);
  document.body.appendChild(oyna);
  yb.focus();
}

/* Har qanday grafik uchun bosiladigan legenda. */
function toggleLegend(items, holat, kalit, ozgardi){
  var d = document.createElement("div");
  d.className = "legend switchy";
  function yangila(){
    [].forEach.call(d.querySelectorAll(".lg"), function(b, i){
      var yoq = holat[items[i][kalit]];
      b.className = "lg" + (yoq ? "" : " off");
      b.setAttribute("aria-pressed", String(!!yoq));
    });
  }
  items.forEach(function(x){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lg";   // yangila() shu klass bo'yicha topadi
    b.innerHTML = '<span class="swatch" style="background:' + x.c + '"></span>' + esc(x.n);
    b.addEventListener("click", function(){
      var faol = items.filter(function(y){ return holat[y[kalit]]; });
      // Oxirgisini o'chirsa grafik bo'm-bo'sh qoladi - buni to'sib qo'yamiz.
      if(faol.length === 1 && holat[x[kalit]]) return;
      holat[x[kalit]] = !holat[x[kalit]];
      yangila();
      ozgardi();
    });
    d.appendChild(b);
  });
  yangila();
  return d;
}

/* ───────── Hodisa matni (Lenta va odam tarixi uchun) ───────── */
function hodisaMatni(r){
  var e = r.ev;
  if(e.t === "film") return "<b>" + esc(filmName(e.film)) + "</b> " + LANGS[e.lang].f +
    (e.origin === "web" ? " · ilovadan" : e.origin === "bot" ? " · botdan" : "");
  if(e.t === "house") return "<b>" + esc((HOUSES[e.house]||{n:e.house}).n) + "</b> fakultetiga tushdi";
  if(e.t === "src") return "reklamadan keldi · <b>" + esc(e.src) + "</b>";
  if(e.t === "invited"){
    var p = personOf(e.by);
    return "do'st taklifi bilan keldi · <b>" + esc(p ? p.name : "ID " + e.by) + "</b>";
  }
  if(e.t === "undo") return "bekor qildi · <b>" + esc(filmName(e.film)) + "</b>";
  if(e.t === "share"){
    var m = String(r.payload).match(/^share_([a-z]{2}\d+)_(uz|ru|en)$/);
    return m ? "ulashdi · <b>" + esc(filmName(m[1])) + "</b> " + LANGS[m[2]].f : "ulashdi";
  }
  return esc(e.lab);
}

/* ───────── Bitta odamning butun tarixi ─────────
   Davrdan qat'i nazar, loglardagi HAMMA yozuvi — eng yangisi yuqorida,
   kunlar bo'yicha guruhlangan. Uning taklifi bilan kelganlar ham tarixga
   kiradi ("... ni olib keldi"), chunki bu ham shu odamning harakati. */
function tarixTugma(uid, nom){
  var b = document.createElement("button");
  b.type = "button"; b.className = "tarix-btn";
  b.title = (nom ? nom + " — " : "") + "hodisalar tarixi";
  b.setAttribute("aria-label", b.title);
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"></path><path d="M3.5 4.5v4h4"></path>' +
    '<path d="M12 7.5V12l3 2"></path></svg><span>Tarix</span>';
  b.addEventListener("click", function(){ odamTarixi(uid); });
  return b;
}

function odamTarixi(uid){
  // Taklif ikki bosqich: havola bilan start (`invited_`) va kanalga qo'shilish
  // (`ref_awarded`, o'sha odamning o'zida). Bot kabi ikkinchisi "olib keldi".
  var oz = [], olib = [], taklifi = {};
  for(var i=0; i<ST.rows.length; i++){
    var r = ST.rows[i];
    if(r.uid === uid) oz.push(r);
    else if(r.ev.t === "invited" && r.ev.by === uid){ olib.push(r); taklifi[r.uid] = 1; }
    else if(r.ev.t === "refwin" && taklifi[r.uid]) olib.push(r);
  }
  var olibSoni = olib.filter(function(r){ return r.ev.t === "refwin"; }).length;
  var p = personOf(uid) || {name:"ID " + uid, user:""};
  var uname = p.user && p.user !== "Yo'q" ? p.user : "";

  // Qisqa ma'lumot: kim, qachondan beri, nima qilgan
  var film = 0, uy = null, manba = null, kanal = null, bot = null, ulash = 0;
  oz.forEach(function(r){
    var e = r.ev;
    if(e.t === "film") film++;
    else if(e.t === "house") uy = e.house;
    else if(e.t === "share") ulash++;
    else if(e.t === "sub" || e.t === "left") kanal = e.t;
    else if(e.t === "blocked") bot = "blocked";
    else if(e.t === "start") bot = "start";
    if(!manba && e.t === "src") manba = "📣 " + e.src;
    if(!manba && e.t === "invited"){ var q = personOf(e.by); manba = "🤝 " + (q ? q.name : "ID " + e.by); }
  });

  var sarlavha = p.name + (uy && HOUSES[uy] ? " " + HOUSES[uy].crest : "");
  katakOyna(sarlavha, function(joy){
    var bosh = document.createElement("div");
    bosh.className = "tarix-kim";
    bosh.innerHTML = (uname ? '<a class="tglink" href="https://t.me/' + encodeURIComponent(uname.replace(/^@/, "")) +
        '" target="_blank" rel="noopener">' + esc(uname) + '</a> · ' : "") +
      '<span class="uname">ID ' + esc(uid) + '</span>';
    joy.appendChild(bosh);

    var ozet = document.createElement("div");
    ozet.className = "tarq-kpi";
    var birinchi = oz.length ? oz[0].t : null, oxirgi = oz.length ? oz[oz.length-1].t : null;
    [["Birinchi kelgan", birinchi ? fmtDay(dayKey(birinchi)) : "—", birinchi ? birinchi.getFullYear() + " · " + fmtTime(birinchi) : ""],
     ["Oxirgi faollik", oxirgi ? fmtDay(dayKey(oxirgi)) : "—", oxirgi ? fmtTime(oxirgi) : ""],
     ["Hodisa", fmtNum(oz.length), fmtNum(film) + " ta film · " + fmtNum(ulash) + " ulashish"],
     ["Fakultet", uy && HOUSES[uy] ? HOUSES[uy].n : "—", uy ? "" : "saralanmagan"],
     ["Qayerdan", manba ? manba.slice(0, 2) : "✨", manba ? manba.slice(3) : "to'g'ridan-to'g'ri"],
     ["Holati", kanal === "sub" ? "Kanalda" : kanal === "left" ? "Chiqqan" : "—",
      (bot === "blocked" ? "botni bloklagan" : "bot faol") + (olibSoni ? " · " + olibSoni + " kishi olib kelgan" : "")]
    ].forEach(function(m){
      var d = document.createElement("div");
      d.className = "tk";
      d.innerHTML = '<span class="k-lab">' + esc(m[0]) + '</span><span class="tk-val kichik">' + esc(m[1]) +
        '</span><span class="tk-sub">' + esc(m[2]) + '</span>';
      ozet.appendChild(d);
    });
    joy.appendChild(ozet);

    // Lenta: o'z yozuvlari + uning taklifi bilan kelganlar
    var hammasi = oz.map(function(r){ return {r:r, ozi:true}; })
      .concat(olib.map(function(r){ return {r:r, ozi:false}; }))
      .sort(function(a, b){ return b.r.t - a.r.t; });
    var lenta = document.createElement("div");
    lenta.className = "feed";
    lenta.style.maxHeight = "none";
    var kun = null;
    hammasi.forEach(function(x){
      var dk = dayKey(x.r.t);
      if(dk !== kun){
        kun = dk;
        var kb = document.createElement("div");
        kb.className = "kun-bosh";
        kb.textContent = fmtDay(dk) + " " + x.r.t.getFullYear();
        lenta.appendChild(kb);
      }
      var d = document.createElement("div"); d.className = "fe";
      d.innerHTML = '<span class="ic">' + (x.ozi ? x.r.ev.ic : x.r.ev.t === "refwin" ? "🎁" : "🤝") + '</span>' +
        '<span class="txt">' + (x.ozi ? hodisaMatni(x.r)
          : x.r.ev.t === "refwin"
            ? "<b>" + odamHavola(x.r.uid, x.r.name) + "</b> kanalga qo'shildi — olib keldi, ball berildi"
            : "<b>" + odamHavola(x.r.uid, x.r.name) + "</b> uning havolasi bilan botga kirdi") + '</span>' +
        '<span class="when">' + fmtTime(x.r.t) + '</span>';
      lenta.appendChild(d);
    });
    if(!hammasi.length) lenta.appendChild(emptyNote("Bu odamning yozuvi topilmadi."));
    joy.appendChild(lenta);
  });
}

/* Ism bosilsa tarix ochiladi. Bosish bitta joyda ushlanadi (pastda),
   shuning uchun ism istalgan HTML matn ichida ishlaydi. */
function odamHavola(uid, nom){
  return '<a href="#" class="odam-link" data-uid="' + esc(uid) + '">' + esc(nom || ("ID " + uid)) + '</a>';
}
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest(".odam-link");
  if(!a) return;
  e.preventDefault();
  odamTarixi(a.getAttribute("data-uid"));
});

/* Odam qidirish: loglardagi istalgan odam — ism, username yoki ID bo'yicha. */
function odamQidiruv(){
  var box = document.createElement("div");
  box.className = "qidir";
  box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>';
  var inp = document.createElement("input");
  inp.type = "search"; inp.placeholder = "Odam qidirish: ism, @username, ID";
  inp.setAttribute("aria-label", "Odam qidirish");
  inp.spellcheck = false;
  var ro = document.createElement("div");
  ro.className = "qidir-ro"; ro.hidden = true;
  box.appendChild(inp); box.appendChild(ro);

  var tanlov = -1, topilgan = [];
  function izla(){
    var q = inp.value.trim().toLowerCase().replace(/^@/, "");
    ro.innerHTML = ""; tanlov = -1; topilgan = [];
    if(q.length < 2){ ro.hidden = true; return; }
    if(!ST.people){ ST.people = {}; ST.rows.forEach(function(r){ if(r.uid) ST.people[r.uid] = {name:r.name, user:r.user}; }); }
    var k = Object.keys(ST.people);
    for(var i=0; i<k.length && topilgan.length < 30; i++){
      var p = ST.people[k[i]];
      var un = String(p.user || "").toLowerCase().replace(/^@/, "");
      if(String(p.name).toLowerCase().indexOf(q) > -1 || (un && un !== "yo'q" && un.indexOf(q) > -1) ||
         k[i].indexOf(q) > -1) topilgan.push(k[i]);
    }
    if(!topilgan.length){
      ro.innerHTML = '<div class="qidir-bosh">Hech kim topilmadi</div>';
    } else {
      topilgan.slice(0, 8).forEach(function(uid, j){
        var p = ST.people[uid];
        var b = document.createElement("button");
        b.type = "button";
        b.innerHTML = '<b>' + esc(p.name) + '</b>' +
          (p.user && p.user !== "Yo'q" ? ' <span class="uname">' + esc(p.user) + '</span>' : "") +
          '<span class="uname qid">' + esc(uid) + '</span>';
        b.addEventListener("mousedown", function(e){ e.preventDefault(); och(uid); });
        ro.appendChild(b);
      });
      if(topilgan.length > 8){
        var m = document.createElement("div"); m.className = "qidir-bosh";
        m.textContent = (topilgan.length > 29 ? "yana ko'plab" : "yana " + (topilgan.length - 8) + " ta") + " — aniqroq yozing";
        ro.appendChild(m);
      }
    }
    ro.hidden = false;
  }
  function och(uid){ ro.hidden = true; inp.blur(); odamTarixi(uid); }
  inp.addEventListener("input", izla);
  inp.addEventListener("focus", function(){ if(inp.value.trim().length > 1) izla(); });
  inp.addEventListener("blur", function(){ setTimeout(function(){ ro.hidden = true; }, 120); });
  inp.addEventListener("keydown", function(e){
    var bt = ro.querySelectorAll("button");
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      if(!bt.length) return;
      e.preventDefault();
      tanlov = (tanlov + (e.key === "ArrowDown" ? 1 : -1) + bt.length) % bt.length;
      [].forEach.call(bt, function(x, i){ x.classList.toggle("on", i === tanlov); });
    } else if(e.key === "Enter"){
      e.preventDefault();
      if(topilgan.length) och(topilgan[Math.max(0, Math.min(tanlov, 7))]);
    } else if(e.key === "Escape"){ e.stopPropagation(); ro.hidden = true; inp.value = ""; }
  });
  return box;
}

/* ───────── Kanal hajmi: loglardan ─────────
   Kanaldagi odamlar = BOSHLANG'ICH son + loglardagi qo'shilish/chiqishlar.
   Har odam oxirgi holati bo'yicha: bir hodisa ikki marta yozilib qolsa ham
   son buzilmaydi. Telegramdagi son bu yerga KO'CHIRILMAYDI — u yonida faqat
   nazorat uchun turadi; ikkalasi teng bo'lsa, loglar to'g'ri tushyapti.

   Boshlang'ich son: loglar 2026-03-07 da boshlangan. 2026-09-23 da Telegram
   1490, loglar (odam bo'yicha) +1264 ko'rsatdi => o'sha kuni kanalda 226 kishi
   bo'lgan. Bu son bir marta aniqlangan va o'zgarmaydi. */
var KANAL_BOSHI = 226;

function kanalHajmi(){
  var holat = {}, son = KANAL_BOSHI, kun = {}, ozg = [], kirgan = {};
  for(var i=0; i<ST.rows.length; i++){
    var r = ST.rows[i], e = r.ev.t;
    if(e !== "sub" && e !== "left") continue;
    if(holat[r.uid] === e) continue;                // takroriy yozuv
    var prev = holat[r.uid];
    son += (e === "sub") ? 1 : -1;
    holat[r.uid] = e;
    kun[dayKey(r.t)] = son;
    // Haqiqiy o'zgarishlar. Qo'shilishda — ilgari chiqib ketgan odammi (qayta),
    // chiqishda — oxirgi qo'shilganidan beri qancha vaqt o'tgani (noma'lum = null).
    var oz = {t:r.t, d:(e === "sub") ? 1 : -1, uid:r.uid};
    if(e === "sub"){ oz.qayta = (prev === "left"); kirgan[r.uid] = r.t; }
    else oz.muddat = kirgan[r.uid] ? (r.t - kirgan[r.uid]) : null;
    ozg.push(oz);
  }
  return {son:son, kun:kun, ozg:ozg};
}
/* Berilgan kun oxiridagi son: o'sha kuni hodisa bo'lmasa — oldingi kunniki. */
function kanalKunOxiri(kh, dk){
  var eng = null, qiy = KANAL_BOSHI;
  for(var k in kh.kun) if(k <= dk && (eng === null || k > eng)){ eng = k; qiy = kh.kun[k]; }
  return qiy;
}

var INFO_POP = null;
function infoYop(){
  if(INFO_POP){ INFO_POP.remove(); INFO_POP = null; }
  document.removeEventListener("mousedown", infoTashqi, true);
}
function infoTashqi(e){
  if(INFO_POP && !INFO_POP.contains(e.target) && !(e.target.closest && e.target.closest(".ibtn-info"))) infoYop();
}
function infoOch(btn, nom){
  var edi = INFO_POP && INFO_POP._btn === btn;
  infoYop();
  if(edi) return;                              // ikkinchi bosish — yopadi
  var p = document.createElement("div");
  p.className = "info-pop";
  p.setAttribute("role", "dialog");
  p.innerHTML = "<b>" + esc(nom) + "</b><p>" + esc(KARTA_INFO[nom]) + "</p>";
  p._btn = btn;
  document.body.appendChild(p);
  var r = btn.getBoundingClientRect();
  var w = p.offsetWidth;
  p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + "px";
  var top = r.bottom + 8;
  if(top + p.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - p.offsetHeight - 8);
  p.style.top = top + "px";
  INFO_POP = p;
  setTimeout(function(){ document.addEventListener("mousedown", infoTashqi, true); }, 0);
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && INFO_POP){ e.stopImmediatePropagation(); infoYop(); } }, true);
