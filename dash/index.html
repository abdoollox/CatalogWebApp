<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Garri Potter Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Qorong'i — ataylab yagona dunyo: ilovaning o'zi ham shunday (qasr kechasi). */
:root{
  --bg:#0b0e13; --panel:#141922; --panel-2:#1b212c; --line:rgba(231,193,112,.14);
  --line-2:rgba(255,255,255,.07);
  --ink:#eae7e0; --ink-2:#a3adba; --ink-3:#6f7987;
  --gold:#e7c170; --gold-2:#c0913a; --gold-hi:#f3d58f;
  /* Grafik seriyalari — validatordan o'tgan (dark, surface #141922) */
  --s1:#c98500; --s2:#3987e5; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --griff:#d9524a; --slyth:#2fa36b; --raven:#5b8fd9; --huff:#e8b93c;
  --grid:rgba(255,255,255,.06); --axis:rgba(255,255,255,.16);
  --r:14px;
}
*{box-sizing:border-box}
/* display:grid/flex qo'yilgan elementda hidden o'z-o'zidan ishlamaydi */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1460px; margin:0 auto; padding-inline:clamp(16px, 2.2vw, 34px); padding-block:0 56px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; margin:0; text-wrap:balance}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:6px}

/* ————— Sarlavha ————— */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:linear-gradient(180deg,rgba(11,14,19,.97) 72%,rgba(11,14,19,0));
  padding-block:14px 10px;
  margin-inline:calc(-1 * clamp(16px, 2.2vw, 34px));
  padding-inline:clamp(16px, 2.2vw, 34px);
  backdrop-filter:blur(8px);
}
.bosh{display:flex; align-items:center; gap:10px 22px; flex-wrap:wrap}
.asboblar{display:flex; align-items:center; gap:8px; margin-left:auto; flex:none}
.seg{display:flex; background:var(--panel); border:1px solid var(--line-2); border-radius:10px; padding:3px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--ink-2); font-size:12.5px; font-weight:600;
  padding:6px 11px; border-radius:7px; cursor:pointer; white-space:nowrap; transition:.15s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:rgba(231,193,112,.15); color:var(--gold-hi)}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:10px; cursor:pointer; transition:.15s;
}
.btn:hover{border-color:var(--gold-2); background:var(--panel-2)}
.btn.ghost{border-color:var(--line-2); color:var(--ink-2)}
.btn.yoniq{border-color:var(--gold-2); color:var(--gold-hi); background:rgba(231,193,112,.1)}
#fullscr{font-size:15px; line-height:1; padding:7px 11px}
.spacer{flex:1 1 auto}
.ibtn{
  width:38px; height:38px; flex:none; display:grid; place-items:center;
  border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
  border-radius:11px; cursor:pointer; transition:.15s; padding:0;
}
.ibtn svg{width:18px; height:18px; display:block}
.ibtn:hover{border-color:var(--gold-2); color:var(--gold-hi); background:var(--panel-2)}
.ibtn:disabled{opacity:.5; cursor:default}
.ibtn.aylanmoqda svg{animation:aylan 1s linear infinite}
@keyframes aylan{to{transform:rotate(360deg)}}
.ibtn.yoniq{border-color:var(--gold-2); color:var(--gold-hi); background:rgba(231,193,112,.1)}

.davr-wrap{position:relative}
.davr-btn{
  display:inline-flex; align-items:center; gap:9px; padding:9px 13px; font-size:13px;
  border-color:var(--line); min-width:132px; justify-content:space-between;
}
.davr-btn .strelka{color:var(--ink-3); font-size:10px; transition:.15s}
.davr-btn[aria-expanded="true"]{border-color:var(--gold-2); color:var(--gold-hi)}
.davr-btn[aria-expanded="true"] .strelka{transform:rotate(180deg)}
.davr-menu{
  position:absolute; top:calc(100% + 6px); left:0; z-index:40; min-width:210px;
  background:var(--panel); border:1px solid var(--line); border-radius:13px;
  padding:6px; box-shadow:0 18px 44px rgba(0,0,0,.55);
}
.davr-menu button{
  display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px;
  border:0; background:transparent; color:var(--ink-2); font-size:13px; font-weight:500;
  padding:8px 11px; border-radius:9px; cursor:pointer; text-align:left; font-family:inherit;
}
.davr-menu button:hover{background:var(--panel-2); color:var(--ink)}
.davr-menu button[aria-checked="true"]{color:var(--gold-hi); font-weight:700}
.davr-menu button[aria-checked="true"]::after{content:"✓"; font-size:12px}
.davr-menu .ajrat{height:1px; background:var(--line-2); margin:5px 8px}
.davr-menu .sarlavha{
  font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em;
  font-weight:700; padding:7px 11px 4px;
}
.range-pick{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;
  padding:10px 12px; background:var(--panel); border:1px solid var(--line);
  border-radius:12px;
}
.range-pick label{font-size:12px; color:var(--ink-3); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
.range-pick input[type=date]{
  background:var(--bg); border:1px solid var(--line-2); border-radius:9px;
  padding:7px 10px; color:var(--ink); font-family:inherit; font-size:13px;
  color-scheme:dark; min-width:140px;
}
.range-pick .btn{padding:7px 12px}
.range-pick .err{margin:0; flex-basis:100%}
.range-pick .tayyor{display:flex; gap:6px; flex-wrap:wrap; margin-left:4px}
.range-pick .tayyor button{
  border:1px solid var(--line-2); background:transparent; color:var(--ink-3);
  font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:999px; cursor:pointer;
  font-family:inherit; transition:.15s; white-space:nowrap;
}
.range-pick .tayyor button:hover{border-color:var(--gold-2); color:var(--gold)}
.tabs{
  display:flex; gap:3px; overflow-x:auto; scrollbar-width:none;
  background:var(--panel); border:1px solid var(--line-2); border-radius:12px; padding:4px;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  display:inline-flex; align-items:center; gap:7px;
  border:0; background:transparent; color:var(--ink-3); font-family:'Cormorant Garamond',serif;
  font-size:17.5px; font-weight:600; padding:6px 13px; cursor:pointer; white-space:nowrap;
  border-radius:9px; transition:.15s; letter-spacing:.01em;
}
.tabs .tab-ic{width:15px; height:15px; flex:none; opacity:.75; transition:.15s}
.tabs button[aria-selected="true"] .tab-ic{opacity:1}
.tabs button:hover{color:var(--ink-2); background:var(--panel-2)}
.tabs button[aria-selected="true"]{color:var(--gold-hi); background:rgba(231,193,112,.14)}
.tabs button .n{
  font-family:'Manrope',sans-serif; font-size:10.5px; font-weight:700; color:var(--ink-3);
  margin-left:5px; font-variant-numeric:tabular-nums;
}
.tabs button[aria-selected="true"] .n{color:var(--gold-2)}
@media (max-width:900px){
  .bosh{gap:9px 14px}
  .tabs{order:3; flex-basis:100%}
  .asboblar{margin-left:auto}
}
.src-line{
  display:flex; align-items:center; gap:9px; margin-top:9px; font-size:12px; color:var(--ink-3);
  flex-wrap:wrap;
}
.dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none}
.dot.demo{background:var(--warn)}
.dot.err{background:var(--crit)}
.pill{
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:11.5px;
  color:var(--gold); background:rgba(231,193,112,.07); font-weight:600;
}

/* ————— Kartalar ————— */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(176px,1fr)); gap:clamp(10px,1vw,16px); margin-top:18px}
.kpi{
  background:var(--panel); border:1px solid var(--line-2); border-radius:var(--r);
  padding:14px 15px 13px; display:flex; flex-direction:column; gap:3px; min-width:0;
}
.kpi .k-lab{font-size:11.5px; color:var(--ink-3); letter-spacing:.05em; text-transform:uppercase; font-weight:600}
.kpi .k-val{
  font-family:'Cormorant Garamond',Georgia,serif; font-size:35px; line-height:1.05; color:var(--ink);
  font-variant-numeric:lining-nums tabular-nums; font-weight:600;
}
.kpi .k-sub{
  font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px;
  flex-wrap:wrap; margin-top:auto; padding-top:5px;
}
.delta{font-weight:700; font-variant-numeric:tabular-nums; display:inline-flex; align-items:center; gap:3px}
.delta.up{color:#3fbf6a} .delta.down{color:#e0796f} .delta.flat{color:var(--ink-3)}
.kpi.lead{border-color:rgba(231,193,112,.3); background:linear-gradient(160deg,rgba(231,193,112,.07),var(--panel) 62%)}
.kpi.lead .k-val{color:var(--gold-hi)}

/* ————— Panellar ————— */
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:clamp(12px,1.1vw,18px); margin-top:14px; align-items:start}
.card{
  grid-column:span 12; background:var(--panel); border:1px solid var(--line-2);
  border-radius:var(--r); padding:clamp(15px,1.1vw,19px) clamp(16px,1.2vw,21px) clamp(13px,1vw,17px); min-width:0;
}
.card.half{grid-column:span 6}
.card.katta{
  position:fixed; inset:10px; z-index:70; margin:0; overflow:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6); border-color:var(--line);
  padding-top:max(14px, env(safe-area-inset-top, 0px));
  padding-bottom:max(14px, env(safe-area-inset-bottom, 0px));
}
.karta-fon{position:fixed; inset:0; z-index:69; background:rgba(5,7,10,.72); backdrop-filter:blur(3px)}
.c-head .zbtn{
  border:0; background:transparent; color:var(--ink-3); font-size:15px; line-height:1;
  cursor:pointer; padding:4px 7px; border-radius:6px; margin-left:4px;
}
.c-head .zbtn:hover{color:var(--gold); background:rgba(231,193,112,.08)}
.card.third{grid-column:span 4}
.card.twothird{grid-column:span 8}
@media (max-width:860px){ .card.half,.card.third,.card.twothird{grid-column:span 12} }
.c-head{display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap}
.c-head h2{font-size:20px; color:var(--ink)}
.c-head .hint{font-size:12px; color:var(--ink-3); flex:1 1 120px}
.c-head .tbtn{margin-left:auto; 
  border:0; background:transparent; color:var(--ink-3); font-size:11.5px; font-weight:600;
  cursor:pointer; padding:3px 7px; border-radius:6px; letter-spacing:.03em;
}
.c-head .tbtn:hover{color:var(--gold); background:rgba(231,193,112,.08)}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin:7px 0 2px; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend.switchy{gap:5px 6px; margin:9px 0 2px}
.legend .lg{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2);
  background:var(--panel-2); color:var(--ink-2); font-size:11.5px; font-weight:600;
  padding:4px 10px 4px 8px; border-radius:999px; cursor:pointer; transition:.15s;
  white-space:nowrap;
}
.legend .lg .swatch{width:8px; height:8px; border-radius:2px}
.legend .lg:hover{border-color:var(--gold-2); color:var(--ink)}
.legend .lg.off{opacity:.45; text-decoration:line-through; text-decoration-thickness:1px}
.legend .lg.off .swatch{filter:grayscale(1)}
.swatch{width:10px; height:10px; border-radius:3px; flex:none}
figure{margin:0}
svg{display:block; width:100%; height:auto; overflow:visible}
figure{min-width:0}
.tick{fill:var(--ink-3); font-size:10.5px; font-family:'Manrope',sans-serif}
.tick.num{font-variant-numeric:tabular-nums}
.vlab{fill:var(--ink-2); font-size:11px; font-family:'Manrope',sans-serif; font-variant-numeric:tabular-nums; font-weight:600}
.slab{fill:var(--ink); font-size:11.5px; font-family:'Manrope',sans-serif}

/* Jadval ko'rinishi */
.tbl-wrap{overflow-x:auto; margin-top:8px}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:340px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap}
th{color:var(--ink-3); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(255,255,255,.025)}
.uname{color:var(--ink-3); font-size:11.5px}

/* Lenta */
.feed{display:flex; flex-direction:column; max-height:min(64vh,620px); overflow-y:auto; margin-top:6px}
.fe{display:flex; gap:11px; padding:8px 2px; border-bottom:1px solid var(--line-2); align-items:flex-start}
.fe:last-child{border-bottom:0}
.fe .ic{
  width:26px; height:26px; border-radius:8px; flex:none; display:grid; place-items:center;
  font-size:13px; background:var(--panel-2); border:1px solid var(--line-2);
}
.fe .txt{flex:1 1 auto; min-width:0; font-size:12.5px; line-height:1.35}
.fe .txt b{font-weight:600}
.fe .who{color:var(--ink-2)}
.fe .when{color:var(--ink-3); font-size:11.5px; font-variant-numeric:tabular-nums; flex:none}
.who-line{display:block; font-size:12.5px; margin-bottom:2px}
.who-line b{color:var(--ink); font-weight:600}
.tglink{color:var(--gold); text-decoration:none; font-size:11.5px}
.tglink:hover{text-decoration:underline}
.back-tag{
  color:#3fbf6a; font-size:10.5px; font-weight:600; border:1px solid rgba(63,191,106,.35);
  border-radius:999px; padding:1px 7px; margin-left:5px; white-space:nowrap;
}

/* Voronka */
.fun{display:flex; flex-direction:column; gap:9px; margin-top:10px}
.fun-row{display:grid; grid-template-columns:minmax(0,140px) 1fr auto; gap:11px; align-items:center}
@media (max-width:520px){ .fun-row{grid-template-columns:minmax(0,1fr) auto; gap:4px 9px}
  .fun-lab{grid-column:1/-1} }
.fun-lab{font-size:12.5px; color:var(--ink-2)}
.fun-lab b{display:block; color:var(--ink); font-size:13px; font-weight:600}
.fun-track{height:26px; background:var(--panel-2); border-radius:7px; position:relative; overflow:hidden}
.fun-fill{height:100%; border-radius:7px; transition:width .5s cubic-bezier(.22,.9,.3,1)}
.fun-num{
  display:flex; align-items:baseline; gap:7px; justify-content:flex-end; white-space:nowrap;
  font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink);
}
.fun-num i{font-style:normal; color:var(--ink-3); font-weight:500; font-size:11.5px}
.fun-track{flex:1 1 auto}

/* Bo'sh holat / modal */
.empty{
  border:1px dashed var(--line); border-radius:var(--r); padding:26px 20px; text-align:center;
  color:var(--ink-2); background:rgba(231,193,112,.03);
}
.sheet{
  position:fixed; inset:0; z-index:60; background:rgba(5,7,10,.72); backdrop-filter:blur(3px);
  display:grid; place-items:center; padding:16px;
}
.sheet .box{
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
  max-width:520px; width:100%; max-height:86vh; overflow-y:auto;
}
.sheet h2{font-size:23px; color:var(--gold); margin-bottom:6px}
.sheet p{color:var(--ink-2); font-size:13px; margin:6px 0 12px}
.sheet ol{color:var(--ink-2); font-size:13px; padding-left:18px; margin:6px 0 14px}
.sheet li{margin-bottom:5px}
.sheet label{display:block; font-size:12px; color:var(--ink-3); font-weight:600; margin:12px 0 5px; text-transform:uppercase; letter-spacing:.04em}
.sheet input[type=url],.sheet input[type=number]{
  width:100%; background:var(--bg); border:1px solid var(--line-2); border-radius:9px;
  padding:10px 12px; color:var(--ink); font-family:inherit; font-size:13px;
}
.drop{
  border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center;
  color:var(--ink-2); font-size:13px; cursor:pointer; transition:.15s; background:rgba(255,255,255,.015);
}
.drop:hover,.drop.over{border-color:var(--gold); background:rgba(231,193,112,.07); color:var(--ink)}
.row{display:flex; gap:9px; margin-top:16px; flex-wrap:wrap}
.err{color:#e0796f; font-size:12.5px; margin-top:9px}
.note{font-size:11.5px; color:var(--ink-3); margin-top:12px; line-height:1.5}
.divider{height:1px; background:var(--line-2); margin:16px 0}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
.hovline{stroke:var(--gold); stroke-width:1; opacity:.5}
.tipbox{
  position:fixed; z-index:50; pointer-events:none; background:#0e1219; border:1px solid var(--line);
  border-radius:9px; padding:8px 11px; font-size:12px; color:var(--ink); box-shadow:0 8px 26px rgba(0,0,0,.5);
  min-width:120px;
}
.tipbox .tt{font-weight:700; margin-bottom:4px; font-size:12.5px}
.tipbox .tr{display:flex; align-items:center; gap:7px; justify-content:space-between; gap:14px}
.tipbox .tr b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="bosh">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="asboblar">
        <div class="davr-wrap">
          <button class="btn davr-btn" id="davr-btn" aria-haspopup="true" aria-expanded="false">
            <span id="davr-nom">30 kun</span><span class="strelka">▾</span>
          </button>
          <div class="davr-menu" id="davr-menu" hidden role="menu"></div>
        </div>
        <button class="ibtn" id="open-src" title="Ma'lumot manbai" aria-label="Ma'lumot manbai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <ellipse cx="12" cy="5.5" rx="7.5" ry="3"></ellipse>
            <path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"></path>
            <path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"></path>
          </svg>
        </button>
        <button class="ibtn" id="refresh" title="Yangilash" aria-label="Yangilash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path>
          </svg>
        </button>
        <button class="ibtn" id="fullscr" title="To'liq ekran (F)" aria-label="To'liq ekran">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H3v5"></path><path d="M16 3h5v5"></path>
            <path d="M16 21h5v-5"></path><path d="M8 21H3v-5"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="range-pick" id="range-pick" hidden>
      <label for="d-from">dan</label>
      <input type="date" id="d-from">
      <label for="d-to">gacha</label>
      <input type="date" id="d-to">
      <button class="btn" id="d-ok">Ko'rsat</button>
      <button class="btn ghost" id="d-clear">Bekor</button>
      <span class="err" id="d-err" hidden></span>
    </div>
    <div class="src-line" id="srcline"></div>
  </header>

  <main id="app"></main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   XOGVARTS KUZATUV XONASI
   Google Sheets "Logs" varag'i: user_id | nickname | username | payload | timestamp
   ═══════════════════════════════════════════════════════════════════ */

var FILMS = {
  hp1:{n:"Hikmatlar Toshi",      num:"I",    y:2001, kind:"hp"},

/* ───────── CSV ───────── */
function parseCSV(text){
  // Qo'shtirnoq ichidagi vergul va qator ko'chishini hurmat qiladi.
  text = text.replace(/^﻿/, "");
  var sep = ",";
  var head = text.slice(0, text.indexOf("\n") < 0 ? text.length : text.indexOf("\n"));
  if(head.split("\t").length > head.split(",").length) sep = "\t";
  var rows=[], cur=[], val="", q=false, i=0;
  for(; i<text.length; i++){
    var ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += ch;
    } else if(ch === '"'){ q = true; }
    else if(ch === sep){ cur.push(val); val=""; }
    else if(ch === "\n"){ cur.push(val); rows.push(cur); cur=[]; val=""; }
    else if(ch === "\r"){ /* skip */ }
    else val += ch;
  }
  if(val !== "" || cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ""; }); });
}

var MONTHS_SHEET = null;
function parseTime(s){
  s = String(s||"").trim();
  if(!s) return null;
  var m;
  // 2026-09-21 18:26:00  /  2026-09-21T18:26:00
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?/)))
    return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +(m[6]||0));
  // 21.09.2026 18:26  /  21/09/2026
  if((m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?/))){
    var a=+m[1], b=+m[2];
    // AQSh formati (oy/kun) — birinchi son 12 dan katta bo'lmasa noaniq; Sheets ko'pincha M/D/YYYY beradi
    if(s.indexOf("/") > -1 && a <= 12 && b > 12) return new Date(+m[3], a-1, b, +m[4], +m[5], +(m[6]||0));
    return new Date(+m[3], b-1, a, +m[4], +m[5], +(m[6]||0));
  }
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return new Date(+m[1], +m[2]-1, +m[3]);
  // Sheets seriya raqami (1899-12-30 dan boshlab kunlar)
  if(/^\d{5}(\.\d+)?$/.test(s)){
    var ms = (parseFloat(s) - 25569) * 86400000;
    return new Date(ms + new Date().getTimezoneOffset()*60000);
  }
  var d = new Date(s);
  return isNaN(d) ? null : d;
}

function looksLikeHeader(r){
  var j = r.join(" ").toLowerCase();
  return /user|id|payload|time|sana|vaqt|nick|ism|kino/.test(j) && !parseTime(r[4]);
}

/* Ustunlar joyi. Jadvalga qo'shimcha ustun qo'shilgan bo'lsa ham topamiz;
   "Tashkent" deb belgilangan vaqt ustuni bo'lsa — o'shani afzal ko'ramiz. */
function mapCols(header){
  var ix = {uid:0, name:1, user:2, payload:3, time:4, local:false};
  if(!header) return ix;
  var h = header.map(function(x){ return String(x||"").toLowerCase().trim(); });
  function find(re){
    for(var i=0; i<h.length; i++) if(re.test(h[i])) return i;
    return -1;
  }
  var v;
  if((v = find(/user\s*id|^id$|foydalanuvchi/)) >= 0) ix.uid = v;
  if((v = find(/nick|ism|\bname\b/)) >= 0) ix.name = v;
  if((v = find(/user\s*name|login/)) >= 0 && v !== ix.uid) ix.user = v;
  if((v = find(/payload|kino|film|harakat|action|event/)) >= 0) ix.payload = v;
  var tk = find(/tashkent|toshkent|mahalliy|local/);
  if(tk >= 0){ ix.time = tk; ix.local = true; }
  else if((v = find(/vaqt|time|sana|date/)) >= 0) ix.time = v;
  return ix;
}

function classify(p){
  p = String(p||"").trim();
  var m;
  if(p === "start")        return {t:"start", lab:"Botni ochdi", ic:"✨"};
  if(p === "subscribed")   return {t:"sub",   lab:"Kanalga qo'shildi", ic:"📜"};
  if(p === "left")         return {t:"left",  lab:"Kanalni tark etdi", ic:"🚪"};
  if(p === "blocked")      return {t:"blocked",lab:"Botni blokladi", ic:"⛔"};
  if(p === "ref_awarded")  return {t:"refwin",lab:"Do'st uchun ball oldi", ic:"🎁"};
  if(p === "sort_start")   return {t:"sortst",lab:"Saralanishni boshladi", ic:"🎩"};
  if((m = p.match(/^house_([a-z]+)$/)))   return {t:"house", house:m[1], lab:"Fakultetga tushdi", ic:"🎩"};
  if((m = p.match(/^wand_/)))             return {t:"wand",  lab:"Asosini tanladi", ic:"🪄"};
  if((m = p.match(/^src_(.+)$/)))         return {t:"src",   src:m[1], lab:"Reklamadan keldi", ic:"📣"};
  if((m = p.match(/^invited_(\d+)$/)))    return {t:"invited", by:m[1], lab:"Do'st taklifi bilan keldi", ic:"🤝"};
  if((m = p.match(/^share_(.+)$/)))       return {t:"share", lab:"Ulashdi", ic:"🔗"};
  if((m = p.match(/^bekor_(\w+)$/)))      return {t:"undo",  film:m[1], lab:"Bekor qildi", ic:"↩️"};
  if((m = p.match(/^(web|bot)_([a-z]{2}\d+)_(uz|ru|en)$/)))
    return {t:"film", origin:m[1], film:m[2], lang:m[3], lab:"Filmni oldi", ic:"🎬"};
  if((m = p.match(/^([a-z]{2}\d+)_(uz|ru|en)$/)))
    return {t:"film", origin:"?", film:m[1], lang:m[2], lab:"Filmni oldi", ic:"🎬"};
  return {t:"other", lab:p || "—", ic:"•"};
}

/* ───────── Ma'lumotni tayyorlash ───────── */
function buildRows(raw){
  var out = [], ix = {uid:0, name:1, user:2, payload:3, time:4, local:false}, start = 0;
  if(raw.length && looksLikeHeader(raw[0])){ ix = mapCols(raw[0]); start = 1; }
  ST.cols = ix;
  for(var i=start; i<raw.length; i++){
    var r = raw[i];
    if(r.length < 4) continue;
    var ts = parseTime(r[ix.time]);
    if(!ts){ // ustun bo'sh yoki siljigan — qolganlaridan izlaymiz
      for(var j=r.length-1; j>=0 && !ts; j--) ts = parseTime(r[j]);
      if(!ts) continue;
    }
    if(ST.tz) ts = new Date(ts.getTime() + ST.tz*3600000);
    out.push({
      uid: String(r[ix.uid]||"").trim(),
      name: String(r[ix.name]||"").trim() || "Nomsiz",
      user: String(r[ix.user]||"").trim(),
      payload: String(r[ix.payload]||"").trim(),
      t: ts, ev: classify(r[ix.payload])
    });
  }
  out.sort(function(a,b){ return a.t - b.t; });
  return out;
}

function dayKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDay(k){
  var p = k.split("-");
  return (+p[2]) + " " + ["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"][+p[1]-1];
}
function fmtNum(n){
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}
function fmtTime(d){
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

/* Davr chegaralari */
function kunOqi(matn){
  // "2026-09-21" -> Date (mahalliy yarim tun). new Date("...") UTC deb o'qiydi
  // va mintaqa farqi sababli kun surilib ketadi.
  var m = String(matn || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function kunYoz(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") +
         "-" + String(d.getDate()).padStart(2,"0");
}

function windowOf(days){
  if(!ST.rows.length) return {from:new Date(0), to:new Date()};

  if(ST.oraliq){
    var a = kunOqi(ST.oraliq.from), b = kunOqi(ST.oraliq.to);
    if(a && b){
      if(a > b){ var v = a; a = b; b = v; }
      return {from: a, to: new Date(b.getFullYear(), b.getMonth(), b.getDate(), 23, 59, 59),
              kunlar: Math.round((b - a)/86400000) + 1};
    }
  }

  var last = ST.rows[ST.rows.length-1].t;
  var to = new Date(last.getFullYear(), last.getMonth(), last.getDate(), 23, 59, 59);
  if(!days) return {from: ST.rows[0].t, to: to, all:true};
  var from = new Date(to.getFullYear(), to.getMonth(), to.getDate() - (days-1));
  return {from: from, to: to, kunlar: days};
}

function slice(days){
  var w = windowOf(days);
  return ST.rows.filter(function(r){ return r.t >= w.from && r.t <= w.to; });
}

function stats(rows, first, w){
  var s = {
    events: rows.length, users:{}, newUsers:0, films:0, filmBy:{}, langs:{uz:0,ru:0,en:0},
    hours:new Array(24).fill(0), days:{}, sub:0, left:0, blocked:0, starts:0,
    soat:(function(){
      var a = [];
      for(var i=0; i<24; i++) a.push({h:i, ev:0, u:{}, movie:0, start:0, sub:0, left:0, blocked:0});
      return a;
    })(),
    houses:{}, srcs:{}, invited:0, refwin:0, shares:0, undo:0, sortStart:0, origin:{web:0,bot:0,"?":0},
    perUser:{}, byFilmLang:{}, seriya:{hp:0, fb:0},
    set:{start:{}, sub:{}, film:{}, sortst:{}, house:{}, "new":{}}
  };
  for(var i=0; i<rows.length; i++){
    var r = rows[i], e = r.ev;
    s.users[r.uid] = 1;
    // Odam bo'yicha sanaymiz, yozuv bo'yicha emas: kimdir botni ochgan zahoti
    // kanalga qo'shilsa, ikkala yozuv ham AYNAN bir xil soniyada tushadi va
    // u ikki marta "yangi" bo'lib ko'rinardi.
    if(first[r.uid] && first[r.uid] >= w.from && first[r.uid] <= w.to)
      s.set["new"][r.uid] = 1;
    var sh = r.t.getHours();
    s.hours[sh]++;
    s.soat[sh].ev++;
    s.soat[sh].u[r.uid] = 1;
    if(e.t === "film") s.soat[sh].movie++;
    else if(s.soat[sh][e.t] !== undefined) s.soat[sh][e.t]++;
    var dk = dayKey(r.t);
    if(!s.days[dk]) s.days[dk] = {ev:0, u:{}, movie:0, start:0, sub:0, left:0, blocked:0};
    s.days[dk].ev++; s.days[dk].u[r.uid] = 1;
    if(s.days[dk][e.t] !== undefined && e.t !== "film") s.days[dk][e.t]++;
    if(!s.perUser[r.uid]) s.perUser[r.uid] = {name:r.name, user:r.user, uid:r.uid, ev:0, films:0, last:r.t, house:null};
    var pu = s.perUser[r.uid];
    pu.ev++; pu.last = r.t; pu.name = r.name || pu.name; pu.user = r.user || pu.user;

    if(s.set[e.t]) s.set[e.t][r.uid] = 1;

    switch(e.t){
      case "film":
        s.films++; s.days[dk].movie++; pu.films++;
        s.filmBy[e.film] = (s.filmBy[e.film]||0) + 1;
        if(s.langs[e.lang] !== undefined) s.langs[e.lang]++;
        s.origin[e.origin] = (s.origin[e.origin]||0) + 1;
        var kk = e.film + "|" + e.lang;
        s.byFilmLang[kk] = (s.byFilmLang[kk]||0) + 1;
        var tur = FILMS[e.film] && FILMS[e.film].kind;
        if(tur && s.seriya[tur] !== undefined) s.seriya[tur]++;
        break;
      case "start":   s.starts++; break;
      case "sub":     s.sub++; break;
      case "left":    s.left++; break;
      case "blocked": s.blocked++; break;
      case "house":   s.houses[e.house] = (s.houses[e.house]||0)+1; pu.house = e.house; break;
      case "src":     s.srcs[e.src] = (s.srcs[e.src]||0)+1; break;
      case "invited": s.invited++; break;
      case "refwin":  s.refwin++; break;
      case "share":   s.shares++; break;
      case "undo":    s.undo++; break;
      case "sortst":  s.sortStart++; break;
    }
  }
  for(var k in s.days) s.days[k].uq = Object.keys(s.days[k].u).length;
  s.soat.forEach(function(x){ x.uq = Object.keys(x.u).length; });
  s.uniq = Object.keys(s.users).length;
  s.who = {};
  for(var t in s.set) s.who[t] = Object.keys(s.set[t]).length;
  s.newUsers = s.who["new"];
  return s;
}

function el(tag, attrs, txt){

}
function niceMax(v){
  if(v <= 5) return Math.max(v, 1);
  var p = Math.pow(10, Math.floor(Math.log10(v)));
  var s = [1,1.5,2,2.5,3,4,5,6,8,10];
  for(var i=0; i<s.length; i++) if(s[i]*p >= v) return s[i]*p;
  return 10*p;
}

var TIP = null;
function tipShow(x, y, html){
  if(!TIP){ TIP = document.createElement("div"); TIP.className = "tipbox"; document.body.appendChild(TIP); }
  TIP.innerHTML = html;
  TIP.hidden = false;
  var w = TIP.offsetWidth, h = TIP.offsetHeight;
  var L = Math.min(Math.max(8, x - w/2), window.innerWidth - w - 8);
  var T = y - h - 12; if(T < 8) T = y + 18;
  TIP.style.left = L + "px"; TIP.style.top = T + "px";
}
function tipHide(){ if(TIP) TIP.hidden = true; }

/* ───────── 1. Kunlik faollik ───────── */
/* Chizma BIR MARTA quriladi. Ko'rsatkich qo'shilganda yoki olib tashlanganda
   hammasi qaytadan chizilmaydi: o'zgargani ochiladi yoki so'nadi, qolganlari
   esa yangi masshtabga silliq ko'chadi. */
function chartDaily(dayList, holat, balandlik){
  var W = 960, H = balandlik || 200, P = {t:15, r:26, b:24, l:46};
  var n = dayList.length;
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var X = function(i){ return n <= 1 ? P.l + iw/2 : P.l + i*iw/(n-1); };
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img"});

  var gridLar = [], yYozuv = [];
  for(var g=0; g<=4; g++){
    var y = P.t + ih - (ih*g/4);
    svg.appendChild(el("line", {x1:P.l, x2:W-P.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}));
    var yz = el("text", {x:P.l-7, y:y+3.5, "text-anchor":"end", class:"tick num"}, "0");
    yYozuv.push(yz); svg.appendChild(yz);
  }

  var defs = el("defs", {});
  svg.appendChild(defs);

  var chiziq = {};
  KUNLIK.forEach(function(x, idx){
    var gid = "fill_" + x.k;
    var lg = el("linearGradient", {id:gid, x1:"0", y1:"0", x2:"0", y2:"1"});
    lg.appendChild(el("stop", {offset:"0", "stop-color":x.c, "stop-opacity":".26"}));
    lg.appendChild(el("stop", {offset:"1", "stop-color":x.c, "stop-opacity":"0"}));
    defs.appendChild(lg);

    var grup = el("g", {});
    var maydon = el("path", {fill:"url(#"+gid+")", stroke:"none"});
    maydon.style.opacity = "0";
    maydon.style.transition = "opacity .35s ease";
    var yol = el("path", {fill:"none", stroke:x.c, "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"});
    if(x.dash) yol.setAttribute("stroke-dasharray", "5 4");
    var uchi = el("circle", {r:3.5, fill:x.c, stroke:"var(--panel)", "stroke-width":2});
    grup.appendChild(maydon); grup.appendChild(yol); grup.appendChild(uchi);
    grup.style.opacity = "0";
    grup.style.transition = "opacity .35s ease";
    grup.style.pointerEvents = "none";
    svg.appendChild(grup);
    chiziq[x.k] = {g:grup, yol:yol, uchi:uchi, maydon:maydon, ser:x, idx:idx, bor:false};
  });

  // Soatlik ko'rinishda yorliqlar allaqachon tanlab qo'yilgan (har uchinchisi),
  // kunlik ko'rinishda oltitagacha yorliq qoldiramiz.
  var step = (n === 24) ? 1 : Math.max(1, Math.ceil(n/6));
  for(var i=0; i<n; i += step){
    var matn = dayList[i].lab !== undefined ? dayList[i].lab : fmtDay(dayList[i].k);
    if(matn) svg.appendChild(el("text", {x:X(i), y:H-8, "text-anchor":"middle", class:"tick"}, matn));
  }

  var bosh = el("text", {x:W/2, y:H/2, "text-anchor":"middle", class:"slab", fill:"var(--ink-3)"},
    "Ko'rsatkichni tanlang");
  bosh.style.opacity = "0";
  bosh.style.transition = "opacity .3s ease";
  svg.appendChild(bosh);

  var vline = el("line", {y1:P.t, y2:P.t+ih, class:"hovline"}); vline.style.opacity = 0;
  svg.appendChild(vline);
  var nuqtalar = {};
  KUNLIK.forEach(function(x){
    var c = el("circle", {r:4.5, fill:x.c, stroke:"var(--panel)", "stroke-width":2});
    c.style.opacity = 0; svg.appendChild(c); nuqtalar[x.k] = c;
  });
  var hit = el("rect", {x:0, y:0, width:W, height:H, fill:"transparent"});
  svg.appendChild(hit);

  var I = {W:W, H:H, P:P, n:n, iw:iw, ih:ih, X:X, chiziq:chiziq, yYozuv:yYozuv,
           dayList:dayList, maxV:0, holat:holat, bosh:bosh, vline:vline, nuqtalar:nuqtalar};
  svg._i = I;

  function move(ev){
    var faol = KUNLIK.filter(function(x){ return I.holat[x.k]; });
    if(!faol.length) return;
    var r = svg.getBoundingClientRect();
    var px = (ev.clientX - r.left) / r.width * W;
    var i = n <= 1 ? 0 : Math.round((px - P.l) / (iw/(n-1)));
    i = Math.max(0, Math.min(n-1, i));
    var d = dayList[i], engY = H;
    vline.setAttribute("x1", X(i)); vline.setAttribute("x2", X(i)); vline.style.opacity = 1;
    var qator = "";
    KUNLIK.forEach(function(x){
      var c = nuqtalar[x.k];
      if(!I.holat[x.k]){ c.style.opacity = 0; return; }
      var y = P.t + ih - (d[x.k]/I.maxV)*ih;
      if(y < engY) engY = y;
      c.setAttribute("cx", X(i)); c.setAttribute("cy", y); c.style.opacity = 1;
      qator += '<div class="tr"><span><span class="swatch" style="display:inline-block;background:' +
        x.c + '"></span> ' + esc(x.n) + '</span><b>' + fmtNum(d[x.k]) + '</b></div>';
    });
    tipShow(ev.clientX, r.top + (engY/H)*r.height,
      '<div class="tt">' + esc(d.tip || fmtDay(d.k)) + '</div>' + qator);
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("touchmove", function(e){ if(e.touches[0]) move(e.touches[0]); });
  hit.addEventListener("mouseleave", function(){
    vline.style.opacity = 0;
    KUNLIK.forEach(function(x){ nuqtalar[x.k].style.opacity = 0; });
    tipHide();
  });

  chartYangila(svg, holat, true);
  return svg;
}

/* Masshtab o'zgarishi bitta son - maxV. Har kadrda uni oraliq qiymatga
   qo'yib chiziqlarni qayta hisoblaymiz: shunda qolgan chiziqlar sakramay,
   silliq ko'chadi va Y o'qidagi raqamlar ham ular bilan birga o'zgaradi. */
function chartYangila(svg, holat, ilk){
  var I = svg._i;
  I.holat = holat;
  var faol = KUNLIK.filter(function(x){ return holat[x.k]; });
  var eng = 1;
  I.dayList.forEach(function(d){
    faol.forEach(function(x){ if(d[x.k] > eng) eng = d[x.k]; });
  });
  var yangiMax = niceMax(eng);
  var eskiMax = I.maxV || yangiMax;
  I.maxV = yangiMax;
  I.bosh.style.opacity = faol.length ? "0" : "1";

  var yolgiz = faol.length === 1;

  // Ilk chizilish izlari (dasharray) masshtab o'zgarganda chiziqni kesib
  // qo'yadi — chiziq uzunligi boshqacha bo'lib qoladi. Shuning uchun
  // birinchi o'zgarishdayoq tozalab tashlaymiz.
  if(!ilk){
    KUNLIK.forEach(function(x){
      if(x.dash) return;
      var y = I.chiziq[x.k].yol;
      y.style.transition = "";
      y.style.strokeDasharray = "";
      y.style.strokeDashoffset = "";
    });
  }

  function chizMax(m){
    KUNLIK.forEach(function(x){
      var c = I.chiziq[x.k];
      if(!holat[x.k] && !c.bor) return;        // ko'rinmaydi va ko'rinmagan ham
      var d = "";
      for(var i=0; i<I.n; i++){
        var y = I.P.t + I.ih - (I.dayList[i][x.k]/m)*I.ih;
        d += (i ? "L" : "M") + I.X(i).toFixed(1) + " " + y.toFixed(1) + " ";
      }
      c.yol.setAttribute("d", d);
      c.maydon.setAttribute("d", d + "L" + I.X(I.n-1).toFixed(1) + " " + (I.P.t+I.ih) +
                                 " L" + I.X(0).toFixed(1) + " " + (I.P.t+I.ih) + " Z");
      if(I.n){
        c.uchi.setAttribute("cx", I.X(I.n-1));
        c.uchi.setAttribute("cy", I.P.t + I.ih - (I.dayList[I.n-1][x.k]/m)*I.ih);
      }
    });
    for(var g=0; g<=4; g++) I.yYozuv[g].textContent = fmtNum(m*g/4);
  }

  // Ko'rinish: faqat O'ZGARGANI harakatlanadi
  KUNLIK.forEach(function(x){
    var c = I.chiziq[x.k];
    var kerak = !!holat[x.k];
    if(kerak !== c.bor){
      c.g.style.opacity = kerak ? "1" : "0";
      c.bor = kerak;
    }
    c.maydon.style.opacity = (kerak && yolgiz) ? "1" : "0";
  });

  if(ilk || ST.jim || eskiMax === yangiMax){
    chizMax(yangiMax);
    if(ilk && !ST.jim) ilkChizilish(I, faol);
    return;
  }

  var boshi = null, davom = 420;
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi)/davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    chizMax(eskiMax + (yangiMax - eskiMax)*yumshoq);
    if(p < 1) requestAnimationFrame(qadam);
  }
  requestAnimationFrame(qadam);
}

/* Sahifa ilk ochilganda chiziqlar chapdan o'ngga chiziladi. */
function ilkChizilish(I, faol){
  faol.forEach(function(x, j){
    var c = I.chiziq[x.k];
    if(x.dash) return;                 // punktirda dasharray band
    var uz = 0;
    try{ uz = c.yol.getTotalLength(); }catch(e){}
    if(!uz) return;
    c.yol.style.strokeDasharray = uz;
    c.yol.style.strokeDashoffset = uz;
    c.yol.style.transition = "stroke-dashoffset .75s " + TEZLIK + " " + (j*60) + "ms";
    keyinroq(function(){
      c.yol.style.strokeDashoffset = "0";
      // Chizilib bo'lgach dasharray ni bo'shatamiz: masshtab o'zgarganda
      // chiziq uzunligi ham o'zgaradi va eski dasharray uni kesib qo'yardi.
      setTimeout(function(){
        c.yol.style.transition = "";
        c.yol.style.strokeDasharray = "";
        c.yol.style.strokeDashoffset = "";
      }, 800 + j*60);
    });
  });
}

/* ───────── 2. Filmlar reytingi (tillar bo'yicha yig'ma) ───────── */
/* Bu chizma ham bir marta quriladi. Til olib tashlanganda filmlar o'rin
   almashmaydi — faqat tegishli bo'lak siqiladi va bar qisqaradi. Tartib
   sakrab tursa, ko'z qaysi qator qayerga ketganini yo'qotadi. */
function chartFilms(s, tillar){
  var jami0 = {};
  Object.keys(s.filmBy).forEach(function(k){ jami0[k] = s.filmBy[k]; });
  var keys = Object.keys(FILMS).filter(function(k){ return jami0[k]; })
    .sort(function(a,b){ return jami0[b] - jami0[a]; });
  Object.keys(jami0).forEach(function(k){ if(!FILMS[k] && keys.indexOf(k) < 0) keys.push(k); });
  if(!keys.length) return null;

  var rowH = 27, gap = 7, P = {t:6, r:52, b:20, l:148};
  var W = 960, H = P.t + keys.length*(rowH+gap) + P.b;
  var iw = W - P.l - P.r;
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img", "aria-label":"Filmlar bo'yicha yuborishlar"});
  var cols = {uz:S1, ru:S2, en:S3};

  var gridChiz = [], xYozuv = [];
  for(var g=0; g<=4; g++){
    var x = P.l + iw*g/4;
    svg.appendChild(el("line", {x1:x, x2:x, y1:P.t, y2:H-P.b+2, stroke:"var(--grid)", "stroke-width":1}));
    var yz = el("text", {x:x, y:H-6, "text-anchor":"middle", class:"tick num"}, "0");
    xYozuv.push(yz); svg.appendChild(yz);
  }

  var qatorlar = {};
  keys.forEach(function(k, i){
    var y = P.t + i*(rowH+gap);
    svg.appendChild(el("text", {x:P.l-10, y:y+rowH/2+4, "text-anchor":"end", class:"slab"},
      (FILMS[k] ? FILMS[k].num + ". " : "") + filmName(k)));
    var seg = {};
    ["uz","ru","en"].forEach(function(lg){
      var v = s.byFilmLang[k+"|"+lg] || 0;
      var r = el("rect", {x:P.l, y:y, width:0, height:rowH, fill:cols[lg], rx:0, ry:0});
      r.style.transformBox = "fill-box";
      r.style.transformOrigin = "left center";
      r.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY,
          '<div class="tt">' + filmName(k) + '</div>' +
          '<div class="tr"><span>' + LANGS[lg].f + " " + LANGS[lg].n + '</span><b>' + fmtNum(v) + '</b></div>');
      });
      r.addEventListener("mouseleave", tipHide);
      svg.appendChild(r);
      seg[lg] = {rect:r, val:v};
    });
    var son = el("text", {x:P.l, y:y+rowH/2+4, class:"vlab"}, "0");
    svg.appendChild(son);
    qatorlar[k] = {seg:seg, son:son, y:y};
  });

  svg._i = {keys:keys, qatorlar:qatorlar, P:P, iw:iw, xYozuv:xYozuv, maxV:0, tillar:tillar};
  filmYangila(svg, tillar, true);
  return svg;
}

function filmYangila(svg, tillar, ilk){
  var I = svg._i;
  I.tillar = tillar;
  var faol = ["uz","ru","en"].filter(function(l){ return tillar[l]; });
  var jami = {}, eng = 1;
  I.keys.forEach(function(k){
    jami[k] = faol.reduce(function(a, l){ return a + I.qatorlar[k].seg[l].val; }, 0);
    if(jami[k] > eng) eng = jami[k];
  });
  var yangiMax = niceMax(eng);
  var eskiMax = I.maxV || yangiMax;
  I.maxV = yangiMax;

  function chiz(m, ulush){
    I.keys.forEach(function(k){
      var q = I.qatorlar[k], off = 0;
      ["uz","ru","en"].forEach(function(lg){
        var sg = q.seg[lg];
        var korinadi = tillar[lg] && sg.val > 0;
        var w = korinadi ? (sg.val/m)*I.iw : 0;
        sg.rect.setAttribute("x", I.P.l + (off/m)*I.iw);
        sg.rect.setAttribute("width", Math.max(0, w - (w > 3 ? 2 : 0)));
        sg.rect.style.transform = "scaleX(" + (korinadi ? ulush : 0) + ")";
        var oxirgi = korinadi && (off + sg.val) >= jami[k] - 0.001;
        sg.rect.setAttribute("rx", oxirgi ? 4 : 0);
        sg.rect.setAttribute("ry", oxirgi ? 4 : 0);
        if(korinadi) off += sg.val;
      });
      q.son.setAttribute("x", I.P.l + (jami[k]/m)*I.iw*ulush + 8);
      q.son.textContent = fmtNum(jami[k]);
      q.son.style.opacity = jami[k] ? "1" : "0";
    });
    for(var g=0; g<=4; g++) I.xYozuv[g].textContent = fmtNum(m*g/4);
  }

  if(ilk){
    chiz(yangiMax, 0);
    if(ST.jim){ chiz(yangiMax, 1); return; }
    I.keys.forEach(function(k, i){
      var q = I.qatorlar[k];
      ["uz","ru","en"].forEach(function(lg){
        q.seg[lg].rect.style.transition = "transform .5s " + TEZLIK + " " + (i*22) + "ms";
      });
      q.son.style.opacity = "0";
      q.son.style.transition = "opacity .4s ease " + (i*22 + 240) + "ms";
    });
    keyinroq(function(){ chiz(yangiMax, 1); });
    return;
  }

  // Til qo'shildi yoki olib tashlandi: bo'laklar joyida o'zgaradi
  I.keys.forEach(function(k){
    var q = I.qatorlar[k];
    ["uz","ru","en"].forEach(function(lg){ q.seg[lg].rect.style.transition = "transform .3s " + TEZLIK; });
  });
  if(ST.jim || eskiMax === yangiMax){ chiz(yangiMax, 1); return; }

  var boshi = null, davom = 420;
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi)/davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    chiz(eskiMax + (yangiMax - eskiMax)*yumshoq, 1);
    if(p < 1) requestAnimationFrame(qadam);
  }
  requestAnimationFrame(qadam);
}

/* ───────── 3. Soatlar ───────── */
function chartHours(s, balandlik){
  var W = 960, H = balandlik || 175, P = {t:14, r:14, b:24, l:40};
  var svg = el("svg", {viewBox:"0 0 "+W+" "+H, role:"img", "aria-label":"Sutka davomida faollik"});
  var maxV = niceMax(Math.max(1, Math.max.apply(null, s.hours)));
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var bw = iw/24;
  for(var g=0; g<=2; g++){
    var y = P.t + ih - (ih*g/2);
    svg.appendChild(el("line", {x1:P.l, x2:W-P.r, y1:y, y2:y, stroke:"var(--grid)", "stroke-width":1}));
    svg.appendChild(el("text", {x:P.l-7, y:y+3.5, "text-anchor":"end", class:"tick num"}, fmtNum(maxV*g/2)));
  }
  var peak = s.hours.indexOf(Math.max.apply(null, s.hours));
  for(var h=0; h<24; h++){
    var v = s.hours[h], hh = (v/maxV)*ih;
    var x = P.l + h*bw;
    var r = el("rect", {x:x+1.5, y:P.t+ih-hh, width:Math.max(1, bw-3), height:Math.max(v ? 2 : 0, hh),
      rx:3, ry:3, fill: h === peak ? "var(--gold)" : S2, opacity: h === peak ? 1 : .8});
    r.style.transformBox = "fill-box";
    r.style.transformOrigin = "center bottom";
    r.style.transform = "scaleY(0)";
    r.style.transition = "transform .45s " + TEZLIK + " " + (h * 12) + "ms";
    (function(el2){ keyinroq(function(){ el2.style.transform = "scaleY(1)"; }); })(r);
    (function(h, v){
      r.addEventListener("mousemove", function(e){
        tipShow(e.clientX, e.clientY, '<div class="tt">' + String(h).padStart(2,"0") + ":00–" +
          String(h).padStart(2,"0") + ':59</div><div class="tr"><span>Hodisa</span><b>' + fmtNum(v) + '</b></div>');
      });
      r.addEventListener("mouseleave", tipHide);
    })(h, v);
    svg.appendChild(r);
    if(h % 3 === 0)
      svg.appendChild(el("text", {x:x+bw/2, y:H-7, "text-anchor":"middle", class:"tick num"}, String(h).padStart(2,"0")));
  }
  if(s.hours[peak])
    svg.appendChild(el("text", {x:Math.min(W-P.r-30, P.l+peak*bw+bw/2), y:P.t+ih-(s.hours[peak]/maxV)*ih-6,
      "text-anchor":"middle", class:"vlab", fill:"var(--gold)"}, "eng gavjum"));
  return svg;
}

/* ───────── 4. Oddiy gorizontal bar (manba / fakultet) ───────── */
function barList(items, color, total){
  // items: [{lab, val, color?}]
  var box = document.createElement("div");
  box.className = "fun";
  var max = Math.max.apply(null, items.map(function(i){ return i.val; })) || 1;
  items.forEach(function(it){
    var row = document.createElement("div"); row.className = "fun-row";
    var lab = document.createElement("div"); lab.className = "fun-lab";
    lab.innerHTML = "<b>" + esc(it.lab) + "</b>" + (it.note ? esc(it.note) : "");
    var tr = document.createElement("div"); tr.className = "fun-track";
    var fl = document.createElement("div"); fl.className = "fun-fill";
    var kengligi = (it.val/max*100).toFixed(1) + "%";
    fl.style.width = "0%";
    fl.style.background = it.color || color;
    fl.style.opacity = ".85";
    keyinroq(function(){ fl.style.width = kengligi; });
    var nm = document.createElement("div"); nm.className = "fun-num";
    nm.innerHTML = "<span>" + fmtNum(it.val) + "</span>" +
      (total ? "<i>" + (it.val/total*100).toFixed(1).replace(/\.0$/,"") + "%</i>" : "");
    tr.appendChild(fl);
    row.appendChild(lab); row.appendChild(tr); row.appendChild(nm);
    box.appendChild(row);
  });
  return box;
}

/* Element DOM'ga tushgandan keyin qiymatni o'zgartiramiz — shundagina CSS
   o'tishi (transition) ishlaydi. Ikki kadr kerak: birinchisida brauzer
   boshlang'ich holatni hisoblaydi. */
/* Raqam 0 dan o'z qiymatigacha sanaladi. Harakat tinch bo'lishi uchun
   oxiriga kelib sekinlashadi. Kichik raqamlarda ma'nosi yo'q - tegmaymiz. */
var OLDINGI_KPI = {};
function sanab(el2, qiymat, kalit){
  if(!el2) return;
  var eski = OLDINGI_KPI[kalit];
  OLDINGI_KPI[kalit] = qiymat;
  if(ST.jim || qiymat < 12 || eski === qiymat){ el2.textContent = fmtNum(qiymat); return; }
  try{
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  }catch(e){}
  var boshi = null, davom = 700;
  var dan = (typeof eski === "number") ? eski : 0;   // o'zgarish bo'lsa eski raqamdan
  el2.textContent = fmtNum(dan);
  function qadam(vaqt){
    if(boshi === null) boshi = vaqt;
    var p = Math.min(1, (vaqt - boshi) / davom);
    var yumshoq = 1 - Math.pow(1 - p, 3);
    el2.textContent = fmtNum(dan + (qiymat - dan) * yumshoq);
    if(p < 1) requestAnimationFrame(qadam);
    else el2.textContent = fmtNum(qiymat);
  }
  requestAnimationFrame(qadam);
}

function keyinroq(f){

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){

/* ───────── Panel yasash ───────── */
function card(title, hint, cls){
  var c = document.createElement("section");
  c.className = "card" + (cls ? " " + cls : "");
  var h = document.createElement("div"); h.className = "c-head";
  var t = document.createElement("h2"); t.textContent = title;
  h.appendChild(t);
  if(hint){ var s = document.createElement("span"); s.className = "hint"; s.textContent = hint; h.appendChild(s); }
  c.appendChild(h);
  c._head = h;

  // Kattalashtirish: chizma butun ekranni egallaydi.
  var zb = document.createElement("button");
  zb.className = "zbtn"; zb.type = "button";
  zb.title = "Kattalashtirish"; zb.setAttribute("aria-label", "Kattalashtirish");
  zb.textContent = "⤢";
  var fon = null;
  function yop(){
    c.classList.remove("katta");
    if(fon){ fon.remove(); fon = null; }
    zb.textContent = "⤢"; zb.title = "Kattalashtirish";
    document.removeEventListener("keydown", esc);
    olcham();
  }
  /* Chizmalar viewBox bilan chizilgani uchun kattalashganda ham o'z
     nisbatini saqlaydi va pastda katta bo'sh joy qoladi. Shu sababli
     karta ichida qolgan bo'sh joyni o'lchab, chizmaga aytamiz. */
  function olcham(){
    if(typeof c._qayta !== "function") return;
    requestAnimationFrame(function(){
      var fig = c.querySelector("figure");
      if(!fig) return;
      var band = 0;
      [].forEach.call(c.children, function(ch){
        if(ch !== fig && !ch.hidden) band += ch.getBoundingClientRect().height;
      });
      var ichki = c.getBoundingClientRect().height - band - 34;
      var kenglik = fig.clientWidth || 960;
      c._qayta(c.classList.contains("katta")
        ? Math.max(200, Math.round(960 * ichki / kenglik))
        : null);
    });
  }
  function esc(e){ if(e.key === "Escape") yop(); }
  zb.addEventListener("click", function(){
    if(c.classList.contains("katta")){ yop(); return; }
    c.classList.add("katta");
    fon = document.createElement("div");
    fon.className = "karta-fon";
    fon.addEventListener("click", yop);
    document.body.appendChild(fon);
    zb.textContent = "✕"; zb.title = "Yopish";
    document.addEventListener("keydown", esc);
    olcham();
  });
  h.appendChild(zb);
  return c;
}
function addTable(cardEl, headers, rows){
  if(!rows.length) return;
  var btn = document.createElement("button");
  btn.className = "tbtn"; btn.textContent = "Jadval"; btn.setAttribute("aria-expanded", "false");
  var wrap = document.createElement("div"); wrap.className = "tbl-wrap"; wrap.hidden = true;
  var tb = document.createElement("table");
  var thead = document.createElement("thead"), tr = document.createElement("tr");
  headers.forEach(function(h, i){
    var th = document.createElement("th");
    if(i) th.className = "num";
    th.textContent = h; tr.appendChild(th);
  });
  thead.appendChild(tr); tb.appendChild(thead);
  var tbody = document.createElement("tbody");
  rows.forEach(function(r){
    var tr = document.createElement("tr");
    r.forEach(function(v, i){
      var td = document.createElement("td");
      if(i) td.className = "num";
      td.textContent = v; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody); wrap.appendChild(tb);
  btn.addEventListener("click", function(){
    wrap.hidden = !wrap.hidden;
    btn.setAttribute("aria-expanded", String(!wrap.hidden));
    btn.textContent = wrap.hidden ? "Jadval" : "Yopish";
  });
  cardEl._head.appendChild(btn);
  cardEl.appendChild(wrap);
}

/* Har qanday grafik uchun bosiladigan legenda. */
function toggleLegend(items, holat, kalit, ozgardi){
  var d = document.createElement("div");
  d.className = "legend switchy";
  function yangila(){
    [].forEach.call(d.querySelectorAll(".lg"), function(b, i){
      var yoq = holat[items[i][kalit]];
      b.className = "lg" + (yoq ? "" : " off");
      b.setAttribute("aria-pressed", String(!!yoq));
    });
  }
  items.forEach(function(x){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lg";   // yangila() shu klass bo'yicha topadi
    b.innerHTML = '<span class="swatch" style="background:' + x.c + '"></span>' + esc(x.n);
    b.addEventListener("click", function(){
      var faol = items.filter(function(y){ return holat[y[kalit]]; });
      // Oxirgisini o'chirsa grafik bo'm-bo'sh qoladi - buni to'sib qo'yamiz.
      if(faol.length === 1 && holat[x[kalit]]) return;
      holat[x[kalit]] = !holat[x[kalit]];
      yangila();
      ozgardi();
    });
    d.appendChild(b);
  });
  yangila();
  return d;
}

/* Bosiladigan legenda: ko'rsatkichni vaqtincha olib turish uchun.
   Tanlov brauzerda eslab qolinadi. */
function legendToggle(holat, ozgardi){
  var d = document.createElement("div");

/* ───────── Bo'lim qatori ───────── */
function drawTabs(sonlar){
  var nav = document.getElementById("tabs");
  nav.innerHTML = "";
  BOLIMLAR.forEach(function(b){
    var btn = document.createElement("button");
    btn.setAttribute("role", "tab");
    btn.setAttribute("aria-selected", String(b.id === ST.tab));
    btn.setAttribute("aria-controls", "sec-" + b.id);
    btn.tabIndex = (b.id === ST.tab) ? 0 : -1;
    btn.innerHTML =
      '<svg class="tab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      b.ic + '</svg>' + esc(b.nom) +
      (sonlar && sonlar[b.id] ? '<span class="n">' + fmtNum(sonlar[b.id]) + '</span>' : "");
    btn.addEventListener("click", function(){ selectTab(b.id); });
    btn.addEventListener("keydown", function(e){
      var i = BOLIMLAR.indexOf(b), j = -1;
      if(e.key === "ArrowRight") j = (i + 1) % BOLIMLAR.length;
      if(e.key === "ArrowLeft")  j = (i - 1 + BOLIMLAR.length) % BOLIMLAR.length;
      if(j < 0) return;
      e.preventDefault();
      selectTab(BOLIMLAR[j].id);
      nav.children[j].focus();
    });
    nav.appendChild(btn);
  });
}

function selectTab(id){
  ST.tab = id;
  saveCfg();
  [].forEach.call(document.querySelectorAll("#tabs button"), function(b, i){
    var faol = BOLIMLAR[i].id === id;
    b.setAttribute("aria-selected", String(faol));
    b.tabIndex = faol ? 0 : -1;
  });
  BOLIMLAR.forEach(function(b){
    var g = document.getElementById("sec-" + b.id);
    if(g) g.hidden = (b.id !== id);
  });
  var kp = document.querySelector(".kpis");
  if(kp) kp.hidden = (id !== "umumiy");
  window.scrollTo({top:0, behavior:"instant"});
}

      'Aks holda server soati (UTC) bo\'yicha: Toshkent uchun +5.</div>' +

      '<div class="row">' +
        '<button class="btn" id="ok">Ulash</button>' +
        '<button class="btn ghost" id="demo">Namunani ko\'rish</button>' +

        '<button class="btn ghost" id="close">Yopish</button>' +

      '<div class="err" id="serr" hidden></div>' +

  document.body.appendChild(sh);

  var drop = sh.querySelector("#drop"), file = sh.querySelector("#file");
  var apiIn = sh.querySelector("#api"), tokIn = sh.querySelector("#tok");
  var urlIn = sh.querySelector("#url");

  tokIn.value = api.token || "";

function loadData(jim){
  if(!ST.src || ST.src.kind === "file" || ST.busy) return;
  ST.jim = !!jim;
  var opt = {cache:"no-store"}, u = ST.src.url;

  if(ST.src.kind === "api"){
    opt.headers = {"X-Dash-Token": ST.src.token};
  } else {
    // Oddiy jadval havolasini CSV eksportiga aylantiramiz
    var m = u.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(m && u.indexOf("output=csv") < 0 && u.indexOf("/pub") < 0){
      var gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
      u = "https://docs.google.com/spreadsheets/d/" + m[1] + "/export?format=csv" + (gid ? "&gid=" + gid : "");
    }
  }

  ST.busy = true;
  var btn = document.getElementById("refresh");
  if(btn){ btn.disabled = true; btn.classList.add("aylanmoqda"); }

  // Server tarmog'i beqaror: katta javob ba'zan yo'lda qotib qoladi. Uzoq
  // kutib o'tirmaymiz — uzib, bir marta qaytadan so'raymiz.
  function sora(urinish){
    var ctrl = new AbortController();
    var soat = setTimeout(function(){ ctrl.abort(); }, 25000);
    var o = {cache:opt.cache, signal:ctrl.signal};
    if(opt.headers) o.headers = opt.headers;
    return fetch(u, o).then(function(r){ clearTimeout(soat); return r; })
      .catch(function(e){
        clearTimeout(soat);
        if(urinish < 2){ return sora(urinish + 1); }
        throw (e && e.name === "AbortError") ? new Error("server javob bermadi") : e;
      });
  }

  sora(1).then(function(r){
    if(r.status === 403) throw new Error("kalit to'g'ri kelmadi");
    if(!r.ok) throw new Error("server javobi " + r.status);
    return r.text();
  }).then(function(t){
    if(/^\s*</.test(t)) throw new Error("CSV emas — havola ochiq nashr havolasi bo'lishi kerak");
    var rows = buildRows(parseCSV(t));
    if(!rows.length) throw new Error("yozuv topilmadi");
    ST.rows = rows; ST.demo = false; ST.err = null; ST.loadedAt = new Date();
    ST.people = null;
    done(); render(); loadReasons();
  }).catch(function(e){
    ST.err = "Ulanmadi: " + e.message + ". «Ma'lumot manbai» dan tekshiring yoki CSV faylni tashlang.";
    if(!ST.rows.length || ST.demo){ ST.rows = demoRows(); ST.demo = true; }
    done(); render();
  });

  function done(){
    ST.busy = false;
    setTimeout(function(){ ST.jim = false; }, 0);   // keyingi chizish yana jonli
    if(btn){ btn.disabled = false; btn.classList.remove("aylanmoqda"); }
  }
}

/* Sabablar bazadan alohida keladi (Sheets'da yo'q). Faqat jonli ulanishda. */
function loadReasons(){
  if(!ST.src || ST.src.kind !== "api"){ ST.leave = null; return; }
  var u = ST.src.url.replace(/\/api\/loglar\b/, "/api/sabablar");
  if(u === ST.src.url) u = ST.src.url.replace(/[^\/]*$/, "sabablar");
  fetch(u, {cache:"no-store", headers:{"X-Dash-Token": ST.src.token}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.ok) return;
      ST.leave = j.rows.map(function(r){
        var t = new Date(r.t);
        return isNaN(t) ? null : {t:t, asked:r.asked, reason:r.reason, comment:r.comment, back:r.back, uid:r.uid};
      }).filter(Boolean).sort(function(a,b){ return a.t - b.t; });
      render();
    })
    .catch(function(){ /* eski bot bo'lsa bo'lim ko'rsatilmaydi */ });
}

/* ───────── Namuna ma'lumot ───────── */
function demoRows(){
  // Deterministik: har ochilganda bir xil ko'rinadi.
  var seed = 20260921;
  function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }
  function pick(a){ return a[Math.floor(rnd()*a.length)]; }
  var names = ["Diyor","Malika","Sardor","Nilufar","Javohir","Zilola","Anvar","Kamola","Bekzod","Sevara",
               "Otabek","Gulnoza","Rustam","Dilnoza","Shohruh","Aziza","Ulug'bek","Madina","Farrux","Nodira"];
  var users = [];
  for(var i=0; i<220; i++) users.push({id:"7" + (100000000 + i*37), n:pick(names), u:"@" + pick(names).toLowerCase() + i});
  var films = Object.keys(FILMS);
  var raw = [], now = new Date(), day;
  for(var d=44; d>=0; d--){
    day = new Date(now.getFullYear(), now.getMonth(), now.getDate()-d);
    var vol = 18 + Math.round(rnd()*26) + Math.round((44-d)*0.7);
    for(var k=0; k<vol; k++){
      var u = users[Math.floor(rnd()*Math.min(users.length, 40 + (44-d)*4))];
      var hour = [19,20,21,22,18,20,21,13,15,9,23,17][Math.floor(rnd()*12)];
      var t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hour, Math.floor(rnd()*60), Math.floor(rnd()*60));
      var roll = rnd(), p;
      if(roll < .12) p = "start";
      else if(roll < .17) p = "subscribed";
      else if(roll < .58){
        var fi = Math.floor(Math.pow(rnd(), 1.7)*films.length);
        p = (rnd() < .62 ? "web_" : "bot_") + films[fi] + "_" + (rnd() < .68 ? "uz" : rnd() < .8 ? "ru" : "en");
      }
      else if(roll < .63) p = "sort_start";
      else if(roll < .68) p = "house_" + pick(["gryffindor","slytherin","ravenclaw","hufflepuff"]);
      else if(roll < .72) p = "wand_holly_phoenix_supple";
      else if(roll < .76) p = "share_hp3_uz";
      else if(roll < .80) p = "src_" + pick(["kanal","marvel","kino","instagram"]);
      else if(roll < .84) p = "invited_7100000123";
      else if(roll < .87) p = "ref_awarded";
      else if(roll < .90) p = "bekor_hp4";
      else if(roll < .93) p = "left";
      else if(roll < .95) p = "blocked";
      else p = "start";
      raw.push([u.id, u.n, u.u, p,
        t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0") +
        " " + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0") + ":" +
        String(t.getSeconds()).padStart(2,"0")]);
    }
  }
  var keep = ST.tz; ST.tz = 0;
  var out = buildRows(raw);
  ST.tz = keep;
  return out;
}

/* ───────── Boshlash ───────── */
/* ───────── Davr menyusi ─────────
   Ilgari davrlar ham, bo'limlar ham gorizontal qator edi — ikkita bir xil
   ko'rinishdagi navigatsiya yonma-yon turib, ko'z qaysi biri nima ekanini
   ajrata olmasdi. Endi bo'limlar yagona gorizontal qator, davr esa menyu. */
(function(){
  var btn = document.getElementById("davr-btn");
  var menu = document.getElementById("davr-menu");
  var nom = document.getElementById("davr-nom");
  var panel = document.getElementById("range-pick");
  var f = document.getElementById("d-from"), t = document.getElementById("d-to");
  var xato = document.getElementById("d-err");

  var TAYYOR_KUN = [
    {d:1,  n:"Bugun"}, {d:7, n:"7 kun"}, {d:30, n:"30 kun"},
    {d:90, n:"90 kun"}, {d:0, n:"Butun tarix"}
  ];

  function oxirgiKun(){
    return ST.rows.length ? new Date(ST.rows[ST.rows.length-1].t) : new Date();
  }
  function dushanba(d){
    var k = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    k.setDate(k.getDate() - ((k.getDay() + 6) % 7));
    return k;
  }
  /* Tayyor oraliqlar oxirgi YOZUV kunidan hisoblanadi, bugungi sanadan emas:
     loglar kecha to'xtagan bo'lsa "shu hafta" bo'm-bo'sh chiqmasin. */
  var TAYYOR_ORALIQ = [
    {n:"Shu hafta",   f:function(){ var b = oxirgiKun(); return [dushanba(b), b]; }},
    {n:"O'tgan hafta",f:function(){
      var d = dushanba(oxirgiKun());
      return [new Date(d.getFullYear(), d.getMonth(), d.getDate()-7),
              new Date(d.getFullYear(), d.getMonth(), d.getDate()-1)];
    }},
    {n:"Shu oy",      f:function(){ var b = oxirgiKun(); return [new Date(b.getFullYear(), b.getMonth(), 1), b]; }},
    {n:"O'tgan oy",   f:function(){
      var b = oxirgiKun();
      return [new Date(b.getFullYear(), b.getMonth()-1, 1), new Date(b.getFullYear(), b.getMonth(), 0)];
    }}
  ];

  function nomla(){
    if(ST.oraliq){
      var a = kunOqi(ST.oraliq.from), b = kunOqi(ST.oraliq.to);
      nom.textContent = (a && b) ? (fmtDay(kunYoz(a)) + " – " + fmtDay(kunYoz(b))) : "O'z davrim";
    } else {
      var x = TAYYOR_KUN.filter(function(y){ return y.d === ST.days; })[0];
      nom.textContent = x ? x.n : (ST.days + " kun");
    }
  }
  window._davrBelgila = nomla;

  function yop(){
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    document.removeEventListener("click", tashqi, true);
  }
  function tashqi(e){
    if(!menu.contains(e.target) && !btn.contains(e.target)) yop();
  }

  function quri(){
    menu.innerHTML = "";
    TAYYOR_KUN.forEach(function(x){
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitemradio");
      b.setAttribute("aria-checked", String(!ST.oraliq && ST.days === x.d));
      b.textContent = x.n;
      b.addEventListener("click", function(){
        ST.days = x.d; ST.oraliq = null;
        saveCfg(); nomla(); yop(); render();
      });
      menu.appendChild(b);
    });

    var s1 = document.createElement("div"); s1.className = "ajrat"; menu.appendChild(s1);
    var h = document.createElement("div"); h.className = "sarlavha"; h.textContent = "Taqvim bo'yicha";
    menu.appendChild(h);

    TAYYOR_ORALIQ.forEach(function(x){
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitem");
      b.textContent = x.n;
      b.addEventListener("click", function(){
        var p2 = x.f();
        ST.oraliq = {from: kunYoz(p2[0]), to: kunYoz(p2[1])};
        saveCfg(); nomla(); yop(); panel.hidden = true; render();
      });
      menu.appendChild(b);
    });

    var s2 = document.createElement("div"); s2.className = "ajrat"; menu.appendChild(s2);
    var oz = document.createElement("button");
    oz.type = "button"; oz.setAttribute("role", "menuitem");
    oz.textContent = "O'z davrim…";
    oz.setAttribute("aria-checked", String(!!ST.oraliq));
    oz.addEventListener("click", function(){
      yop();
      panel.hidden = false;
      if(ST.rows.length){
        var w = windowOf(ST.days);
        f.value = ST.oraliq ? ST.oraliq.from : kunYoz(w.from);
        t.value = ST.oraliq ? ST.oraliq.to : kunYoz(w.to);
        f.min = t.min = kunYoz(ST.rows[0].t);
        f.max = t.max = kunYoz(ST.rows[ST.rows.length-1].t);
      }
      f.focus();
    });
    menu.appendChild(oz);
  }

  btn.addEventListener("click", function(){
    if(!menu.hidden){ yop(); return; }
    quri();
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    setTimeout(function(){ document.addEventListener("click", tashqi, true); }, 0);
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") yop(); });

  document.getElementById("d-ok").addEventListener("click", function(){
    var a = kunOqi(f.value), b = kunOqi(t.value);
    if(!a || !b){ xato.hidden = false; xato.textContent = "Ikkala sanani ham tanlang."; return; }
    xato.hidden = true;
    ST.oraliq = {from: kunYoz(a > b ? b : a), to: kunYoz(a > b ? a : b)};
    saveCfg(); nomla(); panel.hidden = true; render();
  });
  document.getElementById("d-clear").addEventListener("click", function(){
    ST.oraliq = null; xato.hidden = true;
    saveCfg(); nomla(); panel.hidden = true; render();
  });
})();

/* ───────── To'liq ekran ─────────
   Chrome'da sahifani to'liq ekranga o'tkazadigan menyu yo'q, shuning uchun
   o'z tugmamiz va F qisqartmasi. */
function toliqEkran(){
  var d = document.documentElement;
  var ichkarida = document.fullscreenElement || document.webkitFullscreenElement;
  try{
    if(ichkarida){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    }
  }catch(e){}
}
document.getElementById("fullscr").addEventListener("click", toliqEkran);
["fullscreenchange", "webkitfullscreenchange"].forEach(function(n){
  document.addEventListener(n, function(){
    var b = document.getElementById("fullscr");
    var ichkarida = !!(document.fullscreenElement || document.webkitFullscreenElement);
    b.title = (ichkarida ? "To'liq ekrandan chiqish" : "To'liq ekran") + " (F)";
    b.classList.toggle("yoniq", ichkarida);
  });
});
document.addEventListener("keydown", function(e){
  if(e.key !== "f" && e.key !== "F") return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  // Sana yoki havola yozayotganda "f" harfini o'g'irlamaymiz
  var t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  e.preventDefault();
  toliqEkran();
});

document.getElementById("open-src").addEventListener("click", openSheet);
document.getElementById("refresh").addEventListener("click", function(){
  if(ST.src && ST.src.kind !== "file") loadData();
  else openSheet();
});

loadCfg();
if(window._davrBelgila) window._davrBelgila();
ST.rows = demoRows();
ST.loadedAt = new Date();
render();
if(ST.src && ST.src.kind !== "file"){
  loadData();
  // Jonli ulanishda panel o'zi yangilanib turadi (serverda ham 2 daqiqalik kesh bor).
  setInterval(function(){ loadData(true); }, 120000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && ST.loadedAt && Date.now() - ST.loadedAt > 120000) loadData(true);
  });
}
</script>
